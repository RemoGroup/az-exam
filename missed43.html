<style>
  :root { --bg:#10211c; --paper:#f6f1e7; --ink:#1c1915; --muted:#5c564c; --good:#1f6b4a; --bad:#8d2f2f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; }
  body {

  .nav { height:56px; border:0; border-radius:16px; background:#1c3a31; color:#f6f1e7; font-size:28px; }

<script>
const ALL = [{"id": 4, "stem": "A series of buyers conspire to divide lots without obtaining a public report. This would be known as what?", "choices": ["Division of Parties", "Collision of Parties", "Breach of Trust", "Acting in Concert"], "correct": 3, "why": "When several people work together to split land and dodge the subdivision rules, Arizona calls it acting in concert.", "missed": true}, {"id": 10, "stem": "A property owner records a beneficiary deed naming their niece as the beneficiary. Later, the owner writes a will leaving the same property to their nephew. Upon the owner's death, who receives the property?", "choices": ["The nephew, because a will is the most recent expression of the decedent's intent.", "The niece, because a valid beneficiary deed is not revoked by the provisions of a will and takes precedence.", "Both, as they become tenants in common by operation of law.", "Neither; the property must go through probate to resolve the conflict."], "correct": 1, "why": "A recorded beneficiary deed controls over a will, so the niece gets the property.", "missed": true}, {"id": 11, "stem": "To qualify for protection under Arizona\u2019s Anti-Deficiency Statutes during a Trustee's Sale (non-judicial foreclosure), which criteria must the property meet?", "choices": ["It must be more than 2.5 acres and used for a commercial purpose.", "It must be 2.5 acres or less and utilized as a single one or two-family dwelling.", "It must be a purchase-money loan only; refinanced loans are not protected.", "It must be the owner's primary residence; rental properties do not qualify."], "correct": 1, "why": "Arizona's anti-deficiency protection covers property of 2.5 acres or less used as a one- or two-family home.", "missed": true}, {"id": 12, "stem": "What happens to a bill in Arizona if the second chamber amends it after it crosses over from the chamber of origin?", "choices": ["It is automatically sent to the Governor for signature.", "It is returned to the chamber of origin and voted on again without further review.", "The differences between the House and Senate versions must be reconciled in a conference committee.", "The Governor may veto it before the two chambers meet."], "correct": 2, "why": "When the two chambers pass different versions of a bill, a conference committee works out the differences.", "missed": true}, {"id": 13, "stem": "An Arizona property owner executes and records a beneficiary deed naming their adult child as the beneficiary. The owner later drafts a will that leaves all property to a charitable organization. The owner then dies without revoking the beneficiary deed. Evaluate which party will receive the property and explain why.", "choices": ["The charitable organization, because a will executed after a deed takes legal precedence over the deed.", "The adult child, because a valid, recorded beneficiary deed supersedes a conflicting devise in a will.", "The estate, because the property must pass through probate to resolve the conflict between the deed and the will.", "The charitable organization, because beneficiary deeds are automatically revoked when a new will is executed."], "correct": 1, "why": "A valid recorded beneficiary deed beats a conflicting gift in a will, so the adult child takes title.", "missed": true}, {"id": 14, "stem": "Analyze the 1:1 purchaser-to-accommodation ratio requirement for Arizona timeshares. How are delinquent owners treated in this calculation?", "choices": ["Delinquent owners are excluded from the ratio to allow the developer to resell the interval.", "Delinquent owners are counted as still eligible to use accommodations to prevent the reselling of the same interval before foreclosure.", "The ratio only applies to owners who have paid their assessments in full for the current year.", "The developer can ignore the ratio if the project is less than 50% sold."], "correct": 1, "why": "Delinquent owners still count as owners in the 1:1 ratio, so the developer can't oversell accommodations.", "missed": true}, {"id": 17, "stem": "A licensee offers a \u201cfree home warranty\u201d but fails to disclose terms and conditions. What is the issue?", "choices": ["It is illegal to offer incentives", "The term \u201cfree\u201d is prohibited", "Lack of required written disclosure", "It must be approved by the Commissioner"], "correct": 2, "why": "Any \"free\" offer in an ad must clearly disclose its terms and conditions, so leaving them out is a violation.", "missed": true}, {"id": 20, "stem": "In Arizona, what is the maximum finder fee that can be paid to an unlicensed person who is a tenant in an apartment complex managed by the firm?", "choices": ["$100", "$500", "$1,000", "It is based on a percentage of the monthly rent The maximum that a tenant can earn from referrals is $1000 per any year."], "correct": 2, "why": "Arizona caps finder fees to unlicensed tenants at $1,000 per year.", "missed": true}, {"id": 31, "stem": "When broker Adam discovers that one of the agents in the brokerage has been doing property management on the side, what can he do to show adequate supervision of salespersons by a broker according to Arizona Commissioner\u2019s Rules?", "choices": ["Discuss the problems with Adam directly and put a note in the employee file.", "Confirm that the agent is licensed and property trained by the broker.", "Affirm that all contracts are turned in, reviewed and a trust account is set up.", "Notify ADRE of the action and self report along with agent."], "correct": 3, "why": "A broker must supervise, so self-reporting the agent's unlicensed side activity to ADRE shows proper oversight.", "missed": true}, {"id": 37, "stem": "What is a requirement for advertising by licensees according to Arizona Administrative Code?", "choices": ["Including the licensee\u2019s personal contact information only", "Stating the office and location of their brokerage", "Using the term \u201cacre\u201d accurately according to specific measurements", "Advertising without the employing broker\u2019s name in digital mediums"], "correct": 2, "why": "Ads must use measurement terms like \"acre\" accurately so buyers are not misled.", "missed": true}, {"id": 38, "stem": "What is required for an Arizona broker to open a branch office?", "choices": ["A separate brokerage license for each branch office", "Approval from the Arizona Real Estate Department", "A designated branch manager who is with that brokerage", "All of these are required"], "correct": 2, "why": "A branch office needs a branch manager who is licensed with that same brokerage.", "missed": true}, {"id": 39, "stem": "What must a licensee do if engaged in unlawful license activity?", "choices": ["Cease all real estate activities immediately", "Notify ADRE and provide a written explanation of the activity", "Pay a fine to ADRE", "Attend a mandatory ethics course"], "correct": 1, "why": "A licensee who finds they are acting unlawfully must stop, notify ADRE, and explain in writing.", "missed": true}, {"id": 42, "stem": "When an agent has been terminated for failure to renew their license on time, how many months do they have to renew?", "choices": ["3", "6", "12", "Not possible to renew once terminated. Once they are terminated, they are no longer eligible to renew, and must start all over again. This means, they were NOT in the grace period and they are NOT eligible to renew at all."], "correct": 3, "why": "Advertising another broker's listing requires written consent from your own employing broker.", "missed": true}, {"id": 46, "stem": "Which scenario best illustrates a breach of the duty of loyalty by a real estate agent?", "choices": ["The agent advises the client to accept an offer that is below the listing price for a quicker sale.", "An agent purchases a property listed by them on behalf of a family member.", "Sharing confidential client information with another agent within the same brokerage.", "Refusing to present a lowball offer to the seller."], "correct": 1, "why": "Buying a listing for a relative without disclosure puts the agent's interests above the client's, breaching loyalty.", "missed": true}, {"id": 47, "stem": "Which statement accurately reflects the requirements for a brokerage's trust account?", "choices": ["It must be reconciled quarterly.", "Only the designated broker can authorize disbursements.", "Funds from multiple clients can be mixed if records are maintained.", "It is not required if the brokerage does not hold client funds."], "correct": 1, "why": "Trust account disbursements must be authorized by the designated broker, who is responsible for those funds.", "missed": true}, {"id": 48, "stem": "There are multiple types of listing agreements available in Arizona. When a broker has a coming soon listing, what would that most likely imply?", "choices": ["The property is not officially on the market and may not be for up to 10 days.", "The property is available for previews by appointment only.", "Agents must market the listing as if it were active.", "Offers can be made but not accepted until the listing is active."], "correct": 2, "why": "Under this course's answer, a \"coming soon\" listing is treated as a real listing that must be marketed by the rules like an active one.", "missed": true}, {"id": 51, "stem": "How does Arizona define the termination of a brokerage agreement?", "choices": ["Automatic upon the death of the salesperson.", "Only by mutual agreement of all parties involved.", "Through written notice by either party as outlined in the agreement.", "Expiration of the agreement without the possibility of renewal."], "correct": 2, "why": "Confidential client information must be kept confidential forever, even after the agency ends.", "missed": true}, {"id": 57, "stem": "How does bankruptcy typically affect real estate contracts?", "choices": ["It invalidates all existing contracts", "It has no impact on contracts", "It may negate an agency relationship, preventing performance", "It automatically transfers property ownership"], "correct": 2, "why": "Bankruptcy can end the agency relationship and keep the parties from performing the contract.", "missed": true}, {"id": 62, "stem": "The owner of a Co-Op unit has a _____________ to show their interest in the prperty.", "choices": ["Affidavit of Ownership", "Deed", "Trust Certificate", "Proprietary Lease"], "correct": 3, "why": "A co-op owner holds shares plus a proprietary lease that gives the right to occupy a unit.", "missed": true}, {"id": 66, "stem": "What defines a Community Facilities District?", "choices": ["A zone where only community services are provided", "A special taxing district for public improvements", "An area designated for educational institutions", "A district exempt from property taxes"], "correct": 1, "why": "A Community Facilities District is a special taxing district that pays for public improvements.", "missed": true}, {"id": 71, "stem": "How are Native American water rights typically established in Arizona?", "choices": ["Through executive orders by the Governor of Arizona", "By federal legislation specific to each tribe", "Through treaties and court decisions", "By agreements directly with the Arizona Department of Water Resources"], "correct": 2, "why": "Native American water rights come from treaties and federal court decisions.", "missed": true}, {"id": 72, "stem": "In Arizona water law, in what area can ground water be separated and sold apart from the actual land?", "choices": ["Anywhere in Arizona with permission from the State", "Only within Native American Soverign Territories", "Only in a Irrigation Non-Expansion Area", "Only in an Active Management Area"], "correct": 3, "why": "Under Arizona's 1980 Groundwater Management Act, groundwater in an Active Management Area can be severed and sold apart from the land.", "missed": true}, {"id": 76, "stem": "Sick Building Syndrome (SBS) is characterized by:", "choices": ["The financial burden of maintaining older buildings", "Symptoms of illness by occupants without a specific cause", "Buildings being condemned due to historical significance", "Structural instability and the risk of collapse"], "correct": 1, "why": "Sick Building Syndrome means people feel sick in a building, but no specific cause is found.", "missed": true}, {"id": 82, "stem": "How does the Arizona 811 (Blue Stake) program benefit land developers?", "choices": ["By marking property boundaries", "By identifying and marking underground utilities before excavation", "By staking claim to undeveloped land parcels", "By providing a warranty for construction materials"], "correct": 1, "why": "Arizona 811 marks buried utility lines before digging, so developers avoid hitting them.", "missed": true}, {"id": 88, "stem": "What is the primary role of endorsements in a title insurance policy?", "choices": ["To extend the coverage period beyond the standard term", "To tailor the policy to fit specific needs of the insured", "To reduce the premium costs for the homeowner", "To increase the liability limit of the standard policy"], "correct": 1, "why": "Endorsements add or change coverage to fit the insured's specific needs.", "missed": true}, {"id": 94, "stem": "In wich of the following ways could HUD enforce fair housing laws?", "choices": ["By sending undercover testers to investigate compliance", "Through online surveys only", "By reviewing public records for discriminatory practices", "Solely based on written complaints"], "correct": 0, "why": "HUD uses undercover testers to check whether fair housing laws are followed.", "missed": true}, {"id": 98, "stem": "How is a lease impacted by the sale of the leased property?", "choices": ["The lease is automatically terminated upon sale.", "The new owner must honor the existing lease terms.", "The tenant has the first right to purchase the property.", "The lease terms can be renegotiated with the new owner."], "correct": 1, "why": "A sale does not end a lease; the new owner takes the property subject to the existing lease.", "missed": true}, {"id": 110, "stem": "What is the purpose of the Underwriting Fee in home loans?", "choices": ["To insure the property", "To prepare the loan and associated paperwork", "To cover the cost of property appraisal", "To pay for the loan origination"], "correct": 1, "why": "The underwriting fee pays the lender to evaluate and process the loan.", "missed": true}, {"id": 133, "stem": "Under what regulatory body are pest inspection companies and inspectors licensed in Arizona?", "choices": ["Board of Technical Registration", "Pest Management Division of the Department of Agriculture", "Arizona Department of Financial Institutions", "Registrar of Contractors"], "correct": 1, "why": "Arizona pest control companies and inspectors are licensed by the Pest Management Division of the Department of Agriculture.", "missed": true}, {"id": 139, "stem": "How frequently must Broker Trust bank accounts undergo reconciliation?", "choices": ["Weekly", "Monthly", "Quarterly", "Annually"], "correct": 1, "why": "Arizona requires the broker to reconcile trust accounts every month.", "missed": true}, {"id": 141, "stem": "Al, Bea and Cam are all equal owners and have joint tenancy. If Cam were to sell his interest to Dale and then Bea suddenly dies, what is the ownership now?", "choices": ["Dale is now tenant in common with Al who owns 2/3 and Dale owns 1/3", "Dale is now tenant in common with Al as 1/2 and 1/2 equal owners", "Al,Bea\u2019s heirs and Dale are all equal 1/3 owners as tenants in common", "Al and Dale are equal joint tenants and Bea\u2019s heir has a tenant in common status"], "correct": 0, "why": "Cam's sale breaks the joint tenancy only for his share, so Dale is a tenant in common with 1/3; Al gets Bea's share by survivorship and holds 2/3.", "missed": true}, {"id": 142, "stem": "Which of the following statements is true regarding a broker's trust account?", "choices": ["The broker may pay other bills with the portion of the money that represents commissions due", "A salesperson can be a signatory on the account", "It may contain up to $300 of the broker's personal funds", "The trust account must be bonded"], "correct": 1, "why": "With the designated broker's written permission, a salesperson may sign on the trust account.", "missed": true}, {"id": 144, "stem": "Most homes in Arizona are sold with legal descriptions that state?", "choices": ["Metes and bounds", "Latitude and longitude", "Lot and block", "Township and range"], "correct": 2, "why": "Most Arizona homes are in recorded subdivisions, so they use lot and block descriptions.", "missed": true}, {"id": 150, "stem": "In determining the full cash value of real property for taxation purposes, the county assessor utilizes all of the following data EXCEPT?", "choices": ["Affidavits of property value filed for comparable property", "Building permits issued for renovation purposes", "Comments from the local zoning authority", "Reports from the assessor's field appraisers"], "correct": 2, "why": "The assessor uses market data, not zoning authority comments, to find full cash value.", "missed": true}, {"id": 159, "stem": "There are many items that are required in a valid listing agreement, which of the following is not required?", "choices": ["The signature of the principal or parties representing the principal", "Any and all material terms", "Any sort of provision for an automatic renewal", "The beginning date and termination date"], "correct": 2, "why": "A valid listing agreement must not include automatic renewal, so that is the one not required.", "missed": true}, {"id": 160, "stem": "When dealing with ______________, agents are expected to have an understanding and basic level of knowledge concerning environmental laws but not expected to be experts.", "choices": ["Real estate laws and procedures", "Fiduciary duties", "Environmental Hazards", "Contracts"], "correct": 2, "why": "Agents must know enough about environmental hazards to spot n agreement that shows the length of tenancy and how much rent is to be paid", "Becky's lease has expired but the building owner agrees to let her stay until the new owners who are in the process of selling their house are ready to move in", "The owner has complete and free enjoyment of the property"], "correct": 2, "why": "Staying on with the owner's permission after a lease ends, with no set end date, is an estate at will.", "missed": true}, {"id": 176, "stem": "The Arizona real estate commissioner may perform each of the following duties, EXCEPT?", "choices": ["Hire and fire the employees of the state real estate department", "Revoke a license upon complaint of fraud", "Inspect the business records of a licensee at any time", "Investigate complaints against licensees"], "correct": 1, "why": "The Commissioner cannot revoke a license just because a complaint was filed; a hearing is required first.", "missed": true}, {"id": 177, "stem": "A first time home buyer sees a model home and loves it. The builder is an Arizona local builder. He later enters into a contract to build a home just like the existing model home. After multiple delays, he wants to cancel the contract. Can he do this?", "choices": ["If it is within the grace period, he can", "The buyer can do this within 3 days", "If construction hasn't started, the buyer will be able to cancel", "The buyer is not able to rescind the contract"], "correct": 3, "why": "Under this course's answer, a buyer building from a model home with a local builder has no right to rescind this contract.", "missed": true}];
const MODE = "missed";
const letters = ["A","B","C","D"];
let Q = ALL.slice(), i = 0, right = 0, locked = false, firstTry = true, wrong = [];
const $ = id => document.getElementById(id);
function render() {
  const q = Q[i]; locked = false; firstTry = true;
  $("count").textContent = (i+1) + " / " + Q.length;
  $("stem").textContent = q.stem;
  $("why").hidden = true;
  $("next").disabled = true;
  $("score").textContent = right + " right of " + i;
  const box = $("choices"); box.innerHTML = "";
  q.choices.forEach((t, idx) => {
    const b = document.createElement("button");
    b.className = "choice"; b.textContent = letters[idx] + ". " + t;
    b.addEventListener("click", () => pick(b, idx));
    box.appendChild(b);
  });
}
function finishQ(q) {
  locked = true;
  document.querySelectorAll(".choice").forEach((b, n) => { b.disabled = true; if (n === q.correct) b.classList.add("good"); });
  $("score").textContent = right + " right of " + (i+1);
  $("next").disabled = false;
}
function pick(btn, idx) {
  if (locked) return;
  const q = Q[i], why = $("why");
  if (idx === q.correct) {
    if (firstTry) right++;
    finishQ(q);
    why.hidden = false; why.textContent = q.why;
    return;
  }
  btn.classList.add("bad"); btn.disabled = true;
  if (firstTry) { wrong.push(q); }
  firstTry = false;
  if (MODE === "full") { btn.textContent = "Incorrect"; return; }
  finishQ(q);
  why.hidden = false; why.innerHTML = "";
  const b = document.createElement("b");
  b.textContent = "Correct answer: " + letters[q.correct] + ". " + q.choices[q.correct];
  why.appendChild(b); why.appendChild(document.createTextNode(q.why));
}
function done() {
  const pct = Math.round(100 * right / Q.length);
  $("count").textContent = "Done";
  $("score").textContent = ""; $("next").disabled = true;
  const m = $("main");
  m.innerHTML = '<div class="done"><p>You got <b>' + right + ' of ' + Q.length + '</b> right on the first try (' + pct + '%).</p>' + (pct >= 75 ? '<p>That is a passing score (75%).</p>' : '<p>Passing is 75%.</p>') + '</div>';
  const d = m.firstChild;
  if (wrong.length) { const r = document.createElement("button"); r.textContent = "Retry the " + wrong.length + " I missed"; r.onclick = () => restart(wrong); d.appendChild(r); d.appendChild(document.createElement("br")); }
  const a = document.createElement("button"); a.textContent = "Start over"; a.onclick = () => restart(ALL); d.appendChild(a);
}
function restart(list) {
  Q = list.slice(); i = 0; right = 0; wrong = [];
  $("main").innerHTML = '<p class="stem" id="stem"></p><div class="choices" id="choices"></div><div class="why" id="why" hidden></div>';
  render();
}
$("next").addEventListener("click", () => { if (i < Q.length-1) { i++; render(); } else done(); });
render();
</script></body></html>
