 of expertise in writing if the client still hires the salesperson.", "never, because the rules forbid every listing that is not a house."], "correct": 2, "why": "Work outside the licensee's competence requires a competent person to be brought in, or a written disclosure of the lack of expertise if the client still proceeds, silence is not enough, non-house listings are not banned outright, and a document fee does not create competence."}, {"id": "A37", "topic": "licensee competencies", "stem": "Collecting rent for another person, for compensation, is", "choices": ["always a clerical task that needs no license.", "a broker activity.", "legal for an unlicensed friend as long as no receipt is given.", "the same thing as a homestead exemption."], "correct": 1, "why": "Collecting rent for another person for compensation is a broker activity, it is not automatically clerical work that needs no license, skipping a receipt does not make an unlicensed collection legal, and a homestead is unrelated."}, {"id": "A38", "topic": "reasonable skill and care (taxes, water, environment as Arizona tests them)", "stem": "The Arizona water-resources overview used for this prep states a safe-yield goal for which active management areas?", "choices": ["All eight of them", "Joseph City, Harquahala, and Flagstaff", "Phoenix, Prescott, and Tucson", "Only Pinal and Willcox"], "correct": 2, "why": "The overview states the safe-yield goal for Phoenix, Prescott, and Tucson, not for all eight areas, Joseph City and Harquahala are irrigation non-expansion areas and Flagstaff is not on the list, and the goal is not stated for only Pinal and Willcox."}, {"id": "A39", "topic": "regulatory framework", "stem": "A salesperson's renewal education is", "choices": ["24 credit hours in each two-year license period.", "only the six-hour contract-writing course, repeated at every renewal.", "not required while the license is active.", "90 hours at every renewal."], "correct": 0, "why": "A salesperson completes 24 credit hours in each two-year license period, the six-hour contract-writing course is required before the original license rather than as the whole renewal, an active license does not skip the hours, and 90 hours is the original prelicense education."}, {"id": "A40", "topic": "consumer protection", "stem": "A subdivider has a public report on an eight-lot subdivision. Before the initial buyer signs the purchase contract, the subdivider must", "choices": ["hand the report over within three years after closing.", "use an affidavit of disclosure instead of the public report.", "deliver the report only if the buyer sends a written request.", "give that buyer a copy of the public report and take a receipt."], "correct": 3, "why": "The subdivider must give the initial buyer a copy of the public report and take a receipt before that buyer signs, delivery years after closing is too late, the affidavit is the other track for five or fewer unsubdivided parcels and does not replace the report, and delivery does not wait for a written request."}, {"id": "A41", "topic": "advertising", "stem": "A licensee's website offers Arizona property to people in Arizona, and the reader must scroll to see the employing broker's name. This", "choices": ["is not allowed, because the broker's legal name or licensed dba must be clear and prominent without scrolling.", "is allowed if the name appears somewhere on the site.", "is allowed if the salesperson's first name is at the top.", "is allowed because the designated broker is not responsible for online ads."], "correct": 0, "why": "The employing broker's legal name or the dba on the license must be clear and prominent, and an online ad aimed at Arizona residents must meet the advertising rules without scrolling, so a name below the fold is not enough, a first name is not the required identification, and the designated broker is responsible for the advertising."}, {"id": "A42", "topic": "escrow, title, lending", "stem": "At an Arizona closing, the owner's title policy and the lender's title policy", "choices": ["insure the buyer against future zoning changes.", "take the place of flood insurance.", "are one policy, and either name may be used.", "protect the buyer, usually up to the purchase price, and the lender, usually up to the loan balance, against covered title defects existing at the policy date, and they are not a home warranty."], "correct": 3, "why": "The owner's policy protects the buyer, usually for the purchase price, and the lender's policy protects the lender, usually for the loan balance, both against covered defects existing at the policy date, they are not interchangeable names for one policy, they do not cover future zoning changes, and they do not replace flood insurance."}, {"id": "A43", "topic": "ownership and encumbrances", "stem": "Identifiable cash proceeds from selling a homestead are protected", "choices": ["forever, with no time limit.", "only when the cash came from a refinance.", "for 18 months or until a new homestead is established, whichever is shorter.", "for 18 months even after the owner has already established a new homestead."], "correct": 2, "why": "Identifiable sale proceeds are protected for 18 months or until a new homestead, whichever is shorter, the protection does not keep running after a new homestead is already in place, it is not forever, and refinance cash is not the protected proceeds."}, {"id": "A44", "topic": "contracts", "stem": "If an agent signs the writing the statute of frauds requires, the agent's authority", "choices": ["may be a verbal okay from the client.", "is supplied automatically by the constitutional drafting rule.", "is supplied by the assessor when the deed is recorded.", "must itself be in writing."], "correct": 3, "why": "The agent's authority to sign must be in writing, a verbal okay is not enough, the drafting rule does not replace written authority to bind the client, and the assessor does not supply that authority."}, {"id": "A45", "topic": "agency", "stem": "The buyer is the salesperson's parent. Before a binding agreement the salesperson must", "choices": ["say nothing if the parent is paying full price.", "disclose that immediate-family interest in writing.", "disclose it only by writing owner/agent on a yard sign.", "wait until the deed is recorded."], "correct": 1, "why": "An immediate-family interest must be disclosed in writing before a binding agreement, full price does not cancel the disclosure, the yard-sign words are a different advertising rule, and disclosure after recording is too late."}, {"id": "A46", "topic": "licensee duties", "stem": "How long does the employing broker keep records of a closed transaction?", "choices": ["Only until the commission is paid", "At least five years after the transaction ends", "One year, the same period used for every rejected offer", "10 business days"], "correct": 1, "why": "Closed transaction records are kept at least five years, one year is the period for a rejected offer that never becomes part of a later contract, 10 business days is the review deadline rather than the retention period, and paying the commission does not end the duty to keep the file."}, {"id": "A47", "topic": "licensee competencies", "stem": "An unlicensed person who works for a broker, collects rent in person only as a clerical duty, and gives a receipt", "choices": ["may negotiate the lease renewal.", "may list the property for sale.", "may take a commission paid directly by the owner.", "is within the clerical carve-out for that rent collection."], "correct": 3, "why": "That in-person clerical rent collection, with a receipt, is carved out of the broker-activity definition, and the carve-out does not authorize negotiating a lease, listing property, or taking a commission directly from the owner."}, {"id": "A48", "topic": "reasonable skill and care (taxes, water, environment as Arizona tests them)", "stem": "Inside an active management area, the commissioner denies a subdivision public report unless the subdivider has", "choices": ["only an irrigation grandfathered right.", "a well permit and nothing more.", "a canal subcontract in every case.", "a certificate of assured water supply, or a written commitment from a designated provider, or a statutory exemption."], "correct": 3, "why": "The public report is denied unless there is an assured water supply, a written commitment from a designated city, town, or private water company, or a statutory exemption, so an irrigation right alone, a well permit alone, and a canal subcontract in every case are not that requirement."}, {"id": "A49", "topic": "regulatory framework", "stem": "A license expired eight months ago and was not canceled or suspended. The licensee", "choices": ["may renew within one year after expiration without a new exam, and may not do licensed work while the license is expired.", "had the license terminated the day after it expired.", "may keep listing property during the expiration.", "must pass the license exam again before any renewal."], "correct": 0, "why": "A license that was not canceled or suspended may be renewed within one year after expiration without a new exam, licensed work is not allowed while it is expired, the exam is not required for that late renewal, and termination for expiration applies after more than one year, not the next day."}, {"id": "A50", "topic": "consumer protection", "stem": "A buyer signs a contract for a subdivision lot, and the subdivider never delivers the public report. The buyer may", "choices": ["collect from the recovery fund with no judgment or other fund procedure.", "do nothing, because recording the deed cures the failure.", "rescind by bringing the action within three years after signing.", "rescind only within five days."], "correct": 2, "why": "Failure to deliver the public report lets the buyer sue to rescind within three years after signing, recording the deed does not cure the failure, the right is not limited to five days, and the recovery fund is not an automatic payment with no judgment."}, {"id": "A51", "topic": "advertising", "stem": "A licensee offers a free home warranty to draw people to a showing and calls that warranty a prize in the ad. The licensee", "choices": ["may use the word prize if the warranty is real.", "must not describe the premium as a prize or an award.", "must use the word prize because the recovery fund requires it.", "may drop the employing broker's name because the prize replaces it."], "correct": 1, "why": "A premium may not be described as an award or a prize, the fact that the warranty is real does not make that word acceptable, the recovery fund does not require the word, and the premium does not replace the broker's name."}, {"id": "A52", "topic": "escrow, title, lending", "stem": "The designated broker must review a purchase contract and initial it", "choices": ["within 10 business days after execution.", "within 10 calendar days, counting Sunday.", "only if the transaction fails.", "within 91 days."], "correct": 0, "why": "The designated broker must review and initial the contract within 10 business days after execution, a business day is not Saturday, Sunday, or a legal holiday, so the deadline is not 10 calendar days that count Sunday, review is not required only if the deal fails, and 91 days is not the review deadline."}, {"id": "A53", "topic": "ownership and encumbrances", "stem": "Cash an owner receives by refinancing the homestead", "choices": ["is not protected as homestead proceeds.", "is protected until the owner buys a different house.", "doubles the exemption.", "is protected for 18 months."], "correct": 0, "why": "Refinance cash is not protected, the 18-month rule applies to identifiable sale proceeds rather than to refinance cash, buying another house is the other end of that sale-proceeds period and does not protect refinance cash, and a refinance does not double the exemption."}, {"id": "A54", "topic": "contracts", "stem": "A lease for exactly one year", "choices": ["must be in writing under the clause that covers leases longer than one year.", "is outside that clause, because the clause covers a lease for longer than one year.", "is void in Arizona.", "must be replaced by a subdivision public report."], "correct": 1, "why": "The statute of frauds clause covers a lease for longer than one year, so a lease of exactly one year is outside it, the lease is not void for that reason, and a public report is not a substitute for this lease rule."}, {"id": "A55", "topic": "agency", "stem": "A licensee who cannot perform on a client's transaction must", "choices": ["tell the designated broker right away and not delay the client on purpose or by neglect.", "cancel the other licensee's license.", "keep the problem secret from the designated broker.", "delay the file and hope the other agent gives up."], "correct": 0, "why": "The licensee must perform expeditiously, must not delay on purpose or by neglect, and must tell the designated broker right away if performance is not possible, hoping the other agent quits is a delay, one licensee cannot cancel another's license, and hiding the problem from the broker violates the duty."}, {"id": "A56", "topic": "licensee duties", "stem": "A salesperson earns a commission on a sale. Who may pay that salesperson?", "choices": ["The title company, directly to the salesperson", "The employing broker, or another licensed employer who issues a W-2, has the same employing broker, and has that broker's written permission", "The buyer, in cash, into the salesperson's personal account at the closing table", "The seller, directly to the salesperson"], "correct": 1, "why": "Licensed compensation comes through the employing broker, or through another licensed employer who issues a W-2, shares that employing broker, and has the broker's written permission, so the seller, the title company, and the buyer may not pay the salesperson directly."}, {"id": "A57", "topic": "licensee competencies", "stem": "Using a chain of owners so that land ends up as a subdivision, in order to avoid the subdivision rules, is", "choices": ["a lawful exemption called acting in concert.", "unlawful, and a family relationship by itself does not prove the violation.", "lawful if each deed covers only five parcels.", "cured by putting owner/agent in an advertisement."], "correct": 1, "why": "A series of owners or conveyances used to end in a subdivision and dodge the article is unlawful, a family tie alone does not prove it, splitting the deeds into groups of five does not make the dodge legal, and an owner/agent advertisement does not cure it."}, {"id": "A58", "topic": "reasonable skill and care (taxes, water, environment as Arizona tests them)", "stem": "The Arizona water-resources overview used for this prep names which irrigation non-expansion areas?", "choices": ["Joseph City, Douglas, and Harquahala", "Ranegras Plain only", "Flagstaff and Sedona", "Phoenix and Tucson only"], "correct": 0, "why": "The page names the Joseph City, Douglas, and Harquahala irrigation non-expansion areas, Phoenix and Tucson are active management areas with a safe-yield goal, Ranegras Plain is an active management area, and Flagstaff and Sedona are not the named non-expansion areas."}, {"id": "A59", "topic": "contracts", "stem": "While acting for a party in the transaction, and without a separate charge, the licensee may complete", "choices": ["the seller's will.", "a deed incident to that transaction.", "a lawsuit against the buyer.", "a formal title opinion as the party's lawyer."], "correct": 1, "why": "The drafting permission includes a deed incident to the transaction, it does not include writing a will, filing a lawsuit, or giving a lawyer's title opinion."}, {"id": "A60", "topic": "contracts", "stem": "The permission to draft transaction documents applies", "choices": ["only when the licensee charges a document fee.", "when the licensee is acting as broker or salesperson for a party in that transaction, and not for a separate fee.", "to any person, licensed or not.", "only after the license has expired."], "correct": 1, "why": "The permission applies when the licensee is acting for a party and without a separate fee, a document fee is the opposite of the rule, an unlicensed person does not receive the permission, and an expired license is not authority to draft."}, {"id": "A61", "topic": "contracts", "stem": "A licensee who is already handling a purchase for a client charges that client 350 dollars to fill in the purchase contract. This charge", "choices": ["is the fee that produces a subdivision public report.", "replaces the employing broker's name in advertisements.", "is allowed by the constitutional drafting rule.", "is not allowed, because the instrument must be completed without a separate charge."], "correct": 3, "why": "The drafting rule allows the licensee to complete the instrument only without a separate charge, so the 350 dollar fee is not allowed, the fee does not produce a public report, and it does not replace the broker's name in an ad."}, {"id": "A62", "topic": "agency", "stem": "The seller owns the salesperson's employing brokerage. Before a binding contract, the salesperson must", "choices": ["say nothing, because the seller is the boss.", "disclose it only after closing.", "treat the fact as a blind advertisement and nothing more.", "disclose that interest in writing."], "correct": 3, "why": "The seller's ownership of the employing broker is an interest that must be disclosed in writing before a binding agreement, the seller's position does not cancel the disclosure, after closing is too late, and this is a conflict disclosure rather than a blind-ad rule."}, {"id": "A63", "topic": "licensee duties", "stem": "Two licensees are fighting about a commission, and the client's closing is tomorrow. The licensee", "choices": ["must pay the other licensee from the trust account that night.", "may let the fight delay the closing.", "must not let the fight jeopardize or delay the client's transaction, and need not give up the commission claim to comply.", "must cancel the client to avoid the fight."], "correct": 2, "why": "A dispute with another licensee must not jeopardize, delay, or interfere with the client's transaction, and the licensee does not have to abandon the commission claim, so delaying the closing is not allowed, canceling the client is not the rule, and the trust account is not the way to pay that dispute."}, {"id": "A64", "topic": "advertising", "stem": "Before a licensee places a for-sale sign on a property, the licensee must", "choices": ["get consent only when the lot is smaller than an acre.", "use the sign so the ad can omit the employing broker's name.", "have the owner's written consent, and must remove the sign promptly if the owner asks.", "put the sign up and tell the owner afterward."], "correct": 2, "why": "The licensee needs the owner's written consent before placing a sign and must remove it promptly when the owner asks, telling the owner later is not prior consent, the acre rule does not replace sign consent, and a sign does not excuse the broker's name."}, {"id": "A65", "topic": "regulatory framework", "stem": "A salesperson license has been inactive for 16 years. Which statement is correct?", "choices": ["Continuing education was not required while it was inactive, but a state-law exam is required before activation.", "Inactivity of more than one year terminates a license the same way an expiration of more than one year does.", "The person could keep listing property, because inactive status is the same as active status.", "Continuing education was required every two years while it was inactive, and no exam is needed to activate it."], "correct": 0, "why": "Continuing education is not required while the license is inactive, and inactivity of more than 15 years requires a state-law exam before activation, so a renewal-style education duty during inactivity is wrong, the one-year termination rule is for a license expired more than one year rather than for this inactive status, and inactive status is not permission to keep listing."}]}};
const letters = ["A","B","C","D"];
let exam, i, firstTry, locked, timer, remain;
function start(key) {
  exam = EXAMS[key];
  i = 0; firstTry = 0; remain = exam.seconds;
  document.getElementById("home").hidden = true;
  document.getElementById("done").hidden = true;
  document.getElementById("test").hidden = false;
  tick();
  timer = setInterval(tick, 1000);
  render();
}
function tick() {
  if (remain < 0) remain = 0;
  const m = Math.floor(remain/60), s = remain%60;
  const el = document.getElementById("clock");
  el.textContent = m + ":" + String(s).padStart(2,"0");
  el.classList.toggle("low", remain < 300);
  if (remain === 0) { finish(); return; }
  remain--;
}
function render() {
  const q = exam.items[i];
  locked = false;
  document.getElementById("meta").textContent = exam.name + "  " + (i+1) + " / " + exam.items.length;
  document.getElementById("stem").textContent = q.stem;
  document.getElementById("why").hidden = true;
  document.getElementById("next").disabled = true;
  document.getElementById("score").textContent = firstTry + " right on the first try";
  const box = document.getElementById("choices");
  box.innerHTML = "";
  q.choices.forEach((text, idx) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = letters[idx] + ". " + text;
    b.addEventListener("click", () => pick(b, idx, box.children.length === q.choices.length && [...box.children].every(x => !x.disabled || x.classList.contains("bad")) && ![...box.children].some(x => x.classList.contains("bad"))));
    box.appendChild(b);
  });
}
function pick(btn, idx, clean) {
  if (locked) return;
  const q = exam.items[i];
  const fresh = ![...document.querySelectorAll(".choice")].some(b => b.classList.contains("bad"));
  if (idx !== q.correct) {
    btn.classList.add("bad");
    btn.disabled = true;
    btn.textContent = "Incorrect";
    return;
  }
  locked = true;
  if (fresh) firstTry++;
  document.querySelectorAll(".choice").forEach((b, n) => { b.disabled = true; if (n === q.correct) b.classList.add("good"); });
  const why = document.getElementById("why");
  why.hidden = false;
  why.textContent = q.why;
  document.getElementById("score").textContent = firstTry + " right on the first try";
  document.getElementById("next").disabled = false;
}
document.getElementById("next").addEventListener("click", () => {
  if (i < exam.items.length - 1) { i++; render(); }
  else finish();
});
function finish() {
  clearInterval(timer);
  document.getElementById("test").hidden = true;
  const done = document.getElementById("done");
  const pct = Math.round(100 * firstTry / exam.items.length);
  done.hidden = false;
  done.innerHTML = "<h2>" + firstTry + " / " + exam.items.length + "</h2><p>" + pct + "% right on the first try. The real passing score is 75% of the scored questions. Five questions on each real exam are unscored and mixed in, so this percentage is a practice score, not an official one.</p><button class='exam' id='again'><b>Back to both exams</b><span>National or Arizona</span></button>";
  document.getElementById("again").addEventListener("click", () => { done.hidden = true; document.getElementById("home").hidden = false; });
}
document.getElementById("go-nat").addEventListener("click", () => start("national"));
document.getElementById("go-az").addEventListener("click", () => start("arizona"));
</script>
