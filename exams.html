<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZ exam practice</title>
<style>
  :root { --bg:#10211c; --paper:#f6f1e7; --ink:#1c1915; --good:#1f6b4a; --bad:#8d2f2f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100dvh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--paper); padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); display:flex; flex-direction:column; }
  h1 { font-size:18px; margin:18px 4px 6px; }
  p.sub { margin:0 4px 16px; opacity:.8; font-size:14px; line-height:1.4; }
  .pick { width:min(100%,520px); margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  button.exam { text-align:left; border:0; border-radius:18px; background:var(--paper); color:var(--ink); padding:18px 16px; }
  button.exam b { display:block; font-size:18px; margin-bottom:4px; }
  button.exam span { font-size:14px; color:#5c564c; }
  header { display:flex; justify-content:space-between; align-items:baseline; width:min(100%,520px); margin:12px auto 0; }
  #meta { font-size:14px; opacity:.85; }
  #clock { font-variant-numeric:tabular-nums; font-weight:700; }
  #clock.low { color:#f0b4b4; }
  main { width:min(100%,520px); margin:8px auto 0; flex:1; display:flex; flex-direction:column; gap:12px; }
  .stem { font-family:Georgia,"Iowan Old Style",serif; font-size:22px; line-height:1.35; margin:8px 4px; }
  .choices { display:flex; flex-direction:column; gap:10px; }
  button.choice { text-align:left; border:0; border-radius:16px; background:var(--paper); color:var(--ink); padding:14px 16px; font-size:16px; line-height:1.35; }
  button.choice.bad { background:#f3d6d6; color:var(--bad); }
  button.choice.good { background:#d7eadf; color:var(--good); }
  .why { background:#1c3a31; border-radius:16px; padding:14px 16px; font-size:16px; line-height:1.4; }
  footer { width:min(100%,520px); margin:0 auto; display:grid; grid-template-columns:1fr 72px; gap:10px; padding:12px 0 10px; }
  #score { align-self:center; font-size:14px; opacity:.85; }
  .nav { height:56px; border:0; border-radius:16px; background:#1c3a31; color:#f6f1e7; font-size:28px; }
  .nav:disabled { opacity:.35; }
  #done { width:min(100%,520px); margin:24px auto; }
  #done h2 { font-family:Georgia,serif; font-size:28px; margin:0 0 8px; }
</style>
</head>
<body>
<div id="home">
  <div class="pick">
    <h1>Practice exams</h1>
    <p class="sub">Same length and time as the salesperson exams. A wrong tap says Incorrect. The right tap explains why, in one sentence.</p>
    <button class="exam" id="go-nat"><b>National exam</b><span>85 questions, 150 minutes</span></button>
    <button class="exam" id="go-az"><b>Arizona exam</b><span>65 questions, 90 minutes</span></button>
  </div>
</div>
<div id="test" hidden>
  <header><div id="meta"></div><div id="clock"></div></header>
  <main>
    <p class="stem" id="stem"></p>
    <div class="choices" id="choices"></div>
    <div class="why" id="why" hidden></div>
  </main>
  <footer>
    <div id="score"></div>
    <button class="nav" id="next" disabled aria-label="Next question">›</button>
  </footer>
</div>
<div id="done" hidden></div>
<script>
const EXAMS = {"national": {"name": "National", "seconds": 9000, "items": [{"id": "N1", "topic": "contracts and agency", "stem": "A seller accepts a buyer's offer. Before closing, the seller still holds the deed. The buyer holds", "choices": ["equitable title.", "a life estate.", "no interest until the deed is recorded.", "legal title."], "correct": 0, "why": "Signing the purchase contract gives the buyer equitable title while the seller keeps legal title until the deed is delivered, so the buyer does not yet hold legal title, a life estate is a different estate, and the buyer already has an interest before recording."}, {"id": "N2", "topic": "property characteristics, legal descriptions, land use", "stem": "An acre contains", "choices": ["43,560 square feet.", "640 square feet.", "7,500 square feet.", "5,280 square feet."], "correct": 0, "why": "An acre is 43560 square feet, 5280 is the number of feet in a mile, 640 is the number of acres in a section, and 7500 square feet is not an acre."}, {"id": "N3", "topic": "value and appraisal", "stem": "In the cost approach, an outdated floor plan that buyers dislike is", "choices": ["physical deterioration.", "functional obsolescence.", "external obsolescence.", "regression."], "correct": 1, "why": "A design flaw inside the property is functional obsolescence, physical deterioration is wear, a problem outside the property lines is external obsolescence, and regression is a different value idea."}, {"id": "N4", "topic": "real estate practice, fair housing, antitrust", "stem": "Steering is", "choices": ["directing buyers toward or away from neighborhoods because of a protected class.", "refusing a loan because the property is in a minority neighborhood.", "charging a higher commission only to sellers of vacant land.", "telling owners that a protected class is moving in so they will list now."], "correct": 0, "why": "Steering channels buyers toward or away from areas because of a protected class, pressuring owners to list because a protected class is moving in is blockbusting, a lender refusing loans because of the neighborhood is redlining, and a higher vacant-land commission is not steering."}, {"id": "N5", "topic": "ownership, transfer, recording", "stem": "A quitclaim deed", "choices": ["transfers whatever interest the grantor has, with no warranties.", "is valid between the parties only if it is recorded.", "warrants title against every claim in the chain.", "warrants title only for the time the grantor owned the property."], "correct": 0, "why": "A quitclaim deed transfers whatever interest the grantor has and gives no warranties, so it does not warrant the whole chain or only the grantor's own ownership, and recording is not what makes it valid between the parties."}, {"id": "N6", "topic": "disclosures and environmental", "stem": "A buyer is purchasing a house built in 1972. Federal lead-based paint rules require the seller to", "choices": ["pay for a lead inspection whether or not the buyer asks.", "say nothing unless the buyer is pregnant.", "remove all lead-based paint before closing.", "disclose known lead-based paint and give the buyer the federal pamphlet, with a chance to inspect."], "correct": 3, "why": "For housing built before 1978 the seller must disclose known lead-based paint, give the pamphlet, and give the buyer a chance to inspect unless that chance is waived, while removal is not automatic, the seller need not pay for an inspection the buyer does not ask for, and the duty is not limited to a pregnant buyer."}, {"id": "N7", "topic": "financing and settlement (TRID, RESPA, Reg Z, ECOA, loan types)", "stem": "An ad offers a financed purchase for only 999 dollars a month and states no other credit terms. Under Regulation Z this is", "choices": ["a trigger term, so the ad must also state the other required terms, including the annual percentage rate.", "illegal only if the house was built before 1978.", "a kickback under the settlement statute.", "fine, because stating the annual percentage rate is optional."], "correct": 0, "why": "A payment amount is a trigger term, so the ad must also state the other required credit terms, including the annual percentage rate, that rate is not optional once the trigger is used, the year 1978 does not decide this credit ad, and the missing terms are not a settlement kickback."}, {"id": "N8", "topic": "math", "stem": "A rectangular parcel is 330 feet by 660 feet. How many acres is it?", "choices": ["5", "7 and 56 hundredths", "10", "2"], "correct": 0, "why": "Multiplying 330 by 660 gives 217800 square feet, and dividing 217800 by 43560 gives 5 acres, so 2 acres, 7 and 56 hundredths of an acre, and 10 acres are not that result."}, {"id": "N9", "topic": "contracts and agency", "stem": "Which listing pays the listing broker if the property sells during the term, even when the owner finds the buyer?", "choices": ["Exclusive agency listing", "Exclusive right-to-sell listing", "Net listing", "Open listing"], "correct": 1, "why": "An exclusive right-to-sell listing pays the listing broker no matter who procures the buyer, an open listing pays only the broker who procures the buyer, exclusive agency does not pay the broker if the owner sells alone, and a net listing is a different commission arrangement rather than this promise."}, {"id": "N10", "topic": "property characteristics, legal descriptions, land use", "stem": "A shop tenant bolts display shelves to the wall. The lease says the tenant may remove them. At the end of the lease the shelves are", "choices": ["real property that belongs to the landlord because a bolt is the only test.", "emblements.", "an easement.", "trade fixtures the tenant may remove before the lease ends, repairing damage from the removal."], "correct": 3, "why": "Trade fixtures are personal property installed for the tenant's business and may be removed before the lease ends, intention and the agreement outweigh the bolt, they are not emblements, and they are not an easement."}, {"id": "N11", "topic": "value and appraisal", "stem": "Net operating income is 48000 dollars. Investors want an 8 percent capitalization rate. The indicated value is", "choices": ["520000 dollars.", "600000 dollars.", "3840000 dollars.", "384000 dollars."], "correct": 1, "why": "Value equals net operating income divided by the cap rate, and 48000 divided by 8 hundredths equals 600000, so 384000, 520000, and 3840000 are not that result."}, {"id": "N12", "topic": "real estate practice, fair housing, antitrust", "stem": "A rental ad says no children. Under the federal Fair Housing Act this is", "choices": ["legal whenever the building was built before 1978.", "discrimination based on familial status.", "legal, because age and marital status are the Act's protected classes and children are outside it.", "blockbusting."], "correct": 1, "why": "No children is discrimination based on familial status, age and marital status are credit-law categories rather than classes that make this ad legal, the ad is not blockbusting, and a pre-1978 year does not legalize it."}, {"id": "N13", "topic": "ownership, transfer, recording", "stem": "Which estate ends on a fixed date with no notice required?", "choices": ["Estate at sufferance", "Estate at will", "Periodic estate", "Estate for years"], "correct": 3, "why": "An estate for years ends on a stated date without notice, an estate at will has no fixed end, a periodic estate renews until notice, and estate at sufferance is a holdover."}, {"id": "N14", "topic": "disclosures and environmental", "stem": "The house was built in 1968. The seller has disclosed known lead-based paint and given the pamphlet. The buyer's time to conduct a lead inspection is", "choices": ["three years.", "10 days, unless the parties agree in writing to a different period.", "whatever period the seller picks, with no writing required.", "waived automatically on every pre-1978 house."], "correct": 1, "why": "The buyer has 10 days for a lead inspection or risk assessment unless the parties agree in writing to a different period, the seller may not pick an unwritten period, the time is not waived on every pre-1978 house, and three years is not this inspection window."}, {"id": "N15", "topic": "financing and settlement (TRID, RESPA, Reg Z, ECOA, loan types)", "stem": "On a deed of trust, the borrower is the", "choices": ["mortgagee.", "beneficiary.", "trustor.", "trustee."], "correct": 2, "why": "The borrower is the trustor, the beneficiary is the lender, the trustee holds the power of sale, and mortgagee names the lender on a mortgage rather than the borrower on this deed of trust."}, {"id": "N16", "topic": "math", "stem": "The sale price is 375000 dollars. The commission is 6 percent, split 60 percent to the listing brokerage and 40 percent to the selling brokerage. The selling salesperson receives half of the selling brokerage's share. What does that salesperson earn?", "choices": ["9000 dollars", "11250 dollars", "4500 dollars", "6750 dollars"], "correct": 2, "why": "The total commission is 375000 times 6 percent, which is 22500, the selling brokerage's 40 percent is 9000, and half of that is 4500, while 9000 is the selling brokerage's whole share, 11250 is half of the total commission, and 6750 is half of the listing side."}, {"id": "N17", "topic": "contracts and agency", "stem": "A contract with a minor to buy a house is usually", "choices": ["voidable by the minor.", "valid if the minor paid earnest money.", "unenforceable only because of the statute of frauds.", "void, and neither party can enforce it."], "correct": 0, "why": "A contract with a minor is voidable by the minor and is not automatically void, paying earnest money does not make it binding against the minor, and the statute of frauds is a different defense."}, {"id": "N18", "topic": "property characteristics, legal descriptions, land use", "stem": "A metes-and-bounds description starts at a monument, follows courses and distances, and never returns to the point of beginning. The description is", "choices": ["valid if a street address is added.", "the same thing as a lot-and-block description.", "defective, because the description must close.", "cured by recording a deed of trust."], "correct": 2, "why": "A metes-and-bounds description must return to the point of beginning, so this one is defective, a street address is not a legal description, lot and block uses a recorded plat, and a deed of trust does not repair the description."}, {"id": "N19", "topic": "value and appraisal", "stem": "A factory opens next door and buyers will pay less because of the noise. In the cost approach that loss is", "choices": ["depreciation of the land.", "physical deterioration.", "external obsolescence, and the land is not depreciated.", "functional obsolescence."], "correct": 2, "why": "Noise from outside the property lines is external obsolescence, physical deterioration is wear and tear, a bad floor plan inside the house is functional obsolescence, and land is not depreciated."}, {"id": "N20", "topic": "real estate practice, fair housing, antitrust", "stem": "Telling owners that a protected class is moving into the block so they should sell now is", "choices": ["steering.", "blockbusting.", "redlining.", "a lawful comparative market analysis."], "correct": 1, "why": "That pressure is blockbusting, steering channels buyers, redlining is a lender cutting off loans by neighborhood, and a comparative market analysis is not a scare tactic."}, {"id": "N21", "topic": "ownership, transfer, recording", "stem": "Two sisters take title as joint tenants with right of survivorship. One dies. Her will leaves her half to her son. Who owns that share?", "choices": ["The state, by escheat", "The son, because a will always beats survivorship", "The surviving sister, because a will does not defeat a joint tenancy that was still in place at death", "The son and the sister as tenants in common, half each"], "correct": 2, "why": "If the joint tenancy was still intact at death the share passes to the surviving sister and is not in the estate for the will to give away, a will does not always defeat that survivorship, the son does not take half on these facts, and the state does not take the share by escheat."}, {"id": "N22", "topic": "disclosures and environmental", "stem": "A federally regulated lender makes a loan secured by a house in a special flood hazard area, and flood insurance is available. The lender", "choices": ["may rely on the homeowners policy, because that policy covers rising water.", "must require flood insurance on the building for the term of the loan.", "must require the seller to move the house before closing.", "insures the land value only, and the building is excluded."], "correct": 1, "why": "The lender must require flood insurance on the building for the term of the loan, a standard homeowners policy does not cover rising floodwater, the seller need not move the house, and the required coverage is on the building rather than on the land only."}, {"id": "N23", "topic": "financing and settlement (TRID, RESPA, Reg Z, ECOA, loan types)", "stem": "A typical VA loan for an eligible veteran differs from a conventional loan above 80 percent of value because the VA loan", "choices": ["cannot be sold on the secondary market.", "is a government guarantee and uses a funding fee, not conventional private mortgage insurance.", "is insured by the FHA and uses conventional private mortgage insurance.", "is a contract for deed, so the seller keeps legal title."], "correct": 1, "why": "A typical VA loan is a government guarantee and uses a funding fee rather than conventional private mortgage insurance, it is not FHA insurance, it is not a contract for deed, and it can be sold on the secondary market."}, {"id": "N24", "topic": "math", "stem": "The seller wants 226000 dollars in cash after a 5 percent commission and 6000 dollars of other selling costs. What sale price is required, rounded to the nearest dollar?", "choices": ["244211 dollars", "240000 dollars", "243158 dollars", "232000 dollars"], "correct": 0, "why": "Adding the 6000 dollars of other costs to the 226000 dollar net gives 232000, and dividing 232000 by 95 hundredths rounds to 244211, while 232000 stops before that division and 240000 and 243158 are not that quotient."}, {"id": "N25", "topic": "contracts and agency", "stem": "Which set is needed for a valid contract to sell real estate?", "choices": ["Earnest money of a set percent of the price", "A promissory note signed only by the broker", "Competent parties, mutual assent, a lawful purpose, and consideration", "A recorded deed, an appraisal, and a survey"], "correct": 2, "why": "A valid contract needs competent parties, mutual assent, a lawful purpose, and consideration, while a recorded deed and an appraisal are not formation elements, earnest money is not required to create the contract, and a note signed only by the broker is not the parties' agreement."}, {"id": "N26", "topic": "property characteristics, legal descriptions, land use", "stem": "The city changes the zoning of a parcel and does not pay the owner. That action is", "choices": ["escheat.", "a special warranty deed.", "police power, and zoning does not require compensation.", "eminent domain, so just compensation is required."], "correct": 2, "why": "Zoning without paying the owner is police power and does not require compensation, eminent domain is a taking for public use that does require just compensation, escheat is a different government power, and a special warranty deed is not a zoning action."}, {"id": "N27", "topic": "value and appraisal", "stem": "A comparable sold for 310000 dollars and has a garage the subject lacks. The garage is worth 12000 dollars. Adjusting the comparable to the subject gives", "choices": ["12000 dollars.", "322000 dollars.", "310000 dollars.", "298000 dollars."], "correct": 3, "why": "Adjust the comparable, not the subject, and subtract because the comparable is better, so 310000 minus 12000 is 298000, while 322000 adds the garage, 310000 makes no adjustment, and 12000 is only the garage."}, {"id": "N28", "topic": "real estate practice, fair housing, antitrust", "stem": "Two brokers agree that neither will list a house for less than a 6 percent commission. This is", "choices": ["required by the settlement-cost statute.", "a housing-for-older-persons exemption.", "lawful, because there is a required going rate.", "price fixing, and commissions are negotiable."], "correct": 3, "why": "An agreement among brokers on a commission is price fixing and commissions are negotiable, there is no lawful going rate they may fix, the settlement statute does not require the agreement, and an older-persons exemption is a fair housing idea rather than this antitrust violation."}, {"id": "N29", "topic": "ownership, transfer, recording", "stem": "A grantor warrants title only against defects that arose while that grantor owned the property. The deed is", "choices": ["a deed of trust.", "a special warranty deed.", "a general warranty deed.", "a quitclaim deed."], "correct": 1, "why": "A special warranty deed covers only defects from the grantor's own ownership, a general warranty deed covers the chain of title, a quitclaim deed gives no warranties, and a deed of trust is a security instrument rather than this kind of conveyance."}, {"id": "N30", "topic": "disclosures and environmental", "stem": "Under the federal Superfund law, the current owner of a contaminated site", "choices": ["is liable only up to the value of the land and never for cleanup.", "is fully protected by a standard owner's title policy in every case.", "can be strictly liable for cleanup, with a possible innocent-owner defense if the owner made appropriate inquiry before buying.", "is never liable if someone else dumped the waste."], "correct": 2, "why": "The current owner can be strictly liable for cleanup even if someone else dumped the waste, liability is not capped at the land value, a standard title policy should not be assumed to pay for the cleanup, and an innocent-owner defense can apply when the buyer made appropriate inquiry before the purchase."}, {"id": "N31", "topic": "financing and settlement (TRID, RESPA, Reg Z, ECOA, loan types)", "stem": "For most closed-end consumer mortgages covered by the integrated disclosure rule, the creditor must", "choices": ["skip both forms if the advertisement states a monthly payment.", "deliver or mail the Loan Estimate no later than the third business day after receiving the application, and make sure the consumer receives the Closing Disclosure at least three business days before consummation.", "mail the Closing Disclosure within three business days after application and the Loan Estimate after consummation.", "use the old settlement statement and the old early truth-in-lending form on every loan, including reverse mortgages, because nothing was replaced."], "correct": 1, "why": "The Loan Estimate goes out no later than the third business day after application and the Closing Disclosure must be received at least three business days before consummation, those forms are not swapped, the older forms are not still required on every one of these loans, and a monthly payment in an ad does not cancel the forms."}, {"id": "N32", "topic": "math", "stem": "Annual taxes of 4380 dollars have not been paid. Use a 365-day year. The seller is charged for 200 days. The seller's tax debit is", "choices": ["2200 dollars.", "4380 dollars.", "2400 dollars.", "1200 dollars."], "correct": 2, "why": "Dividing 4380 by 365 gives 12 dollars a day, and 200 times 12 is 2400, so 1200 and 2200 are not that product and 4380 is the whole year."}, {"id": "N33", "topic": "contracts and agency", "stem": "The seller makes a counteroffer and the buyer never accepts it. The buyer's original offer is", "choices": ["turned into an option contract.", "still open for the seller to accept later.", "dead, because a counteroffer rejects the original offer.", "automatically accepted after three days of silence."], "correct": 2, "why": "A counteroffer rejects the original offer so the seller cannot accept it later, silence for three days does not accept it, and a counteroffer is not an option."}, {"id": "N34", "topic": "property characteristics, legal descriptions, land use", "stem": "A person dies with no will and no heirs. The real estate passes to the state by", "choices": ["a quitclaim from the heirs.", "accretion.", "eminent domain.", "escheat."], "correct": 3, "why": "Escheat sends property to the state when a person dies with no will and no heirs, it is not eminent domain, there are no heirs to sign a quitclaim, and accretion is a gradual deposit of soil."}, {"id": "N35", "topic": "value and appraisal", "stem": "Replacement cost of the building is 240000 dollars. Economic life is 60 years. Effective age is 15 years. Land is worth 70000 dollars. Straight-line age-life depreciation indicates a value of", "choices": ["250000 dollars.", "180000 dollars.", "310000 dollars.", "370000 dollars."], "correct": 0, "why": "Fifteen divided by 60 is one quarter, one quarter of 240000 is 60000 of depreciation, the depreciated building is 180000, and adding 70000 of land that is not depreciated gives 250000, while 180000 forgot the land, 310000 forgot to subtract depreciation, and 370000 added depreciation instead of subtracting it."}, {"id": "N36", "topic": "real estate practice, fair housing, antitrust", "stem": "The federal Fair Housing Act protected classes include", "choices": ["age and marital status as the Act's two classes.", "credit score and occupation.", "race, color, religion, sex, national origin, familial status, and disability.", "only race and religion."], "correct": 2, "why": "The Act covers race, color, religion, sex, national origin, familial status, and disability, it is not limited to race and religion, age and marital status are equal-credit categories rather than those Act classes, and credit score is not a protected class under the Act."}, {"id": "N37", "topic": "ownership, transfer, recording", "stem": "Between the grantor and the grantee, a signed deed transfers title when it is", "choices": ["acknowledged, even if the grantor never delivers it.", "delivered and accepted.", "approved by the tax assessor.", "recorded at the county."], "correct": 1, "why": "Delivery and acceptance transfer title between the parties, recording is not required for that transfer, acknowledgment allows recording but does not replace delivery, and assessor approval is not what transfers title."}, {"id": "N38", "topic": "disclosures and environmental", "stem": "Asbestos that is in good condition in a house should first be", "choices": ["sanded so buyers can see the material.", "left undisturbed, and then encapsulated or abated by people who know how.", "treated as if it were radon gas.", "ignored because a standard homeowners policy always pays to remove it."], "correct": 1, "why": "Intact asbestos should not be disturbed and is handled by encapsulation or proper abatement, sanding it can release fibers, radon is a different hazard, and a homeowners policy should not be assumed to pay for the removal."}, {"id": "N39", "topic": "financing and settlement (TRID, RESPA, Reg Z, ECOA, loan types)", "stem": "A title company pays a salesperson 200 dollars for each buyer the salesperson sends over on a federally related mortgage. The salesperson does no title work. This is", "choices": ["a violation, because a fee for referring settlement-service business is a kickback.", "legal because the salesperson attends the closing.", "legal if the check is labeled marketing.", "required by the equal-credit law."], "correct": 0, "why": "A fee for referring settlement-service business when no title work is done is a kickback, relabeling the check does not fix it, the equal-credit law does not require the fee, and sitting at the closing is not pay for title work actually performed."}, {"id": "N40", "topic": "math", "stem": "The price is 410000 dollars and the appraisal is 400000 dollars. The lender will loan 80 percent of the lower of price or appraisal. Ignoring other closing costs, the loan and the cash the buyer needs to cover the price are", "choices": ["a 328000 dollar loan and 82000 dollars in cash.", "a 320000 dollar loan and 80000 dollars in cash.", "a 320000 dollar loan and 90000 dollars in cash.", "a 400000 dollar loan and 10000 dollars in cash."], "correct": 2, "why": "The lender uses 400000, the lower figure, so 80 percent is a 320000 dollar loan and the cash to reach the 410000 price is 90000, while 82000 dollars of cash comes from lending 80 percent of the price, 80000 dollars of cash subtracts the loan from the appraisal instead of the price, and a 400000 dollar loan ignores the 80 percent limit."}, {"id": "N41", "topic": "contracts and agency", "stem": "Earnest money in a purchase contract is best described as", "choices": ["the same thing as a down payment the lender must accept.", "the consideration that creates the contract.", "a payment the law requires in every sale.", "a good-faith deposit that is not required to form the contract, and that is liquidated damages only if the contract says so."], "correct": 3, "why": "Earnest money is not required to form the contract and is not the consideration, because the promises to buy and to sell are the consideration, it is liquidated damages only when the contract says so, the law does not require it in every sale, and it is not a down payment the lender must accept."}, {"id": "N42", "topic": "property characteristics, legal descriptions, land use", "stem": "The north half of the southwest quarter of the southeast quarter of a standard section contains", "choices": ["20 acres.", "10 acres.", "40 acres.", "80 acres."], "correct": 0, "why": "A section is 640 acres, the southeast quarter is 160, the southwest quarter of that is 40, and the north half of that is 20 acres, so 10, 40, and 80 stop before the last division."}, {"id": "N43", "topic": "value and appraisal", "stem": "Net operating income is 27000 dollars and the property sold for 337500 dollars. The capitalization rate is", "choices": ["12 and a half percent.", "8 percent.", "6 percent.", "10 percent."], "correct": 1, "why": "The cap rate is net operating income divided by value, and 27000 divided by 337500 is 8 percent, 6 percent and 10 percent are not that quotient, and 12 and a half percent divides value by income, which is backwards."}, {"id": "N44", "topic": "real estate practice, fair housing, antitrust", "stem": "Housing can be exempt from the familial-status rules when it is", "choices": ["advertised with the words no children.", "listed under a net listing.", "any building built before 1978.", "housing for older persons, including housing for persons 62 or older, or 55 or older if at least 80 percent of occupied units have a resident who is 55 or older."], "correct": 3, "why": "Housing for older persons can be exempt from familial status on those terms, a pre-1978 year is a lead-paint trigger rather than this exemption, an ad that says no children states a preference and is not itself the exemption, and a net listing has nothing to do with it."}, {"id": "N45", "topic": "ownership, transfer, recording", "stem": "Which lien is generally first in priority?", "choices": ["An unpaid contractor invoice that was never recorded", "The property tax lien", "A mortgage recorded yesterday", "A judgment recorded three years ago"], "correct": 1, "why": "A property tax lien generally comes ahead of mortgages and judgments, so yesterday's mortgage and the older judgment follow it, and an unrecorded invoice alone is not the first lien."}, {"id": "N46", "topic": "disclosures and environmental", "stem": "Radon is", "choices": ["an odorless gas that can be reduced if a test shows a high level.", "another name for lead-based paint.", "damage that a standard flood policy is written to cure.", "visible mold from a roof leak."], "correct": 0, "why": "Radon is an odorless gas and a high level can be mitigated, it is not visible mold, it is not lead-based paint, and a flood policy is not the radon remedy."}, {"id": "N47", "topic": "financing and settlement (TRID, RESPA, Reg Z, ECOA, loan types)", "stem": "A lender denies a home loan because the applicant's income is Social Security. This violates", "choices": ["the lead-paint disclosure rule.", "the ban on settlement kickbacks.", "the Equal Credit Opportunity Act, which bars discrimination because income comes from public assistance.", "a deed-delivery rule."], "correct": 2, "why": "The equal-credit law bars a creditor from discriminating because income comes from public assistance, the kickback ban is about referral fees, deed delivery is not this denial, and the lead-paint rule does not govern it."}, {"id": "N48", "topic": "math", "stem": "The loan is 320000 dollars and the borrower pays 2 and a half discount points. The points cost", "choices": ["6400 dollars.", "8200 dollars.", "3200 dollars.", "8000 dollars."], "correct": 3, "why": "One discount point is 1 percent of the loan, so 2 and a half percent of 320000 is 8000, 3200 is one point, 6400 is two points, and 8200 is not 2 and a half percent of this loan."}, {"id": "N49", "topic": "contracts and agency", "stem": "An option differs from a right of first refusal because the option", "choices": ["requires the buyer to purchase.", "binds the seller to sell if the buyer exercises it in time, while the buyer need not buy.", "only lets the holder match an offer the owner is already ready to accept.", "is the same thing as an open listing."], "correct": 1, "why": "An option binds the seller to sell if the buyer exercises it during the option period and does not require the buyer to buy, a right of first refusal only lets the holder match a later offer, and an open listing is a listing type rather than an option."}, {"id": "N50", "topic": "property characteristics, legal descriptions, land use", "stem": "Which is an economic characteristic of land, rather than a physical one?", "choices": ["Indestructibility", "Situs, meaning area preference", "Uniqueness", "Immobility"], "correct": 1, "why": "Situs, or area preference, is an economic characteristic, while immobility, indestructibility, and uniqueness are physical characteristics."}, {"id": "N51", "topic": "value and appraisal", "stem": "Market value is", "choices": ["the assessor's figure used to compute the tax.", "whatever price the property sold for last month.", "the cost to reproduce the building.", "the most probable price a willing buyer and willing seller would agree on, with neither under duress and with reasonable exposure."], "correct": 3, "why": "Market value is that most probable price, market price is what the property actually sold for, cost is what it took to build, and assessed value is the tax figure."}, {"id": "N52", "topic": "real estate practice, fair housing, antitrust", "stem": "Several brokers agree not to show the listings of a discount broker. This is", "choices": ["always a lawful rule of a multiple listing service.", "a group boycott under the antitrust laws.", "steering.", "blockbusting."], "correct": 1, "why": "Competitors agreeing to shut out another broker is a group boycott, it is not automatically a lawful listing-service rule, steering channels buyers by a protected class, and blockbusting pressures owners to sell."}, {"id": "N53", "topic": "ownership, transfer, recording", "stem": "The largest estate in land, inheritable and of unlimited duration, is", "choices": ["a life estate.", "an estate for years.", "a fee simple absolute.", "a license."], "correct": 2, "why": "Fee simple absolute is the largest estate and may be inherited and transferred without a built-in end date, a life estate ends at a life, an estate for years ends on a date, and a license is revocable permission."}, {"id": "N54", "topic": "disclosures and environmental", "stem": "A mold problem in a house is tied most directly to", "choices": ["how the owners hold title.", "a missing lead pamphlet.", "moisture.", "a low capitalization rate."], "correct": 2, "why": "Mold is a moisture problem, a lead pamphlet addresses paint, a capitalization rate is an income ratio, and the form of title does not cause mold."}, {"id": "N55", "topic": "financing and settlement (TRID, RESPA, Reg Z, ECOA, loan types)", "stem": "The three-business-day right to cancel under Regulation Z", "choices": ["replaces the Closing Disclosure on a purchase.", "applies to the loan a buyer uses to purchase a home.", "runs for 91 days after a foreclosure sale.", "generally applies to a refinance secured by the borrower's principal dwelling, not to the loan that purchases that dwelling."], "correct": 3, "why": "The right to cancel generally covers a refinance secured by the borrower's existing principal dwelling and does not apply to the loan that buys that dwelling, it does not last 91 days after a foreclosure sale, and it does not replace the Closing Disclosure."}, {"id": "N56", "topic": "math", "stem": "A buyer borrows 240000 dollars, interest only, at 6 and a half percent a year, and pays two discount points. The monthly interest and the points are", "choices": ["1300 dollars a month and 4800 dollars in points.", "1560 dollars a month and 4800 dollars in points.", "1300 dollars a month and 2400 dollars in points.", "15600 dollars a month and 4800 dollars in points."], "correct": 0, "why": "Annual interest is 240000 times 65 thousandths, which is 15600, monthly interest is 15600 divided by 12, which is 1300, and two points are 2 percent of the loan, which is 4800, so 1560 a month is too high, 2400 is only one point, and 15600 is the yearly interest rather than the monthly amount."}, {"id": "N57", "topic": "contracts and agency", "stem": "Under an exclusive agency listing, the listing broker is paid if", "choices": ["the property does not sell.", "the owner finds the buyer alone.", "any broker finds the buyer, but not if the owner sells with no broker.", "the listing has already expired."], "correct": 2, "why": "Exclusive agency pays the listing broker when a broker procures the buyer but not when the owner sells alone, it does not pay merely because the owner found the buyer, it does not wait until after expiration, and it does not pay if the property never sells."}, {"id": "N58", "topic": "property characteristics, legal descriptions, land use", "stem": "Permission to cross a neighbor's driveway that the owner may cancel at will is", "choices": ["a fee simple absolute.", "a property-tax lien.", "an easement, which usually cannot be revoked at will.", "a license."], "correct": 3, "why": "Revocable permission is a license, an easement is a use right that is usually not revocable at will, fee simple absolute is ownership, and a tax lien is a money claim rather than permission to cross."}, {"id": "N59", "topic": "value and appraisal", "stem": "The appraisal approach used most often for a single-family house is", "choices": ["the sales comparison approach, adjusting comparables to the subject.", "the cost approach only, because every house is special-purpose property.", "a gross rent multiplier with no comparables and no adjustment.", "the income approach."], "correct": 0, "why": "Sales comparison, with comparables adjusted to the subject, is the approach used most for houses, the income approach is for income property, the cost approach fits special-purpose property better than a typical house, and a gross rent multiplier alone is not that house approach."}, {"id": "N60", "topic": "real estate practice, fair housing, antitrust", "stem": "A tenant with a disability needs a support animal, and the building has a no-pets rule. The landlord", "choices": ["may have to make a reasonable accommodation and allow the animal.", "may refuse because familial status does not include animals.", "satisfies the duty by handing the tenant a lead-paint pamphlet.", "may always refuse because the rule is in the lease."], "correct": 0, "why": "A disability can require a reasonable accommodation such as a support animal despite a no-pets rule, the lease rule does not always defeat that request, this is not solved by calling it familial status, and a lead-paint pamphlet is unrelated."}, {"id": "N61", "topic": "ownership, transfer, recording", "stem": "Recording a deed is important because it", "choices": ["is the same thing as the buyer's actual knowledge in every case.", "gives constructive notice and protects priority against later buyers.", "is the act that makes the deed valid between grantor and grantee.", "replaces delivery of the deed."], "correct": 1, "why": "Recording gives constructive notice and protects priority against later buyers, it does not make the deed valid between the parties, it does not replace delivery, and constructive notice is not the same thing as what a person actually knows."}, {"id": "N62", "topic": "disclosures and environmental", "stem": "A buyer asks whether a standard homeowners policy covers damage from rising floodwater. The answer is that", "choices": ["it does not, so a separate flood policy is needed.", "it does, because the policy covers every kind of water.", "it does only if the house was built before 1978.", "it does, if the house is in a flood zone."], "correct": 0, "why": "A standard homeowners policy does not cover rising floodwater, so a separate flood policy is needed, being in a flood zone does not add that coverage, the policy does not cover every kind of water, and 1978 is the lead-paint year rather than a flood-coverage switch."}, {"id": "N63", "topic": "contracts and agency", "stem": "Fiduciary duties a salesperson owes the client include", "choices": ["a duty to follow an illegal instruction if the client insists.", "a duty to hide a known material defect when the seller asks.", "obedience to lawful instructions, loyalty, disclosure, confidentiality, accounting, and reasonable care.", "loyalty to the customer ahead of the client."], "correct": 2, "why": "The client is owed obedience to lawful instructions, loyalty, disclosure, confidentiality, accounting, and reasonable care, the customer is not put ahead of the client, an illegal instruction is not obeyed, and a known material defect is not kept secret."}, {"id": "N64", "topic": "property characteristics, legal descriptions, land use", "stem": "A fence built across the property line is", "choices": ["an encroachment, which a survey locates.", "an emblement.", "escheat.", "found by the income approach and called regression."], "correct": 0, "why": "A fence across the line is an encroachment and a survey locates it, the income approach does not find it, an emblement is an annual crop, and escheat is a transfer to the state."}, {"id": "N65", "topic": "value and appraisal", "stem": "A comparative market analysis prepared by a salesperson is", "choices": ["the salesperson's estimate of a likely price from comparables, and it is not an appraisal.", "a lender's appraisal because it uses sold houses.", "the assessed value.", "an appraisal that must follow appraisal standards."], "correct": 0, "why": "A comparative market analysis is an agent's price estimate from comparables and is not an appraisal, an appraisal is an opinion of value by a licensed or certified appraiser, using sold houses does not turn the estimate into an appraisal, and assessed value is for taxes."}, {"id": "N66", "topic": "real estate practice, fair housing, antitrust", "stem": "Brokers agree to divide the city and stay out of one another's areas. This is", "choices": ["a required term of every exclusive-agency listing.", "redlining.", "escheat.", "market allocation, which antitrust law prohibits."], "correct": 3, "why": "Dividing territory so brokers do not compete is market allocation and is an antitrust violation, exclusive agency is a listing with one seller, redlining is a lending practice, and escheat is property passing to the state."}, {"id": "N67", "topic": "ownership, transfer, recording", "stem": "Two buyers take title as tenants in common. Which statement is correct?", "choices": ["The survivor automatically takes the other's share", "Their shares must be equal", "There is no right of survivorship, and the shares may be unequal", "When one dies the share always escheats to the state"], "correct": 2, "why": "Tenants in common have no right of survivorship and their shares may be unequal, survivorship belongs to a joint tenancy, equal shares are not required, and a deceased owner's share passes by will or inheritance rather than always escheating."}, {"id": "N68", "topic": "disclosures and environmental", "stem": "An innocent-owner defense to hazardous-waste liability depends on", "choices": ["appropriate inquiry before the purchase, such as an environmental site assessment.", "recording a quitclaim deed.", "a familial-status housing exemption.", "paying the property tax on time."], "correct": 0, "why": "That defense depends on appropriate inquiry before buying, paying the tax does not create it, a quitclaim deed does not clean up the waste, and a familial-status exemption is a fair housing rule rather than this defense."}, {"id": "N69", "topic": "contracts and agency", "stem": "An agency with a broker generally ends when", "choices": ["the client asks a routine question.", "the parties negotiate the commission rate.", "one salesperson at the firm resigns.", "the principal dies."], "correct": 3, "why": "Death of the principal ends the agency, a salesperson resigning does not by itself end the brokerage relationship the way death of the principal or the broker does, a routine question does not end it, and negotiating the commission does not end it."}, {"id": "N70", "topic": "property characteristics, legal descriptions, land use", "stem": "A legal description that identifies a lot and block on a recorded map is", "choices": ["a lot-and-block description.", "a street address, which is enough by itself as a legal description.", "a correction line in the rectangular survey.", "a metes-and-bounds call that need not close."], "correct": 0, "why": "Lot and block refers to a recorded plat, metes and bounds must close back to the point of beginning, a street address is not a legal description, and a correction line is part of the government survey rather than a plat lot."}, {"id": "N71", "topic": "value and appraisal", "stem": "The principle that a buyer will pay no more than the cost of an equally desirable substitute is", "choices": ["substitution.", "regression.", "contribution.", "anticipation."], "correct": 0, "why": "Substitution sets the ceiling at the cost of an equally desirable substitute, regression is the drag from lower-priced property nearby, contribution is what one part adds to value, and anticipation is value based on expected future benefits."}, {"id": "N72", "topic": "real estate practice, fair housing, antitrust", "stem": "A broker will sell a listed house only if the buyer also lists the buyer's current home with that broker. This is", "choices": ["a lawful package that antitrust law requires.", "a tie-in arrangement that antitrust law prohibits.", "steering.", "cured by calling it an affiliated-business disclosure and nothing more."], "correct": 1, "why": "Conditioning the sale service on the buyer taking a second service is a prohibited tie-in, antitrust law does not require that package, it is not steering, and labeling it an affiliated-business disclosure does not make the tie legal."}, {"id": "N73", "topic": "contracts and agency", "stem": "After a seller breaches a land contract, the buyer's usual remedy to force the transfer is", "choices": ["escheat.", "a new open listing ordered by the court.", "punitive damages.", "specific performance, because land is unique."], "correct": 3, "why": "Specific performance orders the transfer because each parcel is unique, punitive damages are rare in an ordinary contract case, escheat is property passing to the state, and the court does not order a new open listing as that remedy."}, {"id": "N74", "topic": "property characteristics, legal descriptions, land use", "stem": "The physical characteristics of land are", "choices": ["immobility, indestructibility, and uniqueness.", "police power, taxation, and escheat.", "supply, demand, and anticipation.", "scarcity, modification, and situs."], "correct": 0, "why": "The physical characteristics are immobility, indestructibility, and uniqueness, scarcity and situs are economic ideas, police power and taxation and escheat are government powers, and supply and demand is a value principle."}, {"id": "N75", "topic": "value and appraisal", "stem": "A house that rents for 2000 dollars a month sold for 360000 dollars. The gross rent multiplier is", "choices": ["72.", "8 percent.", "15.", "180."], "correct": 3, "why": "The gross rent multiplier is price divided by gross monthly rent, and 360000 divided by 2000 is 180, 15 would come from treating the figure as if a zero were dropped or the rent were annual in the wrong setup, 72 is not the quotient, and 8 percent is a cap rate rather than this multiplier."}, {"id": "N76", "topic": "contracts and agency", "stem": "A signed purchase contract, before closing, is", "choices": ["an estate at sufferance.", "executed, because the deed has already been delivered.", "executory, because the promises are still open.", "void unless it has been recorded."], "correct": 2, "why": "Before closing the contract is executory because performance is still open, it is executed only when fully performed, it is not void merely because it is unrecorded, and estate at sufferance is a holdover tenancy."}, {"id": "N77", "topic": "contracts and agency", "stem": "A net listing, where the broker keeps everything above a set net to the seller, should be treated as", "choices": ["the same arrangement as an open listing.", "a commission schedule required by antitrust law.", "the safest listing for the seller.", "a conflict of interest, not a recommended listing."], "correct": 3, "why": "A net listing is a conflict of interest and is not a recommended listing, it is not the safest listing for the seller, it is not an open listing, and antitrust law does not require it."}, {"id": "N78", "topic": "contracts and agency", "stem": "Which duty usually continues after the agency ends?", "choices": ["Obedience to new marketing instructions", "Confidentiality of the client's information", "A duty to keep advertising the property", "A duty to collect a second commission"], "correct": 1, "why": "Confidentiality usually survives the end of the agency, obedience to new marketing instructions does not continue as an open agency, advertising ends with the agency, and a second commission is not a surviving duty."}, {"id": "N79", "topic": "contracts and agency", "stem": "What does a licensee owe a customer, as opposed to a client?", "choices": ["The same loyalty owed to the client", "Honesty, fairness, and disclosure of material facts about the property, but not the client's secrets", "A duty to hide defects unless the customer asks", "No duty of honesty at all"], "correct": 1, "why": "A customer is owed honesty, fairness, and disclosure of material property facts, but not the client's loyalty or secrets, defects are not hidden, and honesty is still owed to a person who is not the client."}, {"id": "N80", "topic": "contracts and agency", "stem": "A financing contingency in a purchase contract", "choices": ["forces the seller to make the loan.", "removes the need for a written contract.", "is the same thing as an option that the seller must buy.", "lets the protected party end the contract if the stated financing is not obtained in time, provided that party acts in good faith."], "correct": 3, "why": "A financing contingency ends the contract if it is not met or waived and the party who benefits must act in good faith within the deadline, it does not force the seller to lend, it does not erase the need for a writing, and it is not an option."}, {"id": "N81", "topic": "contracts and agency", "stem": "An oral agreement to sell a house is generally", "choices": ["itself a general warranty deed.", "fully enforceable if both sides shook hands.", "voidable only because one party might be a minor.", "unenforceable under the statute of frauds."], "correct": 3, "why": "An oral agreement to sell land is unenforceable under the statute of frauds, a handshake does not make it enforceable, minority is a different reason a contract can be voidable, and the oral deal is not a deed."}, {"id": "N82", "topic": "property characteristics, legal descriptions, land use", "stem": "Annual crops that a tenant planted by labor are", "choices": ["an encroachment.", "real property that always stays with the land.", "emblements, which are personal property.", "trade fixtures bolted to a shop wall."], "correct": 2, "why": "Emblements are annual crops produced by labor and they are personal property, they do not automatically stay with the land as real property, they are not trade fixtures, and they are not an encroachment."}, {"id": "N83", "topic": "value and appraisal", "stem": "Net operating income is income", "choices": ["after the mortgage payment is subtracted.", "after land value is subtracted from the sale price.", "that is computed by adding depreciation to the capitalization rate.", "after operating expenses and before the mortgage payment."], "correct": 3, "why": "Net operating income is what remains after operating expenses and before debt service, so the mortgage payment is not subtracted to compute it, land value is not subtracted from price to compute it, and depreciation is not added to the cap rate to create it."}, {"id": "N84", "topic": "real estate practice, fair housing, antitrust", "stem": "An ad that describes a house as perfect for a Christian family", "choices": ["is blockbusting.", "is required wording under the Fair Housing Act.", "is lawful advertising of a preference.", "states an illegal preference based on religion."], "correct": 3, "why": "The ad states a religious preference, and religion is a protected class, so the wording is not lawful, it is not blockbusting, and the Act does not require it."}, {"id": "N85", "topic": "disclosures and environmental", "stem": "Which statement about removing lead-based paint is correct?", "choices": ["The seller must remove it if the buyer waives the inspection period.", "Giving the federal pamphlet creates a duty to remove the paint.", "There is no automatic duty to remove the paint just because it is present.", "The seller must remove it whenever a house built before 1978 contains it."], "correct": 2, "why": "Removal is not automatic just because pre-1978 paint is present, the duties are disclosure and a chance to inspect, waiving the inspection does not create a removal duty, and giving the pamphlet is the disclosure step rather than an order to remove the paint."}]}, "arizona": {"name": "Arizona", "seconds": 5400, "items": [{"id": "A1", "topic": "contracts", "stem": "Arizona's constitutional rule on document drafting lets a licensed salesperson", "choices": ["charge a separate document-preparation fee to draft a deed for a client.", "give legal advice on how the buyer should take title.", "draft or complete instruments incident to a transaction in which the licensee is acting for a party, without a separate charge.", "represent a buyer in court."], "correct": 2, "why": "The constitutional rule allows that drafting only as an incident of the licensed work and without a separate charge, so a document fee, legal advice on how to take title, and a court appearance are not authorized."}, {"id": "A2", "topic": "agency", "stem": "A licensee owes the client a fiduciary duty and must also", "choices": ["deal fairly with the other parties.", "keep a known material defect confidential if the seller asks.", "disclose a suicide on the property.", "represent both sides without written consent if the commission is shared."], "correct": 0, "why": "The licensee owes the client a fiduciary duty and must deal fairly with all other parties, a known material defect must be disclosed in writing rather than kept secret, a suicide is not a required disclosure, and representing both sides still needs prior written consent."}, {"id": "A3", "topic": "licensee duties", "stem": "A licensee knows the roof leaks, and the seller says to keep it quiet. The licensee must", "choices": ["disclose it only if the buyer is also the licensee's client.", "mention it orally after the deed is recorded.", "keep it confidential because the seller is the client.", "disclose the known material defect in writing to the other parties."], "correct": 3, "why": "A known material defect must be disclosed in writing to the other parties, the seller's request does not make it confidential, the duty is not limited to the licensee's own client, and an oral mention after recording is not the required written disclosure."}, {"id": "A4", "topic": "licensee competencies", "stem": "Land divided for sale into six or more lots is", "choices": ["unsubdivided land in every case.", "a subdivision, unless a statutory exception applies, such as lots of 36 acres or more.", "unregulated whenever the lots are outside a city.", "always handled only by an affidavit of disclosure, even when there are eight lots."], "correct": 1, "why": "Six or more lots is a subdivision unless an exception applies, and lots of 36 acres or more are not a subdivision, unsubdivided land is a different size range, county land is not automatically unregulated, and the affidavit track is for five or fewer parcels rather than eight lots."}, {"id": "A5", "topic": "reasonable skill and care (taxes, water, environment as Arizona tests them)", "stem": "Arizona real property taxes of more than 100 dollars", "choices": ["are due March 1 and September 1.", "are due in full on January 1.", "are half due October 1 and delinquent after November 1 at 5 pm, and half due the following March 1 and delinquent after May 1 at 5 pm.", "become delinquent on October 1 and on May 1."], "correct": 2, "why": "When the tax is more than 100 dollars, half is due October 1 and delinquent after November 1 at 5 pm, and the other half is due the following March 1 and delinquent after May 1 at 5 pm, so the bill is not due in full on January 1, delinquency is not on those due dates themselves, and the due dates are not March 1 and September 1."}, {"id": "A6", "topic": "regulatory framework", "stem": "The real estate recovery fund's maximum payment is", "choices": ["unlimited if the licensee cannot pay the judgment.", "30000 dollars per transaction and 90000 dollars per licensee.", "90000 dollars per transaction and 30000 dollars per licensee.", "20000 dollars per transaction, with no cap per licensee."], "correct": 1, "why": "The maximum is 30000 dollars for each transaction and 90000 dollars for each licensee, the reversed caps are wrong, a 20000 dollar transaction cap with no licensee cap is wrong, and the payment is not unlimited when the licensee cannot pay."}, {"id": "A7", "topic": "consumer protection", "stem": "An affidavit of disclosure is required when a seller transfers", "choices": ["one lot inside a platted subdivision in Phoenix.", "five or fewer parcels, other than subdivided land, in an unincorporated area of a county.", "any house inside an active management area.", "six or more lots under one promotional plan."], "correct": 1, "why": "The affidavit applies to five or fewer parcels, other than subdivided land, in an unincorporated area of a county, a platted subdivision lot is on the subdivision track, the affidavit is not required for every house in an active management area, and six or more lots use a public report."}, {"id": "A8", "topic": "advertising", "stem": "A licensee advertises a listing and leaves the brokerage name off so the ad looks like a sale by owner. This violates", "choices": ["the constitutional drafting rule.", "the anti-deficiency statute.", "the homestead statute.", "the rule against an advertisement that implies no broker or salesperson is involved."], "correct": 3, "why": "Leaving the brokerage name off so the ad looks like a sale by owner is a blind ad, which the advertising rule prohibits, and the violation is not the homestead statute, the drafting rule, or the anti-deficiency statute."}, {"id": "A9", "topic": "escrow, title, lending", "stem": "A salesperson receives an earnest-money check with a Saturday offer. The salesperson must", "choices": ["deposit it in the salesperson's personal account until Monday.", "place it promptly in the care of the designated broker.", "hold it until acceptance, then give it to the title company without telling the broker.", "cash it and deliver the cash to the seller."], "correct": 1, "why": "The salesperson must promptly place transaction funds in the care of the designated broker, not in a personal account, not pass the check to the title company without telling the broker, and not cash it for the seller."}, {"id": "A10", "topic": "ownership and encumbrances", "stem": "Property acquired by one spouse during the marriage is community property unless it was", "choices": ["a house the couple lived in.", "refinanced during the marriage.", "paid for with wages earned during the marriage.", "acquired by gift, devise, or descent."], "correct": 3, "why": "Property acquired during the marriage is community property except property acquired by gift, devise, or descent, wages earned during the marriage are community property, living in the house is not that exception, and a refinance does not by itself take the property out of the community."}, {"id": "A11", "topic": "foreclosure, short sale, deed in lieu", "stem": "The notice of trustee's sale is recorded on a Wednesday. The trustee wants the sale on the first Saturday after the 90th day. Which statement is correct?", "choices": ["Saturday is allowed if it falls after the 90th day.", "The sale may be held the day after recording if the borrower agrees in an ad.", "The sale may not be held before the 91st day after the notice is recorded, and it is not held on a Saturday or a legal holiday.", "A trustee's sale is always a judicial foreclosure, so this timing rule does not apply."], "correct": 2, "why": "The sale may not be held before the 91st day after the notice is recorded and it is not set on a Saturday or a legal holiday, so that Saturday is not allowed, the sale is not the next day even if an ad says the borrower agrees, and a trustee's sale is the nonjudicial path rather than a sale that is always judicial."}, {"id": "A12", "topic": "contracts", "stem": "Under the Arizona statute of frauds, which agreement must be in writing to support a lawsuit?", "choices": ["A month-to-month rental", "A lease for exactly six months", "A lease for a period longer than one year", "An agreement to cut a neighbor's lawn for 200 dollars"], "correct": 2, "why": "A lease longer than one year must be in writing to support a lawsuit, a month-to-month rental and a six-month lease are not longer than one year, and a lawn agreement is not that lease."}, {"id": "A13", "topic": "agency", "stem": "Before the parties sign a binding contract, a licensee who is buying the property for the licensee's own account must", "choices": ["disclose the fact only to the designated broker.", "put owner/agent on the yard sign and do nothing else.", "say nothing until after closing.", "disclose in writing that the licensee has a license and is acting as a principal."], "correct": 3, "why": "The licensee must disclose in writing, before a binding agreement, that the licensee is licensed and is acting as a principal, silence until after closing is too late, telling only the designated broker is not disclosure to the parties, and the yard-sign words do not replace the written disclosure."}, {"id": "A14", "topic": "licensee duties", "stem": "A licensee does not have a duty to disclose that", "choices": ["there is a known recorded lien.", "there is a known unpermitted addition.", "the property was the site of a homicide, that an occupant had HIV, or that a registered sex offender lives nearby.", "there is a known cracked foundation."], "correct": 2, "why": "The statute excuses disclosure of a death or other felony on the property, of HIV or a disease not known to be transmitted by ordinary occupancy, and of a nearby sex offender, and those facts are not grounds to rescind, while a known cracked foundation, a known lien, and a known unpermitted addition must be disclosed in writing."}, {"id": "A15", "topic": "licensee competencies", "stem": "A seller creates eight lots of 40 acres each. Those lots", "choices": ["need an affidavit of disclosure solely because each lot is larger than a city lot.", "are unregulated, with no upper or lower size, once they exceed six lots.", "are a subdivision because there are more than five.", "are not a subdivision, because lots of 36 acres or more are outside that definition."], "correct": 3, "why": "Lots of 36 acres or more are not a subdivision even when there are six or more of them, counting only the number of lots ignores that exception, lot size alone does not turn this into the five-or-fewer affidavit, and land in this size range is not an unlimited unregulated category."}, {"id": "A16", "topic": "reasonable skill and care (taxes, water, environment as Arizona tests them)", "stem": "The total property tax on a parcel is 80 dollars. That bill", "choices": ["is due in full on October 1 and is delinquent after December 31 at 5 pm.", "is half due October 1 and half due the following March 1.", "becomes delinquent at 5 pm on October 1.", "is due on May 1."], "correct": 0, "why": "When the total tax is 100 dollars or less, the whole amount is due October 1 and is delinquent after December 31 at 5 pm, the half-and-half schedule is for a bill over 100 dollars, the bill is not delinquent at 5 pm on October 1, and it is not due on May 1."}, {"id": "A17", "topic": "regulatory framework", "stem": "The recovery fund will pay", "choices": ["an actual out-of-pocket loss, including reasonable attorney fees, from an Arizona transaction in the situations the statute lists.", "punitive damages.", "lost profits on a deal that never closed.", "a loss on land in Nevada."], "correct": 0, "why": "The fund pays an actual out-of-pocket loss, including reasonable attorney fees, in the Arizona situations the statute lists, and it does not pay lost profits, a loss on land outside Arizona, or punitive damages."}, {"id": "A18", "topic": "consumer protection", "stem": "The seller of land that needs an affidavit of disclosure must furnish it", "choices": ["within seven days after recording.", "only if the buyer asks for it in writing.", "at least seven days before the transfer, and the buyer has five days after receiving it to rescind.", "at closing only, with no right to rescind."], "correct": 2, "why": "The seller must furnish the affidavit at least seven days before the transfer, and the buyer has five days after receiving it to rescind, so closing-only delivery with no rescission right is wrong, delivery after recording is the wrong time, and the seller does not wait for a written request."}, {"id": "A19", "topic": "advertising", "stem": "A licensed salesperson is selling a house the salesperson owns. The advertisement must include", "choices": ["the recovery-fund balance.", "nothing extra, because the salesperson is the owner.", "the words owner/agent.", "the salesperson's license number only, with no broker name."], "correct": 2, "why": "The advertisement must include the words owner/agent, the employing broker's name is still required, the license number alone does not replace either disclosure, and the recovery-fund balance is not the required wording."}, {"id": "A20", "topic": "escrow, title, lending", "stem": "The purchase contract or earnest-money receipt must state", "choices": ["the current balance of the recovery fund.", "the buyer's credit score.", "only how the commission will be split.", "whether the earnest money is cash, a check, a note, or some other form."], "correct": 3, "why": "The contract or receipt must state the form of the earnest money, such as cash, a check, a note, or other, a commission split is a different term, the recovery-fund balance is not an earnest-money description, and the credit score is not what this rule puts in the receipt."}, {"id": "A21", "topic": "ownership and encumbrances", "stem": "Pay earned by one spouse during the marriage is", "choices": ["always a homestead, even if the couple rents.", "outside the statute of frauds for that reason alone.", "that spouse's separate property if the other name is not on the check.", "community property."], "correct": 3, "why": "Wages earned during the marriage are community property even if only one spouse's name is on the check, they are not separate property for that reason, they are not a homestead just because they were earned, and the statute of frauds is about whether an agreement must be in writing."}, {"id": "A22", "topic": "foreclosure, short sale, deed in lieu", "stem": "A trustee sells a home on 1 and 2 tenths of an acre. It is a single-family house the owner lived in, and the deed of trust was a purchase loan made in 2019. The lender", "choices": ["may not sue for the difference between the debt and the trustee's sale price.", "may sue only if the home was never finished, which is this case.", "must use a judicial foreclosure because the lot is under 2 and a half acres.", "may sue for a deficiency within 90 days."], "correct": 0, "why": "On a trustee's sale of 2 and a half acres or less that is limited to and used as a single one-family dwelling, the lender may not sue for the difference between the debt and the sale price, a 90-day deficiency action is not allowed on these facts, the unfinished-home exception is a different case, and a smaller lot does not force a judicial foreclosure."}, {"id": "A23", "topic": "contracts", "stem": "To support a lawsuit, an agreement to sell Arizona real property must be", "choices": ["remembered by the broker, with no signature.", "recorded, even if nobody signed it.", "oral, if earnest money was paid.", "in writing and signed by the party to be charged."], "correct": 3, "why": "A sale of real property must be in writing and signed by the party to be charged, earnest money does not replace the writing, the broker's memory does not replace a signature, and recording an unsigned paper does not create the agreement."}, {"id": "A24", "topic": "agency", "stem": "A licensee wants to represent both the buyer and the seller. The licensee must", "choices": ["do so whenever the commission will be split.", "get the prior written consent of all parties before representing more than one party or taking compensation from more than one party.", "tell the designated broker after closing.", "rely on the constitutional drafting rule instead of consent."], "correct": 1, "why": "Representing more than one party, or taking compensation from more than one party, requires the prior written consent of all parties, a commission split does not replace that consent, a report after closing is too late, and the drafting rule is not that consent."}, {"id": "A25", "topic": "licensee duties", "stem": "The licensee learns the seller may be unable to deliver title. The licensee must", "choices": ["disclose in writing that the seller may be unable to perform.", "keep it confidential as a client strategy.", "disclose it only after recording.", "wait to see whether the buyer discovers it."], "correct": 0, "why": "The licensee must disclose in writing that the seller may be unable to perform, because that fact materially affects the consideration, waiting for the buyer is not the disclosure, it is not a secret the licensee may keep, and disclosure after recording is too late."}, {"id": "A26", "topic": "licensee competencies", "stem": "Unsubdivided land, for this license, means", "choices": ["six or more lots of at least 36 acres and less than 160 acres.", "any two lots inside a city.", "one condominium unit.", "one house on one acre."], "correct": 0, "why": "Unsubdivided land is six or more lots of 36 acres up to but not including 160 acres, two city lots are not that land, one condominium unit is not six lots of that size, and one house on one acre is not unsubdivided land."}, {"id": "A27", "topic": "reasonable skill and care (taxes, water, environment as Arizona tests them)", "stem": "The water-resources overview used for this prep names how many active management areas, and which are they?", "choices": ["Three irrigation areas: Joseph City, Harquahala, and Flagstaff", "Three: Phoenix, Tucson, and Prescott", "Eight: Prescott, Phoenix, Pinal, Tucson, Santa Cruz, Douglas, Willcox, and Ranegras Plain", "Five, from an older list"], "correct": 2, "why": "That overview names eight active management areas, which are Prescott, Phoenix, Pinal, Tucson, Santa Cruz, Douglas, Willcox, and Ranegras Plain, so a list of only Phoenix, Tucson, and Prescott is incomplete, an older five-area list is out of date, and Joseph City and Harquahala are irrigation non-expansion areas while Flagstaff is not on the list."}, {"id": "A28", "topic": "regulatory framework", "stem": "The recovery fund pays a judgment caused by a licensee. The licensee's licenses under the real estate chapter", "choices": ["terminate on the date of payment, and reinstatement waits until the judgment is satisfied and the fund is repaid with interest at the legal rate.", "are suspended for 91 days and then return on their own.", "are unaffected, because the payment works like a title policy.", "stay active if the licensee finishes 24 hours of continuing education."], "correct": 0, "why": "Payment terminates those licenses on the date of payment, and they are not reinstated until the judgment is satisfied and the fund is repaid with interest at the legal rate, so continuing education does not keep them active, they do not return after 91 days, and the payment is not a title policy."}, {"id": "A29", "topic": "consumer protection", "stem": "The buyer of land that needs an affidavit of disclosure signs a clause waiving any claim if the affidavit is false or incomplete. The waiver", "choices": ["extends the buyer's rescission right to three years.", "is not valid, and the seller still records the affidavit when the deed is recorded.", "is valid if it is notarized.", "is valid because fewer than six parcels means no affidavit is required."], "correct": 1, "why": "A waiver of liability for an omission or misrepresentation in the affidavit is not valid, notarizing it does not save it, fewer than six parcels does not cancel the affidavit, and the waiver does not stretch rescission to three years, while the seller still records the affidavit with the deed."}, {"id": "A30", "topic": "advertising", "stem": "A licensee advertises a 21780-square-foot lot as a half-acre homesite. This", "choices": ["violates the advertising rule, because acre, alone or modified, may be used only for land of at least 43560 square feet.", "is allowed if the ad also says owner/agent.", "is governed by the homestead statute rather than the advertising rule.", "is allowed, because 21780 is half of 43560."], "correct": 0, "why": "The word acre, alone or modified, may be used only when the land is at least 43560 square feet, so calling 21780 square feet a half acre is not allowed, adding owner/agent does not repair the claim, and the homestead statute does not govern the ad."}, {"id": "A31", "topic": "escrow, title, lending", "stem": "Under the usual trust-account rule, a withdrawal may be authorized for", "choices": ["a licensee under that broker.", "the seller's relative.", "an unlicensed assistant who has the seller's spoken permission.", "any employee of the title company."], "correct": 0, "why": "A licensee under that broker is who may be authorized to withdraw from the broker's trust account, and a title-company employee, the seller's relative, and an unlicensed assistant with spoken permission are not authorized by that rule."}, {"id": "A32", "topic": "ownership and encumbrances", "stem": "Which statement about the Arizona homestead is correct?", "choices": ["Each spouse has a separate homestead exemption, and a guessed figure for the current year should be memorized.", "The statutory base is 400000 dollars of equity, it adjusts each January 1 starting in 2024, the statute page does not state the current adjusted dollar amount, and a married couple shares one homestead.", "Cash taken out in a refinance is protected for 18 months.", "The exemption covers the full value of the home with no cap."], "correct": 1, "why": "The base exemption is 400000 dollars of equity and it is adjusted each January 1 starting in 2024, but the statute page does not state the adjusted dollar amount so that figure must not be invented, one person holds one homestead and spouses share it, refinance cash is not protected, and there is a cap rather than a full-value exemption."}, {"id": "A33", "topic": "foreclosure, short sale, deed in lieu", "stem": "A 2018 deed of trust secures a builder's construction loan on a house being built for sale. The house was never substantially completed. The lot is one acre. After the trustee's sale", "choices": ["the lender has three years to sue, the same period as a public-report claim.", "anti-deficiency protection applies only when the lot is larger than 2 and a half acres.", "the dwelling protection does not apply, an allowed deficiency action must be brought within 90 days, and the judgment credits the higher of the sale price or fair market value.", "the judgment credits the lower of the sale price or fair market value, and there is no deadline."], "correct": 2, "why": "This post-2014 builder construction loan on a house built for sale that was never substantially completed is outside the dwelling protection, an allowed deficiency action must be filed within 90 days, and the judgment credits the higher of the sale price or fair market value rather than the lower, three years is not this deadline, and the protection is not limited to lots larger than 2 and a half acres."}, {"id": "A34", "topic": "contracts", "stem": "An agreement employing a broker to buy or sell real property for a commission", "choices": ["is the same document as the deed.", "may be oral and still support a suit for the commission.", "must be in writing to support a suit for the commission.", "is enforceable if the salesperson texts only the price."], "correct": 2, "why": "The employment agreement must be in writing to support a suit for the commission, an oral agreement will not support that suit, a text of the price is not that written employment, and the employment agreement is not the deed."}, {"id": "A35", "topic": "agency", "stem": "A warranty company offers a salesperson a fee for each buyer who orders a warranty in the transaction. Before taking that fee, the salesperson needs", "choices": ["only a spoken thank-you.", "a subdivision public report.", "nothing, because the fee is not called a commission.", "the person's prior written acknowledgment of that compensation."], "correct": 3, "why": "Compensation for goods or services related to the transaction needs that person's prior written acknowledgment, a different label does not remove the duty, a spoken thank-you is not the writing, and a public report is not this acknowledgment."}, {"id": "A36", "topic": "licensee duties", "stem": "A residential salesperson is asked to list a type of property the salesperson does not understand. The salesperson may take it", "choices": ["by charging a document-preparation fee, which creates competence.", "and stay silent about the lack of experience.", "only by bringing in someone competent, or by first disclosing the lack
