<script>
const ALL = [{"id": 1, "stem": "Common laws are derived mainly from where?", "choices": ["Common laws borrowed from other states", "Written laws passed by legislators", "Statutory laws already in effect", "Customs and judicial precedent"], "correct": 3, "why": "Common law comes from long-standing customs and the rulings judges make in past cases, not from statutes.", "missed": false}, {"id": 2, "stem": "Which of the following is NOT a duty of a property manager in Arizona?", "choices": ["Setting and collecting rent based on market conditions", "Conducting legal representation for tenants in disputes", "Handling maintenance requests", "Filling vacant units by advertising and showing the units"], "correct": 1, "why": "Giving legal advice or representing tenants in court is the practice of law, which a property manager cannot do.", "missed": false}, {"id": 3, "stem": "In Arizona, how many parcels of land that have been split or divided would require a public report approved by ADRE?", "choices": ["2", "3", "6", "5"], "correct": 2, "why": "Arizona treats a split into six or more parcels as a subdivision, which needs an ADRE-approved public report.", "missed": false}, {"id": 4, "stem": "A series of buyers conspire to divide lots without obtaining a public report. This would be known as what?", "choices": ["Division of Parties", "Collision of Parties", "Breach of Trust", "Acting in Concert"], "correct": 3, "why": "When several people work together to split land and dodge the subdivision rules, Arizona calls it acting in concert.", "missed": true}, {"id": 5, "stem": "Who is eligible to apply for funds from the Arizona Real Estate Recovery Fund?", "choices": ["Only real estate licensees.", "Both members of the public and real estate agents.", "Only members of the public aggrieved by a licensed real estate professional's actions.", "Real estate developers and brokers."], "correct": 2, "why": "The Recovery Fund exists to pay members of the public who were harmed by a licensee's wrongful acts.", "missed": false}, {"id": 6, "stem": "How must branch office licenses be issued in relation to the principal office license?", "choices": ["Under a different name for marketing purposes", "In the same name as the principal office license and posted in the branch office", "With a special designation that distinguishes them from the principal license", "Without the need for posting in the office"], "correct": 1, "why": "A branch office license must carry the same name as the main office license and be posted at the branch.", "missed": false}, {"id": 7, "stem": "Under Arizona law, what is the maximum time a designated broker has to review sales contracts?", "choices": ["14 days", "10 days", "30 days", "90 days"], "correct": 1, "why": "Arizona rules give the designated broker 10 days to review and initial each contract.", "missed": false}, {"id": 8, "stem": "When can the Commissioner or the Department of Real Estate audit a brokers records?", "choices": ["Upon a formal complaint filed by a member of the public.", "Every 4 years at a minimum.", "At any time without notice.", "Only when asked by the Attorney General."], "correct": 2, "why": "ADRE can audit a broker's records at any time, with no advance notice needed.", "missed": false}, {"id": 9, "stem": "What is the protocol for handling earnest money deposits in Arizona real estate transactions?", "choices": ["Deposits must be held in the brokerage's operating account until closing.", "Earnest money must be placed in a neutral escrow account within three banking days of receipt.", "The salesperson may hold the deposit until an offer is accepted.", "Brokers have discretion over how to handle earnest money deposits."], "correct": 1, "why": "Earnest money must go to escrow or the broker's trust account promptly, generally within three banking days.", "missed": false}, {"id": 10, "stem": "A property owner records a beneficiary deed naming their niece as the beneficiary. Later, the owner writes a will leaving the same property to their nephew. Upon the owner's death, who receives the property?", "choices": ["The nephew, because a will is the most recent expression of the decedent's intent.", "The niece, because a valid beneficiary deed is not revoked by the provisions of a will and takes precedence.", "Both, as they become tenants in common by operation of law.", "Neither; the property must go through probate to resolve the conflict."], "correct": 1, "why": "A recorded beneficiary deed controls over a will, so the niece gets the property.", "missed": true}, {"id": 11, "stem": "To qualify for protection under Arizona\u2019s Anti-Deficiency Statutes during a Trustee's Sale (non-judicial foreclosure), which criteria must the property meet?", "choices": ["It must be more than 2.5 acres and used for a commercial purpose.", "It must be 2.5 acres or less and utilized as a single one or two-family dwelling.", "It must be a purchase-money loan only; refinanced loans are not protected.", "It must be the owner's primary residence; rental properties do not qualify."], "correct": 1, "why": "Arizona's anti-deficiency protection covers property of 2.5 acres or less used as a one- or two-family home.", "missed": true}, {"id": 12, "stem": "What happens to a bill in Arizona if the second chamber amends it after it crosses over from the chamber of origin?", "choices": ["It is automatically sent to the Governor for signature.", "It is returned to the chamber of origin and voted on again without further review.", "The differences between the House and Senate versions must be reconciled in a conference committee.", "The Governor may veto it before the two chambers meet."], "correct": 2, "why": "When the two chambers pass different versions of a bill, a conference committee works out the differences.", "missed": true}, {"id": 13, "stem": "An Arizona property owner executes and records a beneficiary deed naming their adult child as the beneficiary. The owner later drafts a will that leaves all property to a charitable organization. The owner then dies without revoking the beneficiary deed. Evaluate which party will receive the property and explain why.", "choices": ["The charitable organization, because a will executed after a deed takes legal precedence over the deed.", "The adult child, because a valid, recorded beneficiary deed supersedes a conflicting devise in a will.", "The estate, because the property must pass through probate to resolve the conflict between the deed and the will.", "The charitable organization, because beneficiary deeds are automatically revoked when a new will is executed."], "correct": 1, "why": "A valid recorded beneficiary deed beats a conflicting gift in a will, so the adult child takes title.", "missed": true}, {"id": 14, "stem": "Analyze the 1:1 purchaser-to-accommodation ratio requirement for Arizona timeshares. How are delinquent owners treated in this calculation?", "choices": ["Delinquent owners are excluded from the ratio to allow the developer to resell the interval.", "Delinquent owners are counted as still eligible to use accommodations to prevent the reselling of the same interval before foreclosure.", "The ratio only applies to owners who have paid their assessments in full for the current year.", "The developer can ignore the ratio if the project is less than 50% sold."], "correct": 1, "why": "Delinquent owners still count as owners in the 1:1 ratio, so the developer can't oversell accommodations.", "missed": true}, {"id": 15, "stem": "Which body creates binding precedent (common law) in Arizona?", "choices": ["Superior Court", "Justice Court", "Court of Appeals and Supreme Court", "ADRE Commissioner"], "correct": 2, "why": "Only appellate courts, the Court of Appeals and the Supreme Court, set binding precedent in Arizona.", "missed": false}, {"id": 16, "stem": "A client asks a licensee to help them purchase a factory-built unit that is 385 square feet, was constructed to ANSI A119.5 recreational vehicle standards, and has no HUD certification tag. Which of the following conclusions is most accurate?", "choices": ["The unit is a manufactured home because it is designed for residential use.", "The unit is a manufactured home because it was built after June 15, 1976.", "The unit is a park model trailer, treated as personal property, and a real estate license is NOT required to sell it.", "The unit is a park model trailer, but a real estate license IS still required because it involves a land-lease transaction."], "correct": 2, "why": "A small unit built to the RV standard is a park model, which is personal property and needs no real estate license to sell.", "missed": false}, {"id": 17, "stem": "A licensee offers a \u201cfree home warranty\u201d but fails to disclose terms and conditions. What is the issue?", "choices": ["It is illegal to offer incentives", "The term \u201cfree\u201d is prohibited", "Lack of required written disclosure", "It must be approved by the Commissioner"], "correct": 2, "why": "Any \"free\" offer in an ad must clearly disclose its terms and conditions, so leaving them out is a violation.", "missed": true}, {"id": 18, "stem": "What is the primary purpose of a Substantive Policy Statement (SPS)?", "choices": ["To create new enforceable laws", "To clarify how an agency interprets and enforces laws", "To impose penalties on licensees", "To replace administrative rules"], "correct": 1, "why": "A Substantive Policy Statement explains how an agency reads and enforces the law, but it is not a binding rule.", "missed": false}, {"id": 19, "stem": "A buyer loses money on a real estate transaction due to a licensee's fraud and seeks compensation from the Arizona Real Estate Recovery Fund. Which of the following losses would the Fund most likely be prohibited from covering under A.R.S. \u00a7 32-2186(G)?", "choices": ["Direct financial harm caused by the licensee's fraudulent misrepresentation of the property's square footage.", "Lost profits the buyer projected they would earn from renting the property.", "The buyer's actual out-of-pocket down payment that was misappropriated.", "Escrow fees paid by the buyer that the licensee fraudulently diverted."], "correct": 1, "why": "The Recovery Fund pays actual losses, not speculative lost profits like projected rent.", "missed": false}, {"id": 20, "stem": "In Arizona, what is the maximum finder fee that can be paid to an unlicensed person who is a tenant in an apartment complex managed by the firm?", "choices": ["$100", "$500", "$1,000", "It is based on a percentage of the monthly rent The maximum that a tenant can earn from referrals is $1000 per any year."], "correct": 2, "why": "Arizona caps finder fees to unlicensed tenants at $1,000 per year.", "missed": true}, {"id": 21, "stem": "Which of the following is NOT a requirement for property management agreements in Arizona?", "choices": ["Clear, unambiguous language stating the duties and responsibilities", "Signature by both the property owner and the property management firm's broker", "An automatic renewal clause without the owner's consent", "Specification of the amount held as operating reserve"], "correct": 2, "why": "Arizona does not allow a property management agreement to renew automatically without the owner's consent.", "missed": false}, {"id": 22, "stem": "How are commissions negotiated between a real estate broker and a client in Arizona?", "choices": ["Commissions are fixed by the Arizona Department of Real Estate.", "They are subject to negotiation between the broker and the client.", "All commissions are standardized across the MLS boards.", "Commissions are determined by the brokerage."], "correct": 1, "why": "Commissions are always negotiable between broker and client; no law or board sets them.", "missed": false}, {"id": 23, "stem": "What is required when a broker changes their place of business in Arizona?", "choices": ["Inform the ADRE verbally within 30 days", "Post a notice on the brokerage's website", "Notify the commissioner in writing and receive a new license", "No action is required as long as the ADRE is informed at the time of license renewal"], "correct": 2, "why": "A broker who moves offices must notify the Commissioner in writing and get a license showing the new address.", "missed": false}, {"id": 24, "stem": "In Arizona, who can be paid finder fees by a property management firm?", "choices": ["Only licensed real estate salespersons", "Any unlicensed person who is a tenant in an apartment complex managed by the firm", "Friends or relatives of the property manager, regardless of their tenant status", "Anyone who asks for compensation, irrespective of their involvement"], "correct": 1, "why": "Arizona allows a property management firm to pay finder fees only to an unlicensed tenant of a complex it manages.", "missed": false}, {"id": 25, "stem": "For a subdivision public report, a developer must contain which of the following?", "choices": ["Ownership of the land.", "Access to water.", "Property location and surrounding area.", "All of these are required."], "correct": 3, "why": "A subdivision public report must include all the listed items, so \"all of these\" is correct.", "missed": false}, {"id": 26, "stem": "What steps should a broker take to ensure compliance with fair housing laws in Arizona?", "choices": ["Only show properties in neighborhoods that match the client's racial background.", "Provide equal service to all clients regardless of race, color, religion, sex, national origin, disability, or familial status.", "Advise clients about neighborhoods based on the presence of schools suited for their children.", "Refuse to work with clients who request to see properties in specific ethnic or racial neighborhoods."], "correct": 1, "why": "Fair housing compliance means giving the same service to everyone regardless of any protected class.", "missed": false}, {"id": 27, "stem": "What is the consequence for engaging in the unauthorized payment of finder fees in Arizona?", "choices": ["Mandatory attendance in a real estate ethics course", "A warning letter from the Arizona Department of Real Estate", "Suspension or revocation of the licensee's license or imposition of a civil penalty", "No consequences as long as the finder fee does not exceed $500"], "correct": 2, "why": "Paying finder fees improperly can lead to license suspension, revocation, or a civil penalty.", "missed": false}, {"id": 28, "stem": "Which of the following is a permissible action for the Real Estate Commissioner concerning license regulation in Arizona?", "choices": ["Granting a license without the required education", "Suspending or revoking a license for cause", "Ignoring complaints of unlicensed real estate activity", "Allowing a salesperson to perform the duties of a broker"], "correct": 1, "why": "The Commissioner can suspend or revoke a license for cause after due process.", "missed": false}, {"id": 29, "stem": "What is the purpose of the Real Estate Recovery Fund in Arizona?", "choices": ["To provide loans to real estate developers", "To compensate individuals harmed by the wrongful acts of licensed real estate professionals", "To fund real estate education programs", "To insure real estate properties against natural disasters"], "correct": 1, "why": "The Recovery Fund compensates people harmed by the wrongful acts of licensees.", "missed": false}, {"id": 30, "stem": "In a new home built by a builder who failed to furnish a public report, the owners have what rights?", "choices": ["They have an open civil claim for up to 5 years.", "They lost their rights under the rule of laches.", "They can rescind their purchase for up to 1 year.", "They can rescind their purchase for up to 3 years."], "correct": 3, "why": "When a builder fails to give a required public report, the buyer can rescind for up to 3 years.", "missed": false}, {"id": 31, "stem": "When broker Adam discovers that one of the agents in the brokerage has been doing property management on the side, what can he do to show adequate supervision of salespersons by a broker according to Arizona Commissioner\u2019s Rules?", "choices": ["Discuss the problems with Adam directly and put a note in the employee file.", "Confirm that the agent is licensed and property trained by the broker.", "Affirm that all contracts are turned in, reviewed and a trust account is set up.", "Notify ADRE of the action and self report along with agent."], "correct": 3, "why": "A broker must supervise, so self-reporting the agent's unlicensed side activity to ADRE shows proper oversight.", "missed": true}, {"id": 32, "stem": "Agent John has a complaint filed against him for failing to disclose. What steps must have happened to get here?", "choices": ["John obviously screwed up and is now in jeopardy.", "The broker is responsible for failing to supervise.", "A client made a claim to the ADRE recovery fund.", "A member of the public wrote a complaint that must be investigaged."], "correct": 3, "why": "ADRE investigations normally start when someone files a written complaint that must then be investigated.", "missed": false}, {"id": 33, "stem": "What is required from an employing broker in Arizona regarding business information?", "choices": ["Disclosure of all employees' personal information", "Disclosure of the designated broker\u2019s name, license number, and business address", "A list of all properties managed", "Annual financial statements reported to ADRE"], "correct": 1, "why": "An employing broker must disclose the designated broker's name, license number, and business address to ADRE.", "missed": false}, {"id": 34, "stem": "What is the main purpose of the Broker Management Clinic required by ADRE?", "choices": ["To educate brokers on the latest real estate trends", "To ensure compliance with real estate laws and rules", "To provide marketing strategies for brokers", "To update brokers on changes in mortgage financing"], "correct": 1, "why": "The Broker Management Clinic teaches brokers how to stay compliant with Arizona real estate law and rules.", "missed": false}, {"id": 35, "stem": "What best describes the requirement for brokers managing rental properties for others in Arizona?", "choices": ["A property management certification is required from ADRE.", "A general real estate broker license suffices.", "A separate property management license is needed.", "No specific license is required for managing rental properties."], "correct": 1, "why": "In Arizona a regular broker license is enough to manage rentals for others; no separate PM license exists.", "missed": false}, {"id": 36, "stem": "A salesperson or a broker can have which of the following as part of their license?", "choices": ["S-Corporation", "C-Corporation", "LLC", "PLLC"], "correct": 3, "why": "Arizona lets a salesperson or broker license be held by a professional limited liability company (PLLC).", "missed": false}, {"id": 37, "stem": "What is a requirement for advertising by licensees according to Arizona Administrative Code?", "choices": ["Including the licensee\u2019s personal contact information only", "Stating the office and location of their brokerage", "Using the term \u201cacre\u201d accurately according to specific measurements", "Advertising without the employing broker\u2019s name in digital mediums"], "correct": 2, "why": "Ads must use measurement terms like \"acre\" accurately so buyers are not misled.", "missed": true}, {"id": 38, "stem": "What is required for an Arizona broker to open a branch office?", "choices": ["A separate brokerage license for each branch office", "Approval from the Arizona Real Estate Department", "A designated branch manager who is with that brokerage", "All of these are required"], "correct": 2, "why": "A branch office needs a branch manager who is licensed with that same brokerage.", "missed": true}, {"id": 39, "stem": "What must a licensee do if engaged in unlawful license activity?", "choices": ["Cease all real estate activities immediately", "Notify ADRE and provide a written explanation of the activity", "Pay a fine to ADRE", "Attend a mandatory ethics course"], "correct": 1, "why": "A licensee who finds they are acting unlawfully must stop, notify ADRE, and explain in writing.", "missed": true}, {"id": 40, "stem": "How many hours of continuing education are required for a salespersons real estate license renewal in Arizona?", "choices": ["24 hours every 2 years", "30 hours every 2 years", "45 hours every 3 years", "60 hours every 4 years"], "correct": 0, "why": "Once a license is terminated for not renewing, it cannot be renewed; the person must reapply and requalify.", "missed": false}, {"id": 41, "stem": "What must a licensee do if they wish to advertise a listed property under another brokerage where and NOT their own brokerage\u2019s name?", "choices": ["Obtain written consent from the employing broker.", "Ensure that the advertisement clearly states the licensee's role as an agent.", "Advertise under their own name without any restrictions.", "Register the advertisement with the Arizona Department of Real Estate,"], "correct": 0, "why": "Arizona salespersons need 24 hours of continuing education every 2-year renewal cycle.", "missed": false}, {"id": 42, "stem": "When an agent has been terminated for failure to renew their license on time, how many months do they have to renew?", "choices": ["3", "6", "12", "Not possible to renew once terminated. Once they are terminated, they are no longer eligible to renew, and must start all over again. This means, they were NOT in the grace period and they are NOT eligible to renew at all."], "correct": 3, "why": "Advertising another broker's listing requires written consent from your own employing broker.", "missed": true}, {"id": 43, "stem": "What obligation does a real estate agent have regarding the presentation of all offers to their client?", "choices": ["Present only the offers above the asking price.", "Present offers in the order that they are received.", "Present all offers to the client promptly and in the order they were received when possible.", "Present only the highest and best offers that would meet the criteria assumed by seller."], "correct": 2, "why": "An agent must present every offer to the client promptly, in the order received.", "missed": false}, {"id": 44, "stem": "Which action is considered a breach of an agent's duty of loyalty to their client?", "choices": ["Seeking the best possible price for the client's property", "Accepting a commission from both the buyer and seller without full disclosure", "Refusing to disclose the client's minimum acceptable sale price to buyers", "Advising the client against accepting a low offer"], "correct": 1, "why": "Taking pay from both sides without full disclosure betrays the client and breaks the duty of loyalty.", "missed": false}, {"id": 45, "stem": "How should a broker handle conflicts of interest within the brokerage?", "choices": ["By assigning different agents to represent each party in the transaction.", "Ignoring minor conflicts to prioritize closing the transaction.", "Disclosing the conflict to all affected parties and seeking their written consent to proceed.", "Automatically terminating the brokerage\u2019s relationship with one of the parties."], "correct": 2, "why": "Brokers handle conflicts by disclosing them to everyone affected and getting written consent.", "missed": false}, {"id": 46, "stem": "Which scenario best illustrates a breach of the duty of loyalty by a real estate agent?", "choices": ["The agent advises the client to accept an offer that is below the listing price for a quicker sale.", "An agent purchases a property listed by them on behalf of a family member.", "Sharing confidential client information with another agent within the same brokerage.", "Refusing to present a lowball offer to the seller."], "correct": 1, "why": "Buying a listing for a relative without disclosure puts the agent's interests above the client's, breaching loyalty.", "missed": true}, {"id": 47, "stem": "Which statement accurately reflects the requirements for a brokerage's trust account?", "choices": ["It must be reconciled quarterly.", "Only the designated broker can authorize disbursements.", "Funds from multiple clients can be mixed if records are maintained.", "It is not required if the brokerage does not hold client funds."], "correct": 1, "why": "Trust account disbursements must be authorized by the designated broker, who is responsible for those funds.", "missed": true}, {"id": 48, "stem": "There are multiple types of listing agreements available in Arizona. When a broker has a coming soon listing, what would that most likely imply?", "choices": ["The property is not officially on the market and may not be for up to 10 days.", "The property is available for previews by appointment only.", "Agents must market the listing as if it were active.", "Offers can be made but not accepted until the listing is active."], "correct": 2, "why": "Under this course's answer, a \"coming soon\" listing is treated as a real listing that must be marketed by the rules like an active one.", "missed": true}, {"id": 49, "stem": "What is the best practice for a broker managing a real estate team within the brokerage?", "choices": ["Allow the team to operate independently with little oversight.", "Ensure the team\u2019s advertising complies with all regulatory standards and includes the brokerage name.", "Encourage the team to develop their own client agreements per Article 26 of the Constitution of Arizona.", "Permit the team to manage their trust accounts separately from the brokerage."], "correct": 1, "why": "A brokerage agreement ends as the agreement allows, such as written notice by either party.", "missed": false}, {"id": 50, "stem": "How should an agent handle confidential information received from their client with a regard to the listing and sale of the property?", "choices": ["Share with the broker and other agents within the agency only.", "Use the information to negotiate better deals on behalf of your clients.", "Keep it confidential indefinitely, even after the agency relationship ends.", "Disclose it if it benefits the transaction parties."], "correct": 2, "why": "A team's ads must follow all advertising rules and show the brokerage name.", "missed": false}, {"id": 51, "stem": "How does Arizona define the termination of a brokerage agreement?", "choices": ["Automatic upon the death of the salesperson.", "Only by mutual agreement of all parties involved.", "Through written notice by either party as outlined in the agreement.", "Expiration of the agreement without the possibility of renewal."], "correct": 2, "why": "Confidential client information must be kept confidential forever, even after the agency ends.", "missed": true}, {"id": 52, "stem": "A purchase contract that has a response time of 48 hours is finally responded to after the 3rd day with an acceptance of all terms in it\u2019s existing state. What is the status of the offer?", "choices": ["This can be rescinded.", "The buyer can accept this offer as it was accepted in it\u2019s existing state.", "The contract is voidable by the buyers.", "The contract is void in it\u2019s current state."], "correct": 3, "why": "An acceptance after the response deadline has passed is too late, so the offer has expired and there is no contract.", "missed": false}, {"id": 53, "stem": "When a buyer, represented by an agent who specialized in agricultural farm lands failes to open escrow with the buyers funds for earnest money, what options does the seller have?", "choices": ["A clause can be invoked allowing the removal of earnest monies to be deposited.", "The broker can contribute to the earnest money in an effort to keep the contract alive.", "A breach of contract has occurred and the buyer can legally terminate the offer.", "A cure notice should be sent by the sellers agent."], "correct": 3, "why": "When the buyer doesn't deliver earnest money, the seller's side sends a cure notice to start the cure period.", "missed": false}, {"id": 54, "stem": "Which element is crucial for the legality of a contract?", "choices": ["High value of consideration", "Presence of witnesses during signing", "Lawful purpose", "Notarization of the contract"], "correct": 2, "why": "A contract must have a lawful purpose, or it is void.", "missed": false}, {"id": 55, "stem": "Which scenario would likely result in a breach of contract in real estate transactions?", "choices": ["The buyer fails to secure financing by the agreed-upon date.", "The seller decides to include additional fixtures not previously listed.", "The real estate agent advises the buyer to request an inspection.", "Closing is delayed due to a backlog at the title company."], "correct": 0, "why": "Not getting financing by the agreed date is a failure to perform as the contract requires, which is a breach.", "missed": false}, {"id": 56, "stem": "Under what condition can a real estate contract be terminated without penalty by either party?", "choices": ["If there is a mutual agreement to do so.", "The property value decreases before closing.", "A better offer is received from another buyer.", "The buyer decides not to move to the area."], "correct": 0, "why": "Both parties can always mutually agree to cancel the contract without penalty.", "missed": false}, {"id": 57, "stem": "How does bankruptcy typically affect real estate contracts?", "choices": ["It invalidates all existing contracts", "It has no impact on contracts", "It may negate an agency relationship, preventing performance", "It automatically transfers property ownership"], "correct": 2, "why": "Bankruptcy can end the agency relationship and keep the parties from performing the contract.", "missed": true}, {"id": 58, "stem": "What is an essential element for the validity of a contract?", "choices": ["High value", "Legal purpose", "Multiple witnesses", "Public notarization"], "correct": 1, "why": "A contract must have a legal purpose to be valid.", "missed": false}, {"id": 59, "stem": "What term describes the temporary transfer of possession of property without the transfer of ownership?", "choices": ["Sale", "Lease", "Easement", "Encroachment"], "correct": 1, "why": "A lease transfers possession for a time while the owner keeps title.", "missed": false}, {"id": 60, "stem": "What distinguishes a fixture from personal property?", "choices": ["Its color and design", "Its permanence and integration with the property", "Its use in business operations", "Its value and cost"], "correct": 1, "why": "A fixture is attached and made part of the property, unlike movable personal property.", "missed": false}, {"id": 61, "stem": "Of the following choices, what best distinguishes a freehold estate from a leasehold estate?", "choices": ["Duration of ones interest", "The ability to make improvements", "The rights upon death to transfer ownership", "The legal obligation to pay property taxes"], "correct": 0, "why": "Freehold estates last an indefinite time, while leaseholds last a set or limited time.", "missed": false}, {"id": 62, "stem": "The owner of a Co-Op unit has a _____________ to show their interest in the prperty.", "choices": ["Affidavit of Ownership", "Deed", "Trust Certificate", "Proprietary Lease"], "correct": 3, "why": "A co-op owner holds shares plus a proprietary lease that gives the right to occupy a unit.", "missed": true}, {"id": 63, "stem": "How is a homestead in Arizona legally defined?", "choices": ["A property used as the family home", "Land used for agricultural purposes", "A historic property preserved for public benefit", "A primary residence designated for tax benefits"], "correct": 0, "why": "Arizona's homestead protects the home the owner lives in from certain creditors.", "missed": false}, {"id": 64, "stem": "How does a life estate differ from a fee simple estate?", "choices": ["It is based on the lifespan of an individual", "It cannot be sold or transferred", "It only applies to commercial properties", "It grants full ownership rights indefinitely"], "correct": 0, "why": "A life estate lasts only for someone's lifetime, while fee simple lasts forever and can be inherited.", "missed": false}, {"id": 65, "stem": "What is the legal consequence of a property owner dying intestate?", "choices": ["The property is immediately transferred to the state.", "The property is distributed according to the state's laws of succession.", "The property is auctioned off to the highest bidder.", "The property is held in a trust until a will is discovered."], "correct": 1, "why": "When someone dies without a will, state succession laws decide who inherits.", "missed": false}, {"id": 66, "stem": "What defines a Community Facilities District?", "choices": ["A zone where only community services are provided", "A special taxing district for public improvements", "An area designated for educational institutions", "A district exempt from property taxes"], "correct": 1, "why": "A Community Facilities District is a special taxing district that pays for public improvements.", "missed": true}, {"id": 67, "stem": "What determines the \"Assessed Value\" of a property for tax purposes?", "choices": ["The property's purchase price", "A valuation established by the county assessor", "The price determined by a private appraiser", "The insured value of the property"], "correct": 1, "why": "The county assessor sets the assessed value used for property taxes.", "missed": false}, {"id": 68, "stem": "What is condemnation in the context of eminent domain?", "choices": ["The process of legally seizing private property for public use", "A legal declaration that a building is unfit for use", "Imposing a fine on the property for zoning violations", "Revoking a property's occupancy permit"], "correct": 0, "why": "Condemnation is the legal process the government uses to take private property for public use under eminent domain.", "missed": false}, {"id": 69, "stem": "What is the tax treatment of debt relief in a short sale?", "choices": ["It is considered a charitable donation and is tax-deductible.", "It is not considered taxable income.", "The forgiven debt amount may be taxable as ordinary income.", "It reduces the seller's taxable income by the amount of the debt forgiven."], "correct": 2, "why": "Debt forgiven in a short sale can count as taxable income unless an exclusion applies.", "missed": false}, {"id": 70, "stem": "How does depreciation benefit real estate investors at tax time?", "choices": ["It increases the value of the property on tax returns.", "It allows investors to take a deduction for the perceived decrease in property value.", "It reduces the amount of rental income received.", "It is a direct credit against property taxes owed."], "correct": 1, "why": "Depreciation gives investors a yearly tax deduction for the building's wear and tear.", "missed": false}, {"id": 71, "stem": "How are Native American water rights typically established in Arizona?", "choices": ["Through executive orders by the Governor of Arizona", "By federal legislation specific to each tribe", "Through treaties and court decisions", "By agreements directly with the Arizona Department of Water Resources"], "correct": 2, "why": "Native American water rights come from treaties and federal court decisions.", "missed": true}, {"id": 72, "stem": "In Arizona water law, in what area can ground water be separated and sold apart from the actual land?", "choices": ["Anywhere in Arizona with permission from the State", "Only within Native American Soverign Territories", "Only in a Irrigation Non-Expansion Area", "Only in an Active Management Area"], "correct": 3, "why": "Under Arizona's 1980 Groundwater Management Act, groundwater in an Active Management Area can be severed and sold apart from the land.", "missed": true}, {"id": 73, "stem": "What is the primary concern of the Arizona Water Banking Authority?", "choices": ["Ensuring financial stability for water utilities", "Storing water credits for future use in the Arizona Water Bank", "Regulating the price of water sold between states", "Protecting investors in water infrastructure projects"], "correct": 1, "why": "The Arizona Water Banking Authority stores unused Colorado River water as credits for future use.", "missed": false}, {"id": 74, "stem": "If a water rights owner fails to use their water within __________ the water can revert back to the State to reissue to the next in line.", "choices": ["3 years", "2 years", "10 years", "5 years"], "correct": 3, "why": "In Arizona, surface water rights not used for 5 years can be forfeited back to the state.", "missed": false}, {"id": 75, "stem": "What are the health risks associated with mold in buildings?", "choices": ["Structural weakening of buildings", "Increased energy costs", "Health issues due to poor air quality", "Decreased property value only"], "correct": 2, "why": "Mold harms indoor air quality, which can cause health problems.", "missed": false}, {"id": 76, "stem": "Sick Building Syndrome (SBS) is characterized by:", "choices": ["The financial burden of maintaining older buildings", "Symptoms of illness by occupants without a specific cause", "Buildings being condemned due to historical significance", "Structural instability and the risk of collapse"], "correct": 1, "why": "Sick Building Syndrome means people feel sick in a building, but no specific cause is found.", "missed": true}, {"id": 77, "stem": "What is the primary concern with mold in buildings?", "choices": ["Decreasing property value", "Structural damage to foundations", "Health issues due to poor air quality", "Increased energy consumption"], "correct": 2, "why": "Mold's main concern is the health problems it causes through poor air quality.", "missed": false}, {"id": 78, "stem": "What defines a \"brownfield\" site?", "choices": ["Land allocated for industrial development only", "Contaminated properties being redeveloped for public use", "Agricultural lands converted to residential use", "Properties designated for conservation and wildlife protection"], "correct": 1, "why": "A brownfield is a contaminated property being cleaned up and redeveloped.", "missed": false}, {"id": 79, "stem": "What role do assessor\u2019s maps play in real estate?", "choices": ["They determine the historical value of properties.", "They are used for environmental impact studies.", "They identify parcels of land for tax purposes.", "They guide tourists through historical districts."], "correct": 2, "why": "Assessor's maps identify parcels by number for property tax purposes.", "missed": false}, {"id": 80, "stem": "In land description, what does \"ALTA\" stand for?", "choices": ["American Land Title Association", "Association of Land Survey Technicians", "American Legal and Taxation Authority", "Advanced Land Transfer Act"], "correct": 0, "why": "ALTA stands for American Land Title Association.", "missed": false}, {"id": 81, "stem": "If a rancher owned 2/3 of one section and 1/5 of another section, rounded, how many acres would they own?", "choices": ["128", "422", "550", "640"], "correct": 2, "why": "A section is 640 acres, so 2/3 is about 427 acres and 1/5 is 128 acres, about 555 total, closest to 550.", "missed": false}, {"id": 82, "stem": "How does the Arizona 811 (Blue Stake) program benefit land developers?", "choices": ["By marking property boundaries", "By identifying and marking underground utilities before excavation", "By staking claim to undeveloped land parcels", "By providing a warranty for construction materials"], "correct": 1, "why": "Arizona 811 marks buried utility lines before digging, so developers avoid hitting them.", "missed": true}, {"id": 83, "stem": "What is the primary purpose of a \"Master Deed\" in a Master Planned Community?", "choices": ["To outline the responsibilities of the homeowners' association (HOA)", "To grant ownership of common areas to homeowners via the HOA", "To provide a detailed map of all the lots within the community", "To establish the rules for architectural design within the community"], "correct": 1, "why": "In a master planned community, the master deed creates the common areas, held for owners through the HOA.", "missed": false}, {"id": 84, "stem": "What differentiates a Master Planned Community?", "choices": ["It includes only residential buildings", "It features amenities like parks, lakes, and trails", "It is smaller than a regular housing subdivision", "It does not include communal areas"], "correct": 1, "why": "Master planned communities feature shared amenities such as parks, lakes, and trails.", "missed": false}, {"id": 85, "stem": "What is required before a mechanic's lien can be filed?", "choices": ["A 20-day notice given to the property owner.", "Approval from the city council.", "A court judgment.", "Consent from the homeowner's association."], "correct": 0, "why": "Under this course's answer, a 20-day preliminary notice must be given before a mechanic's lien can be filed.", "missed": false}, {"id": 86, "stem": "What does a \"cloud on title\" represent?", "choices": ["Clear title without any liens or encumbrances.", "A disputed boundary line affecting property ownership.", "Any document, claim, or encumbrance that might impair the title.", "The presence of undeclared heirs to the property."], "correct": 2, "why": "A cloud on title is any claim or document that may impair the title.", "missed": false}, {"id": 87, "stem": "Which of the following best describes the purpose of an Affidavit of Value?", "choices": ["To confirm the zoning classification of a property", "To document the sales price for tax assessment purposes", "To verify the property's legal description", "To establish a homeowner's insurance value"], "correct": 1, "why": "The Affidavit of Property Value records the sale price for the assessor's use.", "missed": false}, {"id": 88, "stem": "What is the primary role of endorsements in a title insurance policy?", "choices": ["To extend the coverage period beyond the standard term", "To tailor the policy to fit specific needs of the insured", "To reduce the premium costs for the homeowner", "To increase the liability limit of the standard policy"], "correct": 1, "why": "Endorsements add or change coverage to fit the insured's specific needs.", "missed": true}, {"id": 89, "stem": "What does a \"Beneficiary Deed\" allow a property owner to do?", "choices": ["Immediately transfer ownership upon their death without probate", "Transfer the property to a charity", "Change the zoning of the property", "Bypass property tax assessments"], "correct": 0, "why": "A beneficiary deed passes the property to the named person at the owner's death without probate.", "missed": false}, {"id": 90, "stem": "If title conveys rights to a property, what does a deed do?", "choices": ["Conveys the rights to use for a defined time.", "Proves the rights of a lenders lien.", "Shows the signature of the grantee.", "Conveys ownership."], "correct": 3, "why": "A deed is the document that conveys ownership from grantor to grantee.", "missed": false}, {"id": 91, "stem": "How is the day of closing treated financially in Arizona?", "choices": ["It is considered a day of no financial activity", "Costs incurred on this day are divided equally between buyer and seller", "The buyer is responsible for all costs incurred on the day of closing", "The seller covers all expenses on the day of closing"], "correct": 2, "why": "By Arizona custom, the buyer owns the property on the day of closing and pays its costs.", "missed": false}, {"id": 92, "stem": "Who are typically the parties involved in an escrow transaction?", "choices": ["Buyer, seller, and mortgage broker only.", "Buyer, seller, escrow agent/company, title company, and lender.", "Buyer, real estate agents, and property inspector.", "Seller, buyer's family members, and appraiser."], "correct": 1, "why": "An escrow usually involves the buyer, seller, escrow/title company, and lender.", "missed": false}, {"id": 93, "stem": "What is the role of the \"escrow officer\"?", "choices": ["To negotiate the sale price between buyer and seller", "To oversee the closing process and ensure all conditions are met", "To inspect the property for any defects", "To provide financing to the buyer"], "correct": 1, "why": "The escrow officer is neutral and makes sure all conditions are met before closing.", "missed": false}, {"id": 94, "stem": "In wich of the following ways could HUD enforce fair housing laws?", "choices": ["By sending undercover testers to investigate compliance", "Through online surveys only", "By reviewing public records for discriminatory practices", "Solely based on written complaints"], "correct": 0, "why": "HUD uses undercover testers to check whether fair housing laws are followed.", "missed": true}, {"id": 95, "stem": "What is required for businesses under the Americans with Disabilities Act?", "choices": ["Providing service animals for customers with disabilities", "Reasonable accommodations for employees with disabilities", "Mandatory disability awareness training for all employees", "Installation of braille signage on all entry doors"], "correct": 1, "why": "The ADA requires reasonable accommodations for employees with disabilities.", "missed": false}, {"id": 96, "stem": "What is a typical feature of a commercial Net Lease?", "choices": ["The landlord is responsible for all property expenses.", "The tenant pays rent including a portion of the property's operational costs.", "The lease includes an option to buy at the end of the term.", "Rent covers only the use of the space, excluding maintenance and utilities."], "correct": 1, "why": "In a net lease, the tenant pays rent plus some or all of the property's operating costs.", "missed": false}, {"id": 97, "stem": "What defines an \"Estate for Years\" in lease terms?", "choices": ["A lease with an indefinite term.", "A lease dependent on the life span of the tenant.", "A fixed-term lease, ranging from months to years, without the need for renewal notice.", "A lease automatically renewing each month."], "correct": 2, "why": "An estate for years has a fixed end date, so no notice is needed to end it.", "missed": false}, {"id": 98, "stem": "How is a lease impacted by the sale of the leased property?", "choices": ["The lease is automatically terminated upon sale.", "The new owner must honor the existing lease terms.", "The tenant has the first right to purchase the property.", "The lease terms can be renegotiated with the new owner."], "correct": 1, "why": "A sale does not end a lease; the new owner takes the property subject to the existing lease.", "missed": true}, {"id": 99, "stem": "What characterizes a Graduated Lease?", "choices": ["Rent decreases over time based on predetermined conditions.", "Rent remains constant throughout the lease term.", "Rent increases at predetermined intervals.", "The lease automatically renews without rent adjustment."], "correct": 2, "why": "A graduated lease has rent that goes up at set intervals.", "missed": false}, {"id": 100, "stem": "Concessions in a commercial lease agreement would include which of the following?", "choices": ["Penalties for early termination of the lease.", "Bonuses awarded to tenants for extending their lease.", "Incentives offered by the landlord, like free rent for a period.", "Additional charges for late payments."], "correct": 2, "why": "Concessions are landlord incentives like free rent to attract tenants.", "missed": false}, {"id": 101, "stem": "What advantage does a \"Turnkey Project\" offer tenants?", "choices": ["It provides tenants with a raw space to design and build as per their business requirements.", "It offers a space that is ready for immediate occupation, with all fixtures and finishes completed.", "Tenants can turn the key in the lock of an unconstructed space, symbolizing the start of construction.", "It allows tenants to turn over the management of the building to a third party."], "correct": 1, "why": "A turnkey space is fully finished and ready to move into right away.", "missed": false}, {"id": 102, "stem": "What is the primary purpose of the Arizona Residential Landlord and Tenant Act?", "choices": ["To regulate the sale of residential properties", "To govern the rental of dwelling units and outline the rights and obligations of landlords and tenants", "To provide guidelines for commercial leasing", "To establish zoning laws for residential areas"], "correct": 1, "why": "The Arizona Residential Landlord and Tenant Act sets the rights and duties of landlords and tenants for rental homes.", "missed": false}, {"id": 103, "stem": "What is illegal under the Arizona Residential Landlord and Tenant Act?", "choices": ["Charging late fees", "Distraint for rent", "Requiring a security deposit", "Evicting a tenant for non-payment of rent"], "correct": 1, "why": "The Arizona Act abolished distraint, which means a landlord seizing a tenant's belongings for unpaid rent.", "missed": false}, {"id": 104, "stem": "What does Errors and Omissions (E&O) insurance cover?", "choices": ["Intentional misconduct by a brokerage's agents", "Unintentional errors or omissions made by agents", "Physical damage to the property listed by the brokerage", "All financial losses incurred by the brokerage"], "correct": 1, "why": "E&O insurance covers mistakes and oversights agents make without intending to.", "missed": false}, {"id": 105, "stem": "What is the National Flood Insurance Program designed to do?", "choices": ["Provide affordable insurance to property owners, renters, and businesses against flooding.", "Cover all natural disasters.", "Insure properties against fire and theft.", "Offer flood insurance exclusively to commercial properties."], "correct": 0, "why": "The NFIP offers affordable flood insurance to owners, renters, and businesses.", "missed": false}, {"id": 106, "stem": "In the appraisal process, what is the purpose of \"Reconciliation\"?", "choices": ["To average the values derived from different appraisal approaches.", "To determine the final appraisal value by analyzing and weighing the results of different approaches.", "To adjust property taxes according to the appraised value.", "To reconcile differences in property values among various appraisers."], "correct": 1, "why": "Reconciliation weighs the results of the appraisal approaches to reach a final value.", "missed": false}, {"id": 107, "stem": "What does \"Economic Life\" refer to in appraisal?", "choices": ["The period over which a property can be profitably exploited.", "The duration of a property's physical structure before it decays.", "The time span a property remains in demand in the market.", "The period a property maintains its economic utility."], "correct": 3, "why": "Economic life is how long a property keeps contributing value, or useful income.", "missed": false}, {"id": 108, "stem": "What does the \"alienation\" clause prevent?", "choices": ["Renting out the property without lender's permission", "The borrower from making structural changes to the property", "A new buyer from assuming the existing loan without lender's approval", "The lender from selling the loan on the secondary market"], "correct": 2, "why": "An alienation (due-on-sale) clause lets the lender call the loan if the property is sold, which blocks a buyer from assuming the loan without approval.", "missed": false}, {"id": 109, "stem": "Which institution primarily operates in the secondary mortgage market?", "choices": ["Commercial banks", "Credit unions", "Mortgage brokers", "Fannie Mae"], "correct": 3, "why": "Fannie Mae buys mortgages from lenders in the secondary market.", "missed": false}, {"id": 110, "stem": "What is the purpose of the Underwriting Fee in home loans?", "choices": ["To insure the property", "To prepare the loan and associated paperwork", "To cover the cost of property appraisal", "To pay for the loan origination"], "correct": 1, "why": "The underwriting fee pays the lender to evaluate and process the loan.", "missed": true}, {"id": 111, "stem": "What distinguishes a conventional loan from a government-backed one?", "choices": ["Not secured by any government entity", "Lower interest rates and fees", "No down payment required", "Automatic eligibility for veterans"], "correct": 0, "why": "A conventional loan is not insured or guaranteed by any government agency.", "missed": false}, {"id": 112, "stem": "Which property type is eligible for VA financing?", "choices": ["Investment properties", "Second homes", "Primary residences", "Commercial properties"], "correct": 2, "why": "VA loans are only for a veteran's primary residence.", "missed": false}, {"id": 113, "stem": "What is the purpose of a Deed of Reconveyance?", "choices": ["To transfer property to a new owner after sale.", "To encumber the property as collateral for another loan.", "To release the property from the lien after the loan is fully paid.", "To change the trustee in the deed of trust."], "correct": 2, "why": "A deed of reconveyance releases the deed of trust lien once the loan is paid off.", "missed": false}, {"id": 114, "stem": "What is a Promissory Note?", "choices": ["An agreement between the seller and buyer regarding property conditions.", "A document outlining the borrower's promise to repay a loan under specified terms.", "A legal form used to transfer property ownership without financial terms.", "An insurance policy covering the loan amount."], "correct": 1, "why": "A promissory note is the borrower's written promise to repay the loan on stated terms.", "missed": false}, {"id": 115, "stem": "What right does the trustor have during the reinstatement period?", "choices": ["To sell the property without paying off the debt.", "To reinstate the loan by paying the missed payments and penalties.", "To demand a judicial foreclosure instead.", "To change the trustee."], "correct": 1, "why": "A trustor can reinstate the loan by paying the missed amounts, fees, and costs before the sale.", "missed": false}, {"id": 116, "stem": "What is a deed in lieu of foreclosure?", "choices": ["A legal action taken by borrowers to challenge a foreclosure.", "A process where the borrower voluntarily transfers ownership to the lender to avoid foreclosure.", "A document transferring property to a new buyer after foreclosure.", "A court order preventing foreclosure."], "correct": 1, "why": "In a deed in lieu, the borrower voluntarily deeds the property to the lender to avoid foreclosure.", "missed": false}, {"id": 117, "stem": "What is an \"Estoppel Agreement\" in the context of a deed in lieu of foreclosure?", "choices": ["An agreement that accelerates the loan repayment schedule.", "A contract that allows the lender to change the agreed interest rates.", "A document stating that all parties agree to the terms of the deed in lieu and waive future claims.", "A legal form that stops the foreclosure process immediately."], "correct": 2, "why": "An estoppel agreement confirms the deed in lieu terms and keeps the parties from making later claims.", "missed": false}, {"id": 118, "stem": "How is the trustee's sale and bidding process initiated?", "choices": ["By a private invitation to selected bidders.", "Through publication in a newspaper and posting on the property.", "By direct negotiation with the highest bidder.", "Always held on an online auction site."], "correct": 1, "why": "A trustee's sale begins with a notice of sale that is recorded, published in a newspaper, and posted on the property.", "missed": false}, {"id": 119, "stem": "Licensed real estate agents are allowed to fix and flip homes under what conditions?", "choices": ["All contractors were licensed no matter the size or scope of the work.", "The broker knew of this flip and has an E&O policy to cover this.", "A full list of all repairs and contractors used is supplied to the public.", "All parties are made aware and acknowledge in writing."], "correct": 3, "why": "A licensee who flips homes must disclose their license status and interest, with all parties acknowledging in writing.", "missed": false}, {"id": 120, "stem": "What must be disclosed about homes that were used in the manufacturing of drugs?", "choices": ["The potential decrease in property value due to this status.", "What type of drugs were manufactured in the home.", "The potential of harmful effects left over from the manufacturing process.", "The property must be professionally remediated within a period of one year."], "correct": 3, "why": "Under this course's answer, a former drug lab property must be professionally remediated within a set period, and it must be disclosed.", "missed": false}, {"id": 121, "stem": "How does the law regard improvements made without the necessary permits?", "choices": ["They are automatically covered under homeowner\u2019s insurance.", "Disclosure is required for any work done and whether permits were obtained.", "Penalties are assessed based on the property's value.", "Improvements must be demolished if discovered by inspectors."], "correct": 1, "why": "Sellers must disclose work done on the home and whether permits were obtained.", "missed": false}, {"id": 122, "stem": "How does the Telephone Consumer Protection Act impact real estate agents?", "choices": ["It prohibits them from using email to contact clients.", "It restricts them from making unsolicited calls to numbers on the national do-not-call registry.", "It requires them to obtain written consent before listing a property.", "It limits the hours during which they can make business calls."], "correct": 1, "why": "The TCPA bars unsolicited calls to numbers on the national Do Not Call registry.", "missed": false}, {"id": 123, "stem": "What disclosures are required for properties near military training routes?", "choices": ["Only the times when training occurs need to be disclosed.", "Disclosure of potential noise and disturbance from military activities is required.", "The exact routes of military training flights must be included in property listings.", "Sellers must provide buyers with a map of all military bases within 50 miles."], "correct": 1, "why": "Buyers must be told about possible noise from military training routes and nearby military activity.", "missed": false}, {"id": 124, "stem": "How are \"fix and flip\" activities regulated in terms of disclosure?", "choices": ["Flippers must disclose only the final sale price.", "No disclosures are required if the property is sold \"as is.\"", "Legal disclosures include any known defects or material facts while in possession.", "Only cosmetic improvements must be disclosed."], "correct": 2, "why": "Flippers must disclose any known defects and material facts that come up while they own the home.", "missed": false}, {"id": 125, "stem": "A loan consisting of an 80/20 ratio combination for a house with a sales price of $225,000, and a rate of 5% for the first mortgage, and a rate of 5.5% for the second mortgage, would have a first mortgage loan amount of:", "choices": ["$45,000", "$180,000", "$225,000", "$60,000"], "correct": 1, "why": "80% of $225,000 is $180,000, which is the first mortgage amount.", "missed": false}, {"id": 126, "stem": "A borrower gets a loan from National Bank for $220,000. The borrower buys his interest rate down 1/4% and has a 1% origination fee. What are the lender fees?", "choices": ["$3,300", "$6,800", "$6,600", "$2,200"], "correct": 2, "why": "A common rule is 1 point buys the rate down 1/8%, so 1/4% costs 2 points, plus the 1% origination: 3% x $220,000 = $6,600.", "missed": false}, {"id": 127, "stem": "A borrower applying for a loan has income generating from rental properties he owns. The properties rent for a total income netting $50,000. How much of the $50,000 can be considered as income when applying for a mortgage loan.", "choices": ["$25,000", "$37,500", "$40,000", "$50,000"], "correct": 3, "why": "Under the course's answer, the lender counts the full $50,000 net rental income.", "missed": false}, {"id": 128, "stem": "A small town bank is quoting a potential borrower that they can get a loan at 3% on a $300,000 purchase loan, but there are additional finance costs of $3300. What is the actual percentage rate (APR):", "choices": ["3.3%", "3%", "4.1%", "5%"], "correct": 2, "why": "$3,300 / $300,000 = 1.1%, and 3% + 1.1% = 4.1% APR.", "missed": false}, {"id": 129, "stem": "Lender Lenny loaned Louis $9000. It was a note that earns Lender Lenny $300 per quarter. What is the annual percentage rate:", "choices": ["3.3%", "13.3%", "10%", "6.3%"], "correct": 1, "why": "$300 x 4 = $1,200 per year, and $1,200 / $9,000 = 13.3%.", "missed": false}, {"id": 130, "stem": "Escrow is closed for a sale on March 10th. The seller paid his taxes of $1400 upfront for the year and the insurance was also paid up front for $549.10. What is the seller expected to get back assuming there are 365 days in a year and day of close belongs to buyer?", "choices": ["$363.12", "$1585.98", "$871.14", "$1239.81"], "correct": 1, "why": "The seller owned 68 days (Jan 1 to Mar 9), so the buyer repays 297 of 365 days: $1,949.10 / 365 x 297 = $1,585.98.", "missed": false}, {"id": 131, "stem": "Comp #1 sold for $150,000. Comp #1 is identical to the subject property in all aspects, except that Comp #1 has a fourth bedroom and a two car garage while the subject property does not. If an extra bedroom is worth $5,000 and a garage is worth $8500, what is the adjusted value of Comp #1?", "choices": ["$163,500", "$136,500", "$145.000", "$158,500"], "correct": 1, "why": "Comp #1 has extras the subject lacks, so subtract them: $150,000 - $5,000 - $8,500 = $136,500.", "missed": false}, {"id": 132, "stem": "A Broker in California referred a buyer to another broker in Nevada. Their agreement stated that the broker in Nevada would pay a 25% referral to the broker in California if a sale took place. If the Nevada broker has a brokerage policy that all agents in the office have a 50/50 split on commissions earned. What commission would the referring broker in California receive if the Nevada agent has a contract with a sales price of $640,000 and the offered commission were 3%:", "choices": ["$14,400", "$19,200", "$4,800", "$7,200"], "correct": 2, "why": "3% of $640,000 is $19,200, and the 25% referral is taken off the top before any office split: $4,800.", "missed": false}, {"id": 133, "stem": "Under what regulatory body are pest inspection companies and inspectors licensed in Arizona?", "choices": ["Board of Technical Registration", "Pest Management Division of the Department of Agriculture", "Arizona Department of Financial Institutions", "Registrar of Contractors"], "correct": 1, "why": "Arizona pest control companies and inspectors are licensed by the Pest Management Division of the Department of Agriculture.", "missed": true}, {"id": 134, "stem": "How does providing multiple referrals for services like home inspections benefit the consumer?", "choices": ["It guarantees the lowest price.", "It offers the consumer choices and prevents accusations of tie-in agreements.", "It speeds up the transaction process.", "It ensures all inspectors are members of the NAR."], "correct": 1, "why": "Giving several referrals lets the consumer choose and avoids any look of a tie-in deal.", "missed": false}, {"id": 135, "stem": "What is the significance of Net Worth (Book Value) in real estate business accounting?", "choices": ["It indicates the total debt of the company", "It represents the value of the company if its assets were liquidated", "It shows the annual profit margin", "It reflects the cost of goods sold"], "correct": 1, "why": "Net worth (book value) is what the company would be worth if its assets were sold and debts paid.", "missed": false}, {"id": 136, "stem": "What is the primary purpose of Financial Statements in real estate business accounting?", "choices": ["To record the da
