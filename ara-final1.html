mmon with Al who owns 2/3 and Dale owns 1/3", "Dale is now tenant in common with Al as 1/2 and 1/2 equal owners", "Al,Bea\u2019s heirs and Dale are all equal 1/3 owners as tenants in common", "Al and Dale are equal joint tenants and Bea\u2019s heir has a tenant in common status"], "correct": 0, "why": "Cam's sale breaks the joint tenancy only for his share, so Dale is a tenant in common with 1/3; Al gets Bea's share by survivorship and holds 2/3.", "missed": true}, {"id": 142, "stem": "Which of the following statements is true regarding a broker's trust account?", "choices": ["The broker may pay other bills with the portion of the money that represents commissions due", "A salesperson can be a signatory on the account", "It may contain up to $300 of the broker's personal funds", "The trust account must be bonded"], "correct": 1, "why": "With the designated broker's written permission, a salesperson may sign on the trust account.", "missed": true}, {"id": 143, "stem": "Taking title as Community Property with your spouse in the State of Arizona will result in who getting ownership if one of the spouses suddenly dies?", "choices": ["The spouse will have half of the ownership", "The spouse will own the entire property", "The government will own the deceased parties half", "The deceased parties children will own half"], "correct": 1, "why": "Community property with right of survivorship passes the whole property to the surviving spouse; this course treats Arizona community property that way.", "missed": false}, {"id": 144, "stem": "Most homes in Arizona are sold with legal descriptions that state?", "choices": ["Metes and bounds", "Latitude and longitude", "Lot and block", "Township and range"], "correct": 2, "why": "Most Arizona homes are in recorded subdivisions, so they use lot and block descriptions.", "missed": true}, {"id": 145, "stem": "When may a Licensee use the term \"REALTOR\"?", "choices": ["The licensee has been licensed for three years", "The licensee is a member of the National Association of Realtors", "The licensee passes their real estate exams", "The licensee finishes their first year of continued education courses"], "correct": 1, "why": "Only members of the National Association of REALTORS may use the REALTOR mark.", "missed": false}, {"id": 146, "stem": "If the borrower defaults, what is the clause in a mortgage that allows the lender to declare the entire unpaid portion of the loan due immediately?", "choices": ["The Acceleration clause", "The escalation clause", "The clause of termination", "The default clause"], "correct": 0, "why": "The acceleration clause lets the lender call the whole balance due when the borrower defaults.", "missed": false}, {"id": 147, "stem": "Expiration of a lease term without renewal would do what to the lease?", "choices": ["Terminate it", "Make it void", "Cause the landlord to go into debt", "Cause the tenant to abandon the property"], "correct": 0, "why": "A lease that runs out without renewal ends.", "missed": false}, {"id": 148, "stem": "Which of the below best describes Ranges?", "choices": ["Strips of land that run north and south and are six miles wide in the rectangular survey system", "Strips of land that run from east to west and are six miles wide in the rectangular survey system", "A plot of land that the government uses for official surveying", "A strip of land that is 1.5 acres by 2.5 acres"], "correct": 0, "why": "Ranges are 6-mile-wide strips that run north and south in the rectangular survey system.", "missed": false}, {"id": 149, "stem": "Before which of the following dates must real estate be built in accordance to the Lead Based Paint Reduction Act?", "choices": ["1980", "1976", "1969", "1978"], "correct": 3, "why": "Lead paint rules apply to homes built before 1978.", "missed": false}, {"id": 150, "stem": "In determining the full cash value of real property for taxation purposes, the county assessor utilizes all of the following data EXCEPT?", "choices": ["Affidavits of property value filed for comparable property", "Building permits issued for renovation purposes", "Comments from the local zoning authority", "Reports from the assessor's field appraisers"], "correct": 2, "why": "The assessor uses market data, not zoning authority comments, to find full cash value.", "missed": true}, {"id": 151, "stem": "It is 5PM on the 90th day. What is the significance of this day for a trustor?", "choices": ["It is the first day the trustor can redeem the property", "It is the last day the trustor can reinstate the property", "It is when the trustor is allowed to give the property to the trustee", "It is when the trustor can get a loan for the property"], "correct": 1, "why": "Arizona trustors can reinstate until 5 PM the last business day before the trustee's sale, which this course frames as the 90th day.", "missed": false}, {"id": 152, "stem": "Terms and conditions of employment, outline of expected duties and scope of authority are all contained in what?", "choices": ["A proprietorship agreement", "An all rights reserved agreement", "A properly drawn out property management contract", "A tenant at will agreement"], "correct": 2, "why": "A property management contract sets out the terms, duties, and authority of the manager.", "missed": false}, {"id": 153, "stem": "Real estate loan that pays down the principal balance as payments are made and is payable in periodic installments:", "choices": ["An amortized loan", "A bank-owned loan", "A conventional loan", "A reverse annuity mortgage"], "correct": 0, "why": "An amortized loan pays down principal with each regular payment.", "missed": false}, {"id": 154, "stem": "An owner receives shares of stock in which of the following?", "choices": ["Bargain and Sale Deed", "Trustees Sale", "Cooperative", "Vendor Sale"], "correct": 2, "why": "Co-op owners get shares of stock in the corporation that owns the building.", "missed": false}, {"id": 155, "stem": "The Department of Housing and Urban Development enforces which of the following?", "choices": ["Federal Administration Fund", "The Economic Zone Act of 1984", "Fair business transactions", "The Fair Housing Act of 1968"], "correct": 3, "why": "HUD enforces the Fair Housing Act of 1968.", "missed": false}, {"id": 156, "stem": "Failure of the developer to provide a public report to all prospective owners or purchasers of real property in Arizona could result in the owner rescinding their contract for a period of how long?", "choices": ["1 year", "2 years", "3 years", "5 years"], "correct": 2, "why": "A buyer who never got a required public report may rescind for up to 3 years.", "missed": false}, {"id": 157, "stem": "A graduated lease would be the most desirable for which of the following?", "choices": ["A new business", "An old business", "A suffering estate", "A tenant at will of the landlord"], "correct": 0, "why": "A graduated lease starts with low rent that rises later, which helps a new business.", "missed": false}, {"id": 158, "stem": "A listing agreement addresses the payment of a ___ ?", "choices": ["Retainer fee", "Underground inspection", "Home appraisal", "Overage fee"], "correct": 0, "why": "Under this course's answer, the listing agreement covers payment of the broker's fee, called a retainer fee here.", "missed": false}, {"id": 159, "stem": "There are many items that are required in a valid listing agreement, which of the following is not required?", "choices": ["The signature of the principal or parties representing the principal", "Any and all material terms", "Any sort of provision for an automatic renewal", "The beginning date and termination date"], "correct": 2, "why": "A valid listing agreement must not include automatic renewal, so that is the one not required.", "missed": true}, {"id": 160, "stem": "When dealing with ______________, agents are expected to have an understanding and basic level of knowledge concerning environmental laws but not expected to be experts.", "choices": ["Real estate laws and procedures", "Fiduciary duties", "Environmental Hazards", "Contracts"], "correct": 2, "why": "Agents must know enough about environmental hazards to spot them, but are not expected to be experts.", "missed": true}, {"id": 161, "stem": "Under a deed of trust foreclosure, which party has the rights to convey or sell if the borrower is in default?", "choices": ["Lender", "Beneficiary", "Trustor", "Trustee"], "correct": 3, "why": "Under a deed of trust, the trustee holds power of sale and conducts the sale if the borrower defaults.", "missed": false}, {"id": 162, "stem": "The last payment on a a certain type of loan is also known as the?", "choices": ["Term end payment", "Balloon Payment", "Consequential payment", "Sum up payment"], "correct": 1, "why": "A balloon payment is the large final payment on a loan that does not fully amortize.", "missed": false}, {"id": 163, "stem": "In Arizona, if a purchaser under a contract for deed is in default for failing to pay monies due, the?", "choices": ["Vendor may immediately declare the vendee's interest in the property forfeit", "Vendor may declare the vendee's interest forfeit only after allowing an agreed upon amount of time for the vendee to reinstate", "Buyer may file a declaration of homestead which will keep him from losing any equity", "Seller may declare the interest of the buyer forfeit only after the expiration of a reinstatement period prescribed by law"], "correct": 1, "why": "Arizona law requires the seller (vendor) to give a set grace period and notice before forfeiting the buyer's interest.", "missed": false}, {"id": 164, "stem": "In order to file a valid claim against the Arizona Real Estate Recovery Fund, all of the following conditions must exist EXCEPT?", "choices": ["The claimant must obtain a civil judgment that is uncollectible", "The claimant must file suit within five years", "The aggrieved party must attempt to collect payment awarded in a judgement from the licensee prior to filing", "The claimant must be an Arizona resident"], "correct": 3, "why": "A Recovery Fund claimant does not need to be an Arizona resident.", "missed": true}, {"id": 165, "stem": "In Arizona, which of the following is a salesperson entitled to before a real estate license is suspended or revoked?", "choices": ["Hearing", "Probation", "A federal court hearing", "A salesperson is not entitled to anything before a license is revoked"], "correct": 0, "why": "A licensee is entitled to a hearing before a license is suspended or revoked.", "missed": false}, {"id": 166, "stem": "A real estate license is considered inactive for a grace period up to how long?", "choices": ["Two years", "Ninety days", "One year", "Six months"], "correct": 2, "why": "An expired license has a one-year grace period to renew before it is gone.", "missed": false}, {"id": 167, "stem": "Rank the following liens in the order of their priority for payment from highest to lowest: IRS tax lien; real property taxes; special assessments?", "choices": ["IRS tax lien, special assessments, real property taxes", "IRS tax lien, real property taxes, special assessments", "Real Property taxes, special assessments, IRS tax lien", "Real property taxes, IRS tax lien, special assessments"], "correct": 2, "why": "Property taxes and special assessments come first, ahead of the IRS lien.", "missed": true}, {"id": 168, "stem": "A lessee puts in a bookshelf for commercial use; at the end of the lease, the bookshelf is removed and is taken with the tenant after moving out. This would be a:", "choices": ["Real property", "A trade fixture", "Appurtenant", "Chattel real"], "correct": 1, "why": "A tenant's business equipment like a bookshelf is a trade fixture the tenant may remove.", "missed": true}, {"id": 169, "stem": "A broker does not need to prove which of the below in order to collect their commission when under an exclusive right to sell listing?", "choices": ["That the listing was signed by the seller", "That the listing itself was valid", "That the broker is licensed and was licensed at the time of the sale", "That the procuring cause of the sale was the broker"], "correct": 3, "why": "In an exclusive right-to-sell, the broker gets paid no matter who sells, so procuring cause doesn't have to be proved.", "missed": false}, {"id": 170, "stem": "A hazardous waste site is commonly known as what?", "choices": ["Redlining Area", "Asbestos Ground Area", "ADEQ Soiled Site", "Superfund site"], "correct": 3, "why": "Superfund sites are hazardous waste sites cleaned up under CERCLA.", "missed": true}, {"id": 171, "stem": "An origination point is equal to what amount?", "choices": ["1% of the loan amount", "1% above current interest rates", "1% of the sale\u2019s price", "$1,000 dollars"], "correct": 0, "why": "One point equals 1% of the loan amount.", "missed": false}, {"id": 172, "stem": "Which of the following scenarios is an example of an estate at will?", "choices": ["A tenant stops paying rent because they lost their job", "A tenant and landlord's written agreement that shows the length of tenancy and how much rent is to be paid", "Becky's lease has expired but the building owner agrees to let her stay until the new owners who are in the process of selling their house are ready to move in", "The owner has complete and free enjoyment of the property"], "correct": 2, "why": "Staying on with the owner's permission after a lease ends, with no set end date, is an estate at will.", "missed": true}, {"id": 173, "stem": "What happens when a deed is delivered and accepted?", "choices": ["Title to real estate passes", "A deed is officially recorded", "A sales contract is signed by the buyer and seller", "A listing agreement is signed"], "correct": 0, "why": "A deed transfers title once it is delivered and accepted.", "missed": false}, {"id": 174, "stem": "Betsy lets her neighbors park their RV on her driveway for a few weeks and doesn't charge them any rent for it. What has Betsy given her neighbors?", "choices": ["A license", "An easement by necessity", "A fee simple estate", "An estate by leasehold"], "correct": 0, "why": "Free, permission-only use of land is a license, not a lease.", "missed": false}, {"id": 175, "stem": "Taylor owns an auto body shop that has been in business for fifty years. What happened to the auto body shop when the local government rezoned the area to residential multi-family?", "choices": ["The building must be taken down", "The body shop is in violation", "The body shop is grandfatherd", "The body shop will be converted to appropriately fit the zoning purpose"], "correct": 2, "why": "A use allowed before rezoning may continue as a nonconforming, or \"grandfathered\", use.", "missed": false}, {"id": 176, "stem": "The Arizona real estate commissioner may perform each of the following duties, EXCEPT?", "choices": ["Hire and fire the employees of the state real estate department", "Revoke a license upon complaint of fraud", "Inspect the business records of a licensee at any time", "Investigate complaints against licensees"], "correct": 1, "why": "The Commissioner cannot revoke a license just because a complaint was filed; a hearing is required first.", "missed": true}, {"id": 177, "stem": "A first time home buyer sees a model home and loves it. The builder is an Arizona local builder. He later enters into a contract to build a home just like the existing model home. After multiple delays, he wants to cancel the contract. Can he do this?", "choices": ["If it is within the grace period, he can", "The buyer can do this within 3 days", "If construction hasn't started, the buyer will be able to cancel", "The buyer is not able to rescind the contract"], "correct": 3, "why": "Under this course's answer, a buyer building from a model home with a local builder has no right to rescind this contract.", "missed": true}, {"id": 178, "stem": "A five day notice must be given to a tenant for what purpose?", "choices": ["Before entering for a routine const MODE = "full";
const letters = ["A","B","C","D"];
let Q = ALL.slice(), i = 0, right = 0, locked = false, firstTry = true, wrong = [];
const $ = id => document.getElementById(id);
function render() {
  const q = Q[i]; locked = false; firstTry = true;
  $("count").textContent = (i+1) + " / " + Q.length;
  $("stem").textContent = q.stem;
  $("why").hidden = true;
  $("next").disabled = true;
  $("score").textContent = right + " right of " + i;
  const box = $("choices"); box.innerHTML = "";
  q.choices.forEach((t, idx) => {
    const b = document.createElement("button");
    b.className = "choice"; b.textContent = letters[idx] + ". " + t;
    b.addEventListener("click", () => pick(b, idx));
    box.appendChild(b);
  });
}
function finishQ(q) {
  locked = true;
  document.querySelectorAll(".choice").forEach((b, n) => { b.disabled = true; if (n === q.correct) b.classList.add("good"); });
  $("score").textContent = right + " right of " + (i+1);
  $("next").disabled = false;
}
function pick(btn, idx) {
  if (locked) return;
  const q = Q[i], why = $("why");
  if (idx === q.correct) {
    if (firstTry) right++;
    finishQ(q);
    why.hidden = false; why.textContent = q.why;
    return;
  }
  btn.classList.add("bad"); btn.disabled = true;
  if (firstTry) { wrong.push(q); }
  firstTry = false;
  if (MODE === "full") { btn.textContent = "Incorrect"; return; }
  finishQ(q);
  why.hidden = false; why.innerHTML = "";
  const b = document.createElement("b");
  b.textContent = "Correct answer: " + letters[q.correct] + ". " + q.choices[q.correct];
  why.appendChild(b); why.appendChild(document.createTextNode(q.why));
}
function done() {
  const pct = Math.round(100 * right / Q.length);
  $("count").textContent = "Done";
  $("score").textContent = ""; $("next").disabled = true;
  const m = $("main");
  m.innerHTML = '<div class="done"><p>You got <b>' + right + ' of ' + Q.length + '</b> right on the first try (' + pct + '%).</p>' + (pct >= 75 ? '<p>That is a passing score (75%).</p>' : '<p>Passing is 75%.</p>') + '</div>';
  const d = m.firstChild;
  if (wrong.length) { const r = document.createElement("button"); r.textContent = "Retry the " + wrong.length + " I missed"; r.onclick = () => restart(wrong); d.appendChild(r); d.appendChild(document.createElement("br")); }
  const a = document.createElement("button"); a.textContent = "Start over"; a.onclick = () => restart(ALL); d.appendChild(a);
}
function restart(list) {
  Q = list.slice(); i = 0; right = 0; wrong = [];
  $("main").innerHTML = '<p class="stem" id="stem"></p><div class="choices" id="choices"></div><div class="why" id="why" hidden></div>';
  render();
}
$("next").addEventListener("click", () => { if (i < Q.length-1) { i++; render(); } else done(); });
render();
</script></body></html>
