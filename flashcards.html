<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AZ exam flashcards</title>
<style>
  :root {
    --bg: #10211c;
    --ink: #1c1915;
    --paper: #f6f1e7;
    --muted: #5c564c;
    --line: #e4dccb;
    --gold: #c4a15a;
    --az: #1f6b4a;
    --nat: #3d5a80;
    --warn: #8a4b12;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    background: var(--bg);
    color: #f6f1e7;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header { padding: 14px 4px 8px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .04em; margin: 0 0 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .filters::-webkit-scrollbar { display: none; }
  button.chip {
    border: 1px solid rgba(246,241,231,.25);
    background: transparent;
    color: #f6f1e7;
    border-radius: 999px;
    padding: 8px 14px;
    font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    white-space: nowrap;
  }
  button.chip.on { background: #f6f1e7; color: var(--bg); border-color: #f6f1e7; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .scene { width: min(100%, 440px); height: min(62dvh, 460px); perspective: 1200px; }
  .card {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2,.7,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--paper);
    color: var(--ink);
    border-radius: 22px;
    padding: 22px 22px 18px;
    display: flex; flex-direction: column;
    box-shadow: 0 18px 40px rgba(0,0,0,.28);
    overflow: auto;
  }
  .back { transform: rotateY(180deg); }
  .badge {
    align-self: flex-start;
    font: 700 11px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 5px 8px;
    border-radius: 999px;
    background: #e7efe9;
    color: var(--az);
  }
  .badge.nat { background: #e6edf5; color: var(--nat); }
  .badge.warn { background: #f6e6d4; color: var(--warn); margin-left: 6px; }
  .kicker { display: flex; gap: 6px; align-items: center; }
  .term { font-size: 28px; line-height: 1.2; margin: 18px 0 0; }
  .answer { font-size: 18px; line-height: 1.45; margin: 16px 0 0; }
  .hint {
    margin-top: auto;
    font: 500 13px/1.3 -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--muted);
  }
  footer {
    display: grid;
    grid-template-columns: 64px 1fr 64px;
    align-items: center;
    gap: 8px;
    padding: 12px 0 10px;
  }
  .nav {
    width: 64px; height: 56px;
    border: 0; border-radius: 16px;
    background: #1c3a31;
    color: #f6f1e7;
    font-size: 28px;
  }
  .nav:disabled { opacity: .35; }
  .count {
    text-align: center;
    font: 600 15px/1.3 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .section-name { display: block; font-weight: 400; opacity: .75; font-size: 12px; margin-top: 3px; }
</style>
</head>
<body>
<header>
  <h1>Arizona salesperson exam</h1>
  <div class="filters" id="filters"></div>
</header>
<main>
  <div class="scene">
    <div class="card" id="card" role="button" aria-label="Flashcard. Tap to flip.">
      <div class="face front">
        <div class="kicker"><span class="badge" id="badge">National</span></div>
        <h2 class="term" id="front"></h2>
        <div class="hint">Tap the card to flip</div>
      </div>
      <div class="face back">
        <div class="kicker"><span class="badge" id="badge2">National</span><span class="badge warn" id="warn" hidden>Skip, not verified</span></div>
        <p class="answer" id="back"></p>
        <div class="hint">Tap to flip back</div>
      </div>
    </div>
  </div>
</main>
<footer>
  <button class="nav" id="prev" aria-label="Previous card">‹</button>
  <div class="count"><span id="count"></span><span class="section-name" id="sec"></span></div>
  <button class="nav" id="next" aria-label="Next card">›</button>
</footer>
<script>
const CARDS = [{"id": "N1", "section": "National. Property", "side": "National", "front": "Real property vs personal property", "back": "Real property is the land and what is attached to it. Personal property is movable. A bill of sale transfers personal property. A deed transfers real property.", "unverified": false}, {"id": "N2", "section": "National. Property", "side": "National", "front": "Fixture", "back": "Personal property that has become real property by attachment. Tests often use MARIA: Method of attachment, Adaptability, Relationship of the parties, Intention, Agreement. Intention of the person who attached it is the strongest factor. Trade fixtures installed by a tenant for business usually stay personal property and may be removed before the lease ends.", "unverified": false}, {"id": "N3", "section": "National. Property", "side": "National", "front": "Emblements", "back": "Annual crops produced by labor. They are personal property. A former tenant may have the right to harvest a crop planted before the tenancy ended.", "unverified": false}, {"id": "N4", "section": "National. Property", "side": "National", "front": "Economic characteristics of land", "back": "Scarcity, modification (improvements), permanence of investment (fixity), and area preference (situs). Situs is the one people pay for: location.", "unverified": false}, {"id": "N5", "section": "National. Property", "side": "National", "front": "Physical characteristics of land", "back": "Immobility, indestructibility, and non-homogeneity (uniqueness). Because every parcel is unique, a buyer can sometimes sue for specific performance.", "unverified": false}, {"id": "N6", "section": "National. Property", "side": "National", "front": "Legal descriptions", "back": "Three methods: metes and bounds (starts at a point of beginning and must close), rectangular (government) survey (townships, sections), and lot-and-block (recorded plat). A street address is not a legal description.", "unverified": false}, {"id": "N7", "section": "National. Property", "side": "National", "front": "Section, township, acre", "back": "A section is 1 mile by 1 mile, 640 acres. A township is 36 sections (6 miles by 6 miles). An acre is 43,560 square feet. A mile is 5,280 feet. Memorize the last two. They are not given at the test center.", "unverified": false}, {"id": "N8", "section": "National. Property", "side": "National", "front": "Government powers (PETE)", "back": "Police power (zoning, building codes; no compensation), eminent domain (take for public use with just compensation; the process is condemnation), taxation, escheat (property goes to the state when a person dies with no will and no heirs).", "unverified": false}, {"id": "N9", "section": "National. Property", "side": "National", "front": "Private controls", "back": "CC&Rs, HOA rules, easements, licenses, and encroachments. A license is permission and is revocable. An easement is a right to use and is usually not revocable at will. An encroachment is a physical intrusion, found by a survey.\n\n---", "unverified": false}, {"id": "N10", "section": "National. Ownership, title, deeds", "side": "National", "front": "Fee simple absolute", "back": "The largest estate. Inheritable, transferable, and of unlimited duration. \"Fee simple defeasible\" can be lost if a condition is broken (determinable or condition subsequent).", "unverified": false}, {"id": "N11", "section": "National. Ownership, title, deeds", "side": "National", "front": "Life estate", "back": "Lasts for someone's life. The future interest is a reversion (back to the grantor) or a remainder (to a named third party). The life tenant must not commit waste.", "unverified": false}, {"id": "N12", "section": "National. Ownership, title, deeds", "side": "National", "front": "Leasehold estates", "back": "Estate for years (fixed end date, no notice required to end), periodic estate (renews until notice), estate at will (either party may end it), estate at sufferance (tenant stays after the right ends; a holdover).", "unverified": false}, {"id": "N13", "section": "National. Ownership, title, deeds", "side": "National", "front": "Joint tenancy vs tenants in common", "back": "Joint tenancy has the right of survivorship. The four unities are time, title, interest, and possession. Tenants in common have no survivorship. Shares can be unequal. Either form can be transferred, but a joint tenant's transfer usually breaks the survivorship as to that share.", "unverified": false}, {"id": "N14", "section": "National. Ownership, title, deeds", "side": "National", "front": "Lien priority", "back": "Property tax liens usually jump to the front. Then the rule is generally first in time, first in right, by recording date. A mechanic's lien can relate back to the date work started, which is why it can beat a later mortgage.", "unverified": false}, {"id": "N15", "section": "National. Ownership, title, deeds", "side": "National", "front": "Valid deed", "back": "Grantor with capacity, grantee identified, granting words, a legal description, consideration is usually recited, signed by the grantor, and delivered and accepted. Recording is not required for the deed to be valid between the parties. Recording protects against later buyers.", "unverified": false}, {"id": "N16", "section": "National. Ownership, title, deeds", "side": "National", "front": "Types of deeds", "back": "General warranty: grantor warrants title against claims from the whole chain. Special warranty: grantor warrants only against defects that arose while the grantor held title. Bargain and sale: implies ownership, few or no warranties. Quitclaim: releases whatever interest the grantor has, if any. No warranties.", "unverified": false}, {"id": "N17", "section": "National. Ownership, title, deeds", "side": "National", "front": "Voluntary vs involuntary alienation", "back": "Voluntary: deed, will, dedication. Involuntary: foreclosure, adverse possession, condemnation, escheat, erosion. Avulsion is a sudden loss of land (the boundary often stays). Accretion is a gradual deposit (the owner usually gains it).", "unverified": false}, {"id": "N18", "section": "National. Ownership, title, deeds", "side": "National", "front": "Recording and notice", "back": "Recording gives constructive notice to the world. Actual notice is what a person really knows. A buyer who records without notice of an earlier unrecorded claim is a bona fide purchaser and is usually protected. Chain of title is the history of transfers. A cloud on title is a claim that makes title doubtful. Marketable title is free of reasonable doubt.", "unverified": false}, {"id": "N19", "section": "National. Ownership, title, deeds", "side": "National", "front": "Title insurance", "back": "Protects against title defects that exist at the policy date and are not excluded. The owner's policy protects the buyer, usually for the purchase price. The lender's policy protects the lender, usually for the loan balance, and decreases as the loan is paid. It is not a home warranty and does not cover future zoning changes.\n\n---", "unverified": false}, {"id": "N20", "section": "National. Value and appraisal", "side": "National", "front": "Market value vs market price", "back": "Market value is the most probable price a willing buyer and willing seller would agree on, neither under duress, with reasonable exposure. Market price is what the property actually sold for. Cost is what it took to build. Assessed value is for taxes.", "unverified": false}, {"id": "N21", "section": "National. Value and appraisal", "side": "National", "front": "Principles of value", "back": "Highest and best use, substitution (the ceiling is the cost of an equally desirable substitute), contribution, conformity, progression and regression, supply and demand, anticipation, and change.", "unverified": false}, {"id": "N22", "section": "National. Value and appraisal", "side": "National", "front": "Three approaches", "back": "Sales comparison: adjust the comps to the subject. Used most for houses. Cost: reproduction or replacement cost minus depreciation, plus land. Used for special-purpose property. Income: NOI divided by cap rate. Used for income property.", "unverified": false}, {"id": "N23", "section": "National. Value and appraisal", "side": "National", "front": "Depreciation in the cost approach", "back": "Physical deterioration (wear), functional obsolescence (outdated design; may be curable), external or economic obsolescence (outside the property, such as a nearby factory; usually incurable). Land is not depreciated.", "unverified": false}, {"id": "N24", "section": "National. Value and appraisal", "side": "National", "front": "CMA vs appraisal vs BPO", "back": "A CMA is an agent's estimate of a likely sale price from comps. It is not an appraisal. An appraisal is an opinion of value by a licensed or certified appraiser under federal oversight (FIRREA / USPAP). A BPO is a broker's price opinion, often for a lender, and is not an appraisal.", "unverified": false}, {"id": "N25", "section": "National. Value and appraisal", "side": "National", "front": "Cap rate and GRM", "back": "Cap rate = NOI ÷ value. Value = NOI ÷ cap rate. NOI is income after operating expenses and before debt service. Do not subtract the mortgage payment to get NOI. GRM = price ÷ gross rent (usually monthly). A lower GRM means a lower price relative to rent.\n\n---", "unverified": false}, {"id": "N26", "section": "National. Contracts and agency", "side": "National", "front": "Elements of a valid contract", "back": "Competent parties, offer and acceptance (mutual assent), lawful purpose, and consideration. The outline also lists that it must be voluntary. A real estate sale contract must also satisfy the statute of frauds: in writing and signed by the party to be charged.", "unverified": false}, {"id": "N27", "section": "National. Contracts and agency", "side": "National", "front": "Valid, void, voidable, unenforceable", "back": "Valid: all elements, enforceable. Void: never a contract (illegal purpose, no capacity in some cases). Voidable: one party may cancel (minor, duress, misrepresentation). Unenforceable: it exists but a court will not enforce it (oral contract for land).", "unverified": false}, {"id": "N28", "section": "National. Contracts and agency", "side": "National", "front": "Executed vs executory", "back": "Executory: promises still open (a purchase contract before closing). Executed: fully performed (after closing and delivery of the deed).", "unverified": false}, {"id": "N29", "section": "National. Contracts and agency", "side": "National", "front": "Offer and counteroffer", "back": "An offer can be revoked before acceptance, unless an option keeps it open. A counteroffer kills the original offer. Acceptance must be communicated. The mailbox rule is a common exam point: acceptance is effective when properly mailed, if the offer allowed that method.", "unverified": false}, {"id": "N30", "section": "National. Contracts and agency", "side": "National", "front": "Equitable title", "back": "When the purchase contract is signed, the buyer holds equitable title. The seller holds legal title in trust until closing. Risk of loss follows the contract, but the equitable-title point is the one the outline names.", "unverified": false}, {"id": "N31", "section": "National. Contracts and agency", "side": "National", "front": "Earnest money", "back": "Not required to make a contract. It shows good faith and is often treated as liquidated damages if the buyer defaults and the contract says so. It is not the consideration. The promise to buy and the promise to sell are the consideration.", "unverified": false}, {"id": "N32", "section": "National. Contracts and agency", "side": "National", "front": "Contingencies", "back": "A condition that must be met or waived, or the contract ends. Common ones: financing, inspection, sale of the buyer's home, appraisal. The party who benefits must act in good faith and within the deadline.", "unverified": false}, {"id": "N33", "section": "National. Contracts and agency", "side": "National", "front": "Statute of frauds and electronic signatures", "back": "Contracts for the sale of land, and leases longer than one year, must be in writing. Listing agreements that pay a commission must be in writing to be enforceable. Federal and state law generally allow electronic signatures and electronic contracts. Arizona's version is A.R.S. § 44-101(6) and (7). See A1.", "unverified": false}, {"id": "N34", "section": "National. Contracts and agency", "side": "National", "front": "Breach remedies", "back": "Rescission (undo the contract), specific performance (court orders the transfer, because land is unique), and damages. Liquidated damages are an amount agreed in advance (often the earnest money). Compensatory damages cover the actual loss. Punitive damages punish and are rare in ordinary contract cases.", "unverified": false}, {"id": "N35", "section": "National. Contracts and agency", "side": "National", "front": "Option vs right of first refusal", "back": "An option is a unilateral contract: the seller must sell if the buyer exercises within the time, and the buyer does not have to buy. A right of first refusal gives a person the chance to match an offer the owner is ready to accept.", "unverified": false}, {"id": "N36", "section": "National. Contracts and agency", "side": "National", "front": "Listing agreements", "back": "Exclusive right to sell: the listing broker is paid if the property sells during the term, no matter who found the buyer. Exclusive agency: the owner can sell without paying the broker. Open listing: only the broker who procures the buyer is paid. Net listing: broker keeps everything above a set net. It is a conflict of interest and is illegal or heavily restricted in many places. Treat it as a conflict, not as a recommended listing.", "unverified": false}, {"id": "N37", "section": "National. Contracts and agency", "side": "National", "front": "How agency is created and ended", "back": "Created by express agreement, implication, or, rarely, estoppel or ratification. Ended by completion, expiration, mutual agreement, revocation, renunciation, death or incapacity of the principal or the broker (the brokerage, not a salesperson), destruction of the property, or bankruptcy in some cases. Confidentiality usually survives.", "unverified": false}, {"id": "N38", "section": "National. Contracts and agency", "side": "National", "front": "Fiduciary duties", "back": "To the client: obedience (lawful instructions), loyalty, disclosure, confidentiality, accounting, and reasonable care and skill. To customers and other parties: honesty, fairness, and disclosure of material facts about the property. You do not owe a customer loyalty or confidentiality of the client's secrets.", "unverified": false}, {"id": "N39", "section": "National. Contracts and agency", "side": "National", "front": "Antitrust", "back": "Price fixing (even a \"suggested\" commission agreed among brokers), group boycott, market allocation, and tie-in arrangements violate the Sherman Act. Commissions are negotiable. Never say \"the going rate\" as if brokers agreed to it.\n\n---", "unverified": false}, {"id": "N40", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "Fair housing protected classes", "back": "Federal Fair Housing Act: race, color, religion, sex, national origin, familial status, and disability. HUD treats sexual orientation and gender identity as covered under sex. Steering, blockbusting, and redlining are illegal. Advertising cannot show a preference (\"no kids,\" \"perfect for a Christian family\").", "unverified": false}, {"id": "N41", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "Familial status and disability exceptions", "back": "Housing for older persons can be exempt from familial status (62 and over, or 55 and over if at least 80% of units have one occupant 55 or older). A landlord must allow reasonable modifications and reasonable accommodations for a disability. A pet rule can yield to a support animal. The landlord does not have to allow a modification that is not reasonable, and the tenant may have to restore the unit.", "unverified": false}, {"id": "N42", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "Lead-based paint", "back": "For housing built before 1978, the seller or landlord must disclose known lead-based paint and give the EPA pamphlet. Buyers get 10 days to inspect, unless waived. There is no duty to remove it just because it is there.", "unverified": false}, {"id": "N43", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "Other environmental hazards", "back": "Asbestos (don't disturb it; encapsulate or abate), radon (odorless gas; mitigation if high), mold (moisture), underground storage tanks, brownfields, and flood zones (flood insurance is separate from a standard homeowners policy; required in a special flood hazard area when there is a federally related loan).", "unverified": false}, {"id": "N44", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "CERCLA", "back": "The Superfund law. Owners and operators can be strictly liable for cleanup of hazardous waste, even if they did not cause it. SARA added an innocent-landowner defense when the buyer did appropriate due diligence (Phase I, and Phase II if indicated).", "unverified": false}, {"id": "N45", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "RESPA", "back": "Applies to most federally related residential mortgage loans. Requires disclosure of settlement costs and bars kickbacks and unearned fees for referrals of settlement services. A real rebate of the broker's own commission to a client is treated differently from a kickback to a settlement-service provider. Affiliated business arrangements must be disclosed.", "unverified": false}, {"id": "N46", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "TRID", "back": "TILA-RESPA Integrated Disclosures. The Loan Estimate replaces the old good-faith estimate and early TIL for most closed-end consumer mortgages. The Closing Disclosure replaces the HUD-1. The outline expects you to know the names LE and CD and that the CFPB is the regulator.", "unverified": false}, {"id": "N47", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "Regulation Z and advertising a credit term", "back": "Truth in Lending. If an ad states a trigger term (down payment, payment amount, number of payments, finance charge), it must also state the other required terms, including the APR. The APR is the true cost of credit, including certain fees, not just the note rate.", "unverified": false}, {"id": "N48", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "ECOA", "back": "Equal Credit Opportunity Act. Lenders cannot discriminate based on race, color, religion, national origin, sex, marital status, age, or because income comes from public assistance. It is a credit law, not the Fair Housing Act, though they overlap.", "unverified": false}, {"id": "N49", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "Loan types", "back": "Conventional: not insured or guaranteed by the government. PMI is common if the LTV is above 80%. FHA: insured by FHA, allows a smaller down payment, has a mortgage insurance premium. VA: guaranteed, for eligible veterans, often no down payment, uses a funding fee, not mortgage insurance. USDA: rural. Seller financing: land contract or contract for deed. The seller keeps legal title until paid.", "unverified": false}, {"id": "N50", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "Lien theory vs title theory and deed of trust", "back": "Lien theory: the borrower keeps title and the lender has a lien (mortgage). Title theory: title is held by the lender or a trustee until paid. A deed of trust uses three parties: trustor (borrower), beneficiary (lender), trustee. Foreclosure is often by trustee's sale, which is nonjudicial. Arizona uses the deed of trust as the usual security instrument. See A28.", "unverified": false}, {"id": "N51", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "Primary vs secondary market", "back": "Primary: where the borrower gets the loan (bank, mortgage company). Secondary: where loans are bought and sold (Fannie Mae, Freddie Mac, Ginnie Mae). Selling loans lets lenders make new ones.", "unverified": false}, {"id": "N52", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "Discount points and LTV", "back": "One discount point is 1% of the loan amount, paid up front, usually to lower the rate. LTV = loan ÷ value (or price, whichever the lender uses; often the lower of price or appraised value). Equity = value minus liens.", "unverified": false}, {"id": "N53", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "PITI and prorations", "back": "PITI is principal, interest, taxes, and insurance, the usual monthly housing payment. Prorations split an annual cost between buyer and seller. The question will say 360 or 365 days and who owns the day of closing. Debit the person who owes. Credit the person who is paid or who already paid.", "unverified": false}, {"id": "N54", "section": "National. Practice, fair housing, disclosures, finance", "side": "National", "front": "Do not call and privacy", "back": "The national Do Not Call rules limit cold calls to numbers on the registry. There are exceptions for an existing business relationship and for a consumer who inquired, for a limited time. CAN-SPAM covers commercial email. Gramm-Leach-Bliley requires a privacy notice when a licensee is a \"financial institution\" sharing nonpublic personal information.\n\n---", "unverified": false}, {"id": "A1", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "Four sources of Arizona real estate law", "back": "Constitution, statutes (A.R.S.), administrative rules (A.A.C., the Commissioner's rules), and case law. ADRE administers A.R.S. Title 32, Chapter 20, and A.A.C. Title 4, Chapter 28. Source: ADRE salesperson curriculum, Dec 2025, module 1.1.", "unverified": false}, {"id": "A2", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "Article 26", "back": "A licensed broker or salesperson, acting as broker or salesperson for the parties or as agent for one of them, may draft or complete, without a separate charge, instruments incident to the sale, exchange, trade, rental, or lease. The list includes purchase agreements, earnest-money receipts, deeds, mortgages, leases, and bills of sale. You cannot charge a document-preparation fee for that work, and you are not acting as the party's lawyer. Source: Arizona Constitution, Article 26, Section 1, azleg.gov.", "unverified": false}, {"id": "A3", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "What a salesperson is", "back": "A salesperson is a natural person who performs broker acts only through a licensed broker (or through a licensed PLLC or PC that is engaged by that broker). A salesperson does not work independently. Source: A.R.S. § 32-2101(53) and (55); § 32-2155.", "unverified": false}, {"id": "A4", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "Who pays you", "back": "You accept employment and compensation as a licensee only from the broker you are licensed to, or from another licensed employer who issues you a W-2, has the same employing broker, and has that broker's written permission. If you are licensed through a PC or PLLC, the broker pays that entity. An escrow company cannot pay an unlicensed person a commission. Source: A.R.S. § 32-2155.", "unverified": false}, {"id": "A5", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "License period and renewal education", "back": "A license period is two years. A salesperson renews with 24 credit hours of approved continuing education, at least 3 hours in each mandatory category in R4-28-402(A)(5)(a) through (h): agency law, contract law, requirements for licensees, real estate legal issues, fair housing and ADA, disclosure, and then business brokerage and general real estate as the rule structures the 24 hours. An inactive license does not require CE while inactive. If inactive more than 15 years, a state-law exam is required before activation. Source: A.R.S. § 32-2101(33); § 32-2130; A.A.C. R4-28-402.", "unverified": false}, {"id": "A6", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "Original license timing", "back": "At least 90 hours of approved prelicense education, the school's final exam, passed no more than 10 years before the application. You must be at least 18. Pass the Pearson exams within one year before the application. Finish the six-hour Arizona Contract Writing course before licensure. Fingerprint clearance card and proof of legal presence are required. Passing the exam does not guarantee a license. Source: Pearson candidate handbook, Feb 2026.", "unverified": false}, {"id": "A7", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "Expired license", "back": "While expired, you cannot do licensed work. You may renew within one year after expiration without retaking the exam, if the license was not canceled or suspended. CE taken after expiration can count. The department terminates a license that has been expired more than one year. If the employing broker's license expires, the licenses under that broker are severed. Source: A.R.S. § 32-2130.", "unverified": false}, {"id": "A8", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "Recovery fund, what it pays", "back": "It pays an actual, direct, out-of-pocket loss from a real estate or cemetery transaction, including reasonable attorney fees and court costs, caused by a licensee who either did an act that required a license or committed fraud while acting as a principal when the victim relied on the license. Source: A.R.S. § 32-2186(A).", "unverified": false}, {"id": "A9", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "Recovery fund limits", "back": "Not more than $30,000 for each transaction, no matter how many people or parcels. Not more than $90,000 for each licensee. Source: A.R.S. § 32-2186(B).", "unverified": false}, {"id": "A10", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "What the recovery fund does not pay", "back": "Not lost profits or other speculation. Not property outside Arizona. Not losses from loans, notes, limited partnerships, or other securities. Not a tenant's conduct, vandalism, natural causes, punitive damages, postjudgment interest, or undocumented losses. A licensee acting as principal or agent has no claim. The fund pays only against a natural person's license. Source: A.R.S. § 32-2186(D)–(G).", "unverified": false}, {"id": "A11", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "After a recovery fund payment", "back": "The judgment debtor's licenses and license rights under Title 32, Chapter 20 terminate on the date of payment. The person cannot apply for reinstatement until the underlying judgment is satisfied and the fund is reimbursed, including interest at the legal rate. Source: the notice required by A.R.S. § 32-2188, as set out in § 32-2188.04 (opened with the recovery-fund statutes).", "unverified": false}, {"id": "A12", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "Transaction records", "back": "The employing broker keeps transaction and employment records at least five years after the transaction or employment ends. Rejected offers are kept at least one year, or five years if a later contract binds. The designated broker reviews each listing, purchase contract, or nonresidential lease within 10 business days of execution and initials it on the signature page. Business day excludes Saturday, Sunday, and Arizona legal holidays. Source: A.R.S. § 32-2151.01.", "unverified": false}, {"id": "A13", "section": "Arizona. Regulatory framework and licensing", "side": "Arizona", "front": "Earnest money and the trust account", "back": "Every licensee promptly puts cash, checks, or other items of value from a transaction into the care of the designated broker. The contract or receipt must state the type of earnest money (cash, check, note, or other). Only a licensee under that broker may be authorized to withdraw from the broker's trust account (with a narrow statutory exception). Source: A.R.S. § 32-2151.01(B)–(D).\n\n---", "unverified": false}, {"id": "A14", "section": "Arizona. Consumer protection", "side": "Arizona", "front": "Statute of frauds", "back": "No action on an agreement to lease for longer than one year, or to sell real property, unless it or a memorandum is in writing and signed by the party to be charged. If an agent signs, the agent's authority must be in writing. An agreement employing a broker to buy or sell real property for a commission must also be in writing. Source: A.R.S. § 44-101(6) and (7).", "unverified": false}, {"id": "A15", "section": "Arizona. Consumer protection", "side": "Arizona", "front": "Consumer Fraud Act", "back": "The ADRE curriculum tests the 1967 Consumer Fraud Act, A.R.S. § 44-1522, enforced by the Attorney General, and its use against misrepresentation in real estate. Do not memorize a penalty number. It was not opened for this set. Know that deception or concealment of a material fact in connection with a sale can violate it, separate from an ADRE license action.", "unverified": false}, {"id": "A16", "section": "Arizona. Consumer protection", "side": "Arizona", "front": "Stigmatized property", "back": "No civil, criminal, or administrative action lies against a transferor, lessor, or licensee for failing to disclose that the property was the site of a natural death, suicide, homicide, or other felony; that an owner or occupant had HIV or AIDS or a disease not known to be transmitted by ordinary occupancy; or that a sex offender lives nearby. Failure to disclose those facts is not grounds to rescind. Other material defects still must be disclosed. Source: A.R.S. § 32-2156.", "unverified": false}, {"id": "A17", "section": "Arizona. Consumer protection", "side": "Arizona", "front": "Homestead", "back": "A person 18 or older who lives in Arizona may hold one homestead, exempt from attachment, execution, and forced sale, in the residence (house, condo, co-op, or a mobile home or similar shelter plus its land). The statute's base is $400,000 of equity. Beginning January 1, 2024, that cap is adjusted every January 1 for CPI and rounded up to the nearest $100. The statute page does not print the 2026 adjusted dollar amount. A married couple shares one exemption. Identifiable cash proceeds are protected for 18 months or until a new homestead, whichever is shorter. Refinancing proceeds are not protected. Source: A.R.S. § 33-1101.", "unverified": false}, {"id": "A18", "section": "Arizona. Consumer protection", "side": "Arizona", "front": "Community property", "back": "Property acquired by either spouse during the marriage is community property, except property acquired by gift, devise, or descent, and property acquired after service of a dissolution, separation, or annulment petition if a decree follows. Source: A.R.S. § 25-211. Both spouses generally must sign a deed or a contract to sell community real estate. Confirm the signing requirement with your prelicense text if a question turns on it. The signature rule was not re-opened in Title 33 for this set.\n\n---", "unverified": false}, {"id": "A19", "section": "Arizona. Advertising", "side": "Arizona", "front": "No blind ads", "back": "A licensee shall not advertise property in a way that implies no salesperson or broker is involved in the offer. Source: A.A.C. R4-28-502(A).", "unverified": false}, {"id": "A20", "section": "Arizona. Advertising", "side": "Arizona", "front": "Broker's name", "back": "Every ad must identify, in a clear and prominent manner, the employing broker's legal name or the d.b.a. name on the broker's license certificate. The designated broker is responsible for the advertising of all real estate activity. Online ads that target Arizona residents must meet the same rules on the advertisement itself, without making the reader scroll to find them. Source: A.A.C. R4-28-502(E), (G), and (J). Rule amended effective December 13, 2025.", "unverified": false}, {"id": "A21", "section": "Arizona. Advertising", "side": "Arizona", "front": "Owner/agent", "back": "A licensee who advertises the licensee's own property, or another licensee's property, for sale, lease, or exchange in Arizona must disclose the license and the ownership by placing the words \"owner/agent\" in the ad. Source: A.A.C. R4-28-502(B).", "unverified": false}, {"id": "A22", "section": "Arizona. Advertising", "side": "Arizona", "front": "Acre and signs", "back": "Do not use the word \"acre,\" alone or modified, unless the land is at least 43,560 square feet. Get the owner's written consent before placing a sign or publishing a notice that a specific property is offered, and remove it promptly if the owner asks. Source: A.A.C. R4-28-502(H) and (I).", "unverified": false}, {"id": "A23", "section": "Arizona. Advertising", "side": "Arizona", "front": "Premiums and lotteries", "back": "Do not describe a free or reduced-cost premium as an \"award,\" a \"prize,\" or a similar word. Disclose the terms, costs, conditions, restrictions, and expiration in writing before the person participates. A person shall not sell an interest in a development by a lottery, contest, drawing, or game of chance, unless the law provides otherwise. A subdivider, timeshare developer, or campground operator can apply to ADRE for approval. Source: A.A.C. R4-28-503.", "unverified": false}, {"id": "A24", "section": "Arizona. Advertising", "side": "Arizona", "front": "Advertising someone else's listing", "back": "If you advertise property that is the subject of another person's employment agreement, the ad itself must say the properties shown are not your own transaction history and must include information about the other licensee's transactions. Source: A.A.C. R4-28-502(F).\n\n---", "unverified": false}, {"id": "A25", "section": "Arizona. Agency and duties", "side": "Arizona", "front": "Fiduciary duty and fair dealing", "back": "A licensee owes a fiduciary duty to the client and shall protect and promote the client's interests. The licensee shall also deal fairly with all other parties. Source: A.A.C. R4-28-1101(A). The ADRE curriculum lists the common-law duties as obedience, loyalty, disclosure, confidentiality, accounting, and reasonable skill and care. Confidentiality continues after the agency ends.", "unverified": false}, {"id": "A26", "section": "Arizona. Agency and duties", "side": "Arizona", "front": "Written disclosure of material facts", "back": "A licensee in a transaction shall disclose in writing to all other parties information the licensee has that materially or adversely affects the consideration, including: the seller or lessor may be unable to perform; the buyer or lessee may be unable to perform; a known adverse material fact or material defect; and a lien or encumbrance on the property. Source: A.A.C. R4-28-1101(B).", "unverified": false}, {"id": "A27", "section": "Arizona. Agency and duties", "side": "Arizona", "front": "Both parties and extra compensation", "back": "Do not accept compensation from, or represent, more than one party without the prior written consent of all parties. Do not accept any compensation, rebate, or other consideration for goods or services related to the transaction without that person's prior written acknowledgment. Broker-to-broker compensation for representing a party is the exception in the rule. Source: A.A.C. R4-28-1101(F) and (G).", "unverified": false}, {"id": "A28", "section": "Arizona. Agency and duties", "side": "Arizona", "front": "Conflicts, in writing, before a binding agreement", "back": "Before the parties enter a binding agreement, disclose in writing a present or prospective interest, including: you are licensed and acting as a principal; the buyer or seller is immediate family of you or your designated broker; the buyer or seller owns or is employed by your employing broker; or you or your immediate family has a financial interest other than your compensation. Source: A.A.C. R4-28-1101(E).", "unverified": false}, {"id": "A29", "section": "Arizona. Agency and duties", "side": "Arizona", "front": "Speed and fights between agents", "back": "Perform expeditiously. Do not delay on purpose or by neglect. If you cannot perform, tell your designated broker right away. A fight with another licensee must not jeopardize, delay, or interfere with a client's transaction. You do not have to give up a commission dispute to comply. Source: A.A.C. R4-28-1101(C) and (D).", "unverified": false}, {"id": "A30", "section": "Arizona. Agency and duties", "side": "Arizona", "front": "Competence", "back": "Your work must meet the standards of the discipline you practice. Do not take on a property type or service outside your competence unless you bring in someone who is competent, or you first disclose the lack of expertise in writing and the client still hires you. Source: A.A.C. R4-28-1101(H).", "unverified": false}, {"id": "A31", "section": "Arizona. Agency and duties", "side": "Arizona", "front": "How Arizona agency ends", "back": "The curriculum lists expiration of the employment agreement, completion of the transaction, cancellation under the agreement's terms, and mutual cancellation. Confidentiality survives. Compensation from someone does not by itself create representation. Source: ADRE curriculum module 4.4 and the resource guide citing A.R.S. § 32-2151.02 and the Alaface case. Case holdings were not re-read for this set. Use the rule text you have.\n\n---", "unverified": false}, {"id": "A32", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Subdivision", "back": "Improved or unimproved land divided or proposed to be divided for sale or lease into six or more lots, parcels, or fractional interests. Includes a common promotional plan, a stock cooperative, and residential condominiums. Does not include leasehold offerings of one year or less, or lots of 36 acres or more (measured to the center of contiguous dedicated roads or easements). Source: A.R.S. § 32-2101(59).", "unverified": false}, {"id": "A33", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Unsubdivided land", "back": "Land divided into six or more lots that are each 36 acres or more but less than 160 acres, or offered under a common promotional plan, other than agricultural leases. It is regulated, but it is not a \"subdivision\" under the six-lot definition. Source: A.R.S. § 32-2101(64).", "unverified": false}, {"id": "A34", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Public report", "back": "A subdivider shall not sell or lease, or offer to sell or lease, lots in a subdivision in Arizona without first obtaining a public report from the commissioner (unless a statutory exemption applies) and, where required, a certificate of administrative completeness. The subdivider must give each initial buyer or lessee a copy before that person signs, and take a receipt. A sale or lease before the report is issued, or a failure to deliver the report, is rescindable. The buyer or lessee must sue within three years after signing. Source: A.R.S. § 32-2183(A) and (I).", "unverified": false}, {"id": "A35", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Assured water supply", "back": "If the subdivision is inside an active management area, the commissioner denies the public report unless the subdivider has a certificate of assured water supply from the director of water resources (and has paid the fees), or a written commitment from a city, town, or private water company designated as having an assured water supply, or a statutory exemption. Source: A.R.S. § 32-2183(G).", "unverified": false}, {"id": "A36", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Acting in concert", "back": "It is unlawful to try to dodge the subdivision article by using a series of owners or conveyances that ends in a subdivision. A family relationship alone is not enough. A licensee is liable when the licensee knew, or with reasonable diligence should have known, that the land was subdivided land. Source: A.R.S. § 32-2181(D).", "unverified": false}, {"id": "A37", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Affidavit of disclosure", "back": "A seller of five or fewer parcels of land, other than subdivided land, in an unincorporated area of a county, and any later seller of such a parcel, must give the buyer a written affidavit of disclosure at least seven days before the transfer. The buyer acknowledges receipt. The buyer may rescind for five days after the affidavit is furnished. A waiver of the seller's liability for an omission or misrepresentation in the affidavit is not valid. The seller records the affidavit when the deed is recorded. It is in at least 12-point type. Source: A.R.S. § 33-422(A)–(E).", "unverified": false}, {"id": "A38", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "What the affidavit covers", "back": "The statutory form asks, among other things, about legal and physical access, road maintenance, floodplain, fissures or expansive soils, utilities, whether water must be hauled, wells, wastewater, solar or battery devices that are leased, zoning, whether the split complies with the land-division statutes, military airport and restricted airspace, and title limits such as a lis pendens. Source: A.R.S. § 33-422(F).", "unverified": false}, {"id": "A39", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Property tax due dates", "back": "Half the tax is due October 1. That half is delinquent after November 1 at 5:00 p.m. The other half is due the following March 1 and is delinquent after May 1 at 5:00 p.m. If the total is $100 or less, the whole amount is due October 1 and is delinquent after December 31 at 5:00 p.m. If the delinquency date is a weekend or legal holiday, delinquency is 5:00 p.m. the next business day. Source: A.R.S. § 42-18052. Whether the exam calls this \"in arrears\" was not confirmed from a statute in this set. Learn the dates.", "unverified": false}, {"id": "A40", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Deed of trust sale timing", "back": "The trustee's power of sale cannot be exercised before the 91st day after the notice of sale is recorded. The sale is not set on a Saturday or a legal holiday. The beneficiary may instead foreclose the deed of trust like a mortgage (judicial). A trustee's sale is not held after a judicial foreclosure is filed unless that case is dismissed. Source: A.R.S. § 33-807.", "unverified": false}, {"id": "A41", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Anti-deficiency", "back": "If trust property of 2.5 acres or less, limited to and used as a single one-family or a single two-family dwelling, is sold by the trustee's power of sale, no action may be brought for the difference between the sale price and the debt. For deeds of trust originated after December 31, 2014, that protection does not apply to a builder's construction loan on a dwelling being built for sale, to a dwelling that was never substantially completed, or to a dwelling that was never actually used as a dwelling. Source: A.R.S. § 33-814(G) and (H).", "unverified": false}, {"id": "A42", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Deficiency when the statute allows one", "back": "Except for the protected homes in A41, a deficiency action after a trustee's sale must be brought within 90 days after the sale. The judgment is the amount owed minus the higher of the sale price or the fair market value on the sale date. If no action is filed in time, the sale satisfies the debt. Source: A.R.S. § 33-814(A) and (D).", "unverified": false}, {"id": "A43", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Active management areas", "back": "ADWR regulates groundwater under the 1980 Groundwater Code. The ADWR overview page, opened October 4, 2026, lists eight AMAs: Prescott, Phoenix, Pinal, Tucson, Santa Cruz, Douglas, Willcox, and Ranegras Plain. In Phoenix, Prescott, and Tucson, the primary goal is safe-yield. An old \"five AMA\" list is out of date. Source: https://www.azwater.gov/ama/active-management-area-overview", "unverified": false}, {"id": "A44", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Irrigation non-expansion areas", "back": "The same ADWR page says the 1980 act created the Joseph City INA and the Douglas INA, and the Harquahala INA was created in 1981. INAs restrict new irrigated acreage. The page lists Douglas both as a current AMA and as an original INA. Do not \"fix\" that. If a question uses an old list, prefer the ADWR page.", "unverified": false}, {"id": "A45", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Prior appropriation", "back": "**Arizona. UNVERIFIED as to statutory wording.** The ADRE curriculum requires the doctrine of prior appropriation. The usual exam meaning is first in time, first in right for surface water, and that a water right is not always transferred just because the land is sold. The surface-water statute was not opened for this set. Do not invent a section number.", "unverified": true}, {"id": "A46", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Escrow in Arizona practice", "back": "Arizona closings run through escrow. The broker does not hold the deed and the money and \"close\" the file the way some states teach. Earnest money the broker does receive goes to the designated broker at once (A13). The closing statement shows receipts, disbursements, and adjustments. FIRPTA (federal withholding when a foreign seller sells U.S. real estate) is a closing issue the older broker outline named. Treat the federal rule as national knowledge. The salesperson state outline puts escrow, title insurance, and lending in one 5-item block.", "unverified": false}, {"id": "A47", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Title insurance at an Arizona closing", "back": "The buyer's owner's policy and the lender's loan policy are ordered in escrow. The policy insures against covered title defects existing at the policy date. Standard exceptions and the commitment's requirements (pay off a lien, record a release) must be cleared or excepted. This is the same national concept, tested again under Arizona \"critical business services.\"", "unverified": false}, {"id": "A48", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Short sale and REO, in plain words", "back": "A short sale is a sale in which the price will not pay off the liens and costs, and the lender agrees to take less. REO is property the lender already took back. The curriculum says disclose a known trustee's sale date. Anti-deficiency may or may not apply. Use A41. Do not tell a seller they are \"protected\" without looking at acreage, use, and whether the loan is a post-2014 builder construction loan.", "unverified": false}, {"id": "A49", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Teams and unlicensed assistants", "back": "The curriculum points to ADRE substantive policy statements (SPS 2025.03 on teams and SPS 2025.02 on unlicensed assistants) rather than a single statute section for the task list. Safe rule from the statutes you do have: an unlicensed person cannot perform acts that require a license, and a salesperson is paid by the broker. Do not invent a list of \"assistant may / may not\" tasks from memory.", "unverified": false}, {"id": "A50", "section": "Arizona. Subdivisions, affidavit, escrow, ownership, foreclosure, water, taxes", "side": "Arizona", "front": "Property management, the license line", "back": "Collecting rent for another, for compensation, is a broker activity. A person who is not licensed, works for a broker or salesperson, collects in-person rent as a clerical duty, and gives a receipt, is carved out of that definition. The designated broker still supervises. Residential leasing agents have a separate limited exemption in § 32-2155(E), which does not remove the broker's duty to supervise. Source: A.R.S. § 32-2101(51)(g); § 32-2155(E).\n\n---", "unverified": false}];
const FILTERS = [
  ["tonight", "Tonight"],
  ["all", "All"],
  ["national", "National"],
  ["arizona", "Arizona"]
];
const tonightSections = new Set([
  "National. Contracts and agency",
  "Arizona. Agency and duties"
]);
let filter = "tonight";
let i = 0;
let flipped = false;
const card = document.getElementById("card");
function deck() {
  if (filter === "all") return CARDS;
  if (filter === "national") return CARDS.filter(c => c.side === "National");
  if (filter === "arizona") return CARDS.filter(c => c.side === "Arizona");
  return CARDS.filter(c => tonightSections.has(c.section));
}
function show() {
  const d = deck();
  if (!d.length) return;
  if (i < 0) i = 0;
  if (i >= d.length) i = d.length - 1;
  const c = d[i];
  flipped = false;
  card.classList.remove("flipped");
  document.getElementById("front").textContent = c.front;
  document.getElementById("back").textContent = c.back;
  for (const id of ["badge", "badge2"]) {
    const el = document.getElementById(id);
    el.textContent = c.side;
    el.className = "badge" + (c.side === "National" ? " nat" : "");
  }
  document.getElementById("warn").hidden = !c.unverified;
  document.getElementById("count").textContent = (i + 1) + " / " + d.length;
  document.getElementById("sec").textContent = c.section.replace("National. ", "").replace("Arizona. ", "");
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === d.length - 1;
}
function go(n) {
  const d = deck();
  i = Math.max(0, Math.min(d.length - 1, i + n));
  show();
}
card.addEventListener("click", () => {
  if (swiped) { swiped = false; return; }
  flipped = !flipped;
  card.classList.toggle("flipped", flipped);
});
document.getElementById("prev").addEventListener("click", (e) => { e.stopPropagation(); go(-1); });
document.getElementById("next").addEventListener("click", (e) => { e.stopPropagation(); go(1); });
let x0 = null;
let swiped = false;
card.addEventListener("touchstart", (e) => { x0 = e.changedTouches[0].clientX; swiped = false; }, {passive: true});
card.addEventListener("touchend", (e) => {
  if (x0 == null) return;
  const dx = e.changedTouches[0].clientX - x0;
  x0 = null;
  if (Math.abs(dx) < 50) return;
  swiped = true;
  go(dx < 0 ? 1 : -1);
}, {passive: true});
card.addEventListener("click", (e) => {
  if (swiped) { swiped = false; e.stopImmediatePropagation(); }
}, true);
const bar = document.getElementById("filters");
FILTERS.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.className = "chip" + (id === filter ? " on" : "");
  b.textContent = label;
  b.addEventListener("click", () => {
    filter = id; i = 0;
    for (const el of bar.children) el.classList.toggle("on", el === b);
    show();
  });
  bar.appendChild(b);
});
show();
</script>
</body>
</html>
