<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZ exam questions</title>
<style>
  :root { --bg:#10211c; --paper:#f6f1e7; --ink:#1c1915; --muted:#5c564c; --good:#1f6b4a; --bad:#8d2f2f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--paper);
    min-height: 100dvh; display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header { padding: 14px 4px 8px; display:flex; justify-content:space-between; align-items:baseline; }
  h1 { font-size: 15px; margin:0; letter-spacing:.03em; }
  #count { font-size: 14px; opacity:.8; }
  main { flex:1; display:flex; flex-direction:column; gap:14px; width:min(100%, 520px); margin: 8px auto 0; }
  .stem { font-family: Georgia, "Iowan Old Style", serif; font-size: 22px; line-height: 1.35; margin: 8px 4px 4px; }
  .choices { display:flex; flex-direction:column; gap:10px; }
  button.choice {
    text-align:left; border:0; border-radius:16px; background: var(--paper); color: var(--ink);
    padding: 14px 16px; font-size: 16px; line-height: 1.35;
  }
  button.choice.bad { background:#f3d6d6; color: var(--bad); }
  button.choice.good { background:#d7eadf; color: var(--good); }
  button.choice:disabled { }
  .why {
    background:#1c3a31; border-radius:16px; padding:14px 16px; font-size:16px; line-height:1.4;
  }
  footer { display:grid; grid-template-columns: 1fr 72px; gap:10px; padding: 12px 0 10px; width:min(100%,520px); margin:0 auto; }
  .score { align-self:center; font-size:14px; opacity:.85; }
  .nav { height:56px; border:0; border-radius:16px; background:#1c3a31; color:#f6f1e7; font-size:28px; }
  .nav:disabled { opacity:.35; }
</style>
</head>
<body>
<header><h1>Arizona exam questions</h1><div id="count"></div></header>
<main>
  <p class="stem" id="stem"></p>
  <div class="choices" id="choices"></div>
  <div class="why" id="why" hidden></div>
</main>
<footer>
  <div class="score" id="score"></div>
  <button class="nav" id="next" aria-label="Next question" disabled>›</button>
</footer>
<script>
const Q = [{"id": "1-1", "stem": "A seller accepts a buyer's offer. Before closing, the seller still holds the deed. The buyer holds", "choices": ["legal title.", "equitable title.", "a life estate.", "no interest until the deed is recorded."], "correct": 1, "why": "Signing the purchase contract gives the buyer equitable title.; The seller keeps legal title until the deed is delivered."}, {"id": "1-2", "stem": "Which listing pays the listing broker if the property sells during the term, even when the owner finds the buyer?", "choices": ["Open listing", "Exclusive agency listing", "Exclusive right-to-sell listing", "Net listing"], "correct": 2, "why": "An exclusive right-to-sell listing pays the listing broker no matter who procures the buyer.; Exclusive agency does not pay the broker if the owner sells alone."}, {"id": "1-3", "stem": "A contract with a minor to buy a house is usually", "choices": ["void, and neither party can enforce it.", "voidable by the minor.", "valid if the minor paid earnest money.", "unenforceable only because of the statute of frauds."], "correct": 1, "why": "A contract with a minor is voidable by the minor, not automatically void.; The statute of frauds is a different defense."}, {"id": "1-4", "stem": "An acre contains", "choices": ["5,280 square feet.", "43,560 square feet.", "640 square feet.", "7,500 square feet."], "correct": 1, "why": "Memorize 43,560 square feet per acre.; 5,280 is feet in a mile.; 640 is acres in a section."}, {"id": "1-5", "stem": "A lot is 200 feet by 300 feet. How many acres is it, rounded to two decimal places?", "choices": ["1.26", "1.38", "1.50", "6.00"], "correct": 1, "why": "200 × 300 = 60,000 square feet.; 60,000 ÷ 43,560 = 1.377 acres, which rounds to 1.38."}, {"id": "1-6", "stem": "The sales price is $420,000. The commission is 5.5%, split evenly between the listing brokerage and the selling brokerage. The selling salesperson is paid 60% of the selling brokerage's share. What does that salesperson earn?", "choices": ["$6,930", "$11,550", "$13,860", "$23,100"], "correct": 0, "why": "$420,000 × 0.055 = $23,100 total commission.; Half is $11,550 to the selling brokerage.; 60% of $11,550 is $6,930."}, {"id": "1-7", "stem": "A seller wants $285,000 after a 6% commission. There are no other selling costs. What sale price is required, rounded to the nearest dollar?", "choices": ["$302,100", "$303,191", "$304,800", "$268,000"], "correct": 1, "why": "Sale price × (1 − 0.06) = $285,000, so price = $285,000 ÷ 0.94 = $303,191.49, which rounds to $303,191."}, {"id": "1-8", "stem": "Which estate ends on a fixed date with no notice required?", "choices": ["Estate at will", "Periodic estate", "Estate for years", "Estate at sufferance"], "correct": 2, "why": "An estate for years has a stated end date.; A periodic estate renews until notice.; Sufferance is a holdover."}, {"id": "1-9", "stem": "A quitclaim deed", "choices": ["warrants title against every claim in the chain.", "warrants title only for the time the grantor owned the property.", "transfers whatever interest the grantor has, with no warranties.", "is valid only if it is recorded."], "correct": 2, "why": "A quitclaim deed makes no title warranties.; Recording protects priority.; It is not what makes the deed valid between the parties."}, {"id": "1-10", "stem": "In the cost approach, a outdated floor plan that buyers dislike is", "choices": ["physical deterioration.", "functional obsolescence.", "external obsolescence.", "regression."], "correct": 1, "why": "A design flaw inside the property is functional obsolescence.; A nearby nuisance outside the property lines is external obsolescence."}, {"id": "1-11", "stem": "Net operating income is $48,000. The capitalization rate investors want is 8%. What is the indicated value?", "choices": ["$384,000", "$520,000", "$600,000", "$3,840,000"], "correct": 2, "why": "Value = NOI ÷ cap rate = $48,000 ÷ 0.08 = $600,000.; Do not subtract debt service before you call it NOI."}, {"id": "1-12", "stem": "A buyer is purchasing a house built in 1972. Federal lead-based paint rules require the seller to", "choices": ["remove all lead-based paint before closing.", "disclose known lead-based paint and give the buyer the EPA pamphlet, with a chance to inspect.", "pay for a lead inspection whether or not the buyer asks.", "say nothing unless the buyer is pregnant."], "correct": 1, "why": "Pre-1978 housing: disclose known lead-based paint, give the pamphlet, and give the buyer up to 10 days to inspect unless the buyer waives the inspection.; Removal is not automatic."}, {"id": "1-13", "stem": "Steering is", "choices": ["telling owners that a protected class is moving in so they will list now.", "directing buyers toward or away from neighborhoods because of a protected class.", "refusing a loan because the property is in a minority neighborhood.", "charging a higher commission only to sellers of vacant land."], "correct": 1, "why": "Steering is channeling buyers by a protected class.; Choice A is blockbusting.; Choice C is redlining by a lender."}, {"id": "1-14", "stem": "Under the Arizona statute of frauds, which agreement must be in writing to support a lawsuit?", "choices": ["A month-to-month rental.", "A lease for exactly six months.", "A lease for a period longer than one year.", "An agreement to cut a neighbor's lawn for $200."], "correct": 2, "why": "A.R.S.; § 44-101(6) covers a lease for longer than one year, and a sale of real property.; A lease of one year or less is outside that clause."}, {"id": "1-15", "stem": "Arizona Constitution Article 26 lets a licensed salesperson", "choices": ["charge a separate document-preparation fee to draft a deed for a client.", "give legal advice on how to take title.", "draft or complete instruments incident to a transaction in which the licensee is acting as broker or salesperson for a party, without a separate charge.", "represent a buyer in court."], "correct": 2, "why": "Article 26, Section 1, allows the drafting only as an incident of the licensed work, and without a separate charge.; It does not authorize a law practice."}, {"id": "1-16", "stem": "The real estate recovery fund's maximum payment is", "choices": ["$30,000 per transaction and $90,000 per licensee.", "$90,000 per transaction and $30,000 per licensee.", "$20,000 per transaction with no cap per licensee.", "unlimited if the licensee is judgment-proof."], "correct": 0, "why": "A.R.S.; § 32-2186(B): $30,000 for each transaction and $90,000 for each licensee."}, {"id": "1-17", "stem": "The recovery fund will pay", "choices": ["lost profits on a deal that never closed.", "a loss on land in Nevada.", "an actual out-of-pocket loss, including reasonable attorney fees, from an Arizona transaction in which the licensee committed fraud as a principal and the victim relied on the license.", "punitive damages."], "correct": 2, "why": "The fund pays actual direct out-of-pocket loss, including reasonable attorney fees, in the situations the statute lists.; It does not pay lost profits, out-of-state property, or punitive damages."}, {"id": "1-18", "stem": "A subdivider in Arizona offers eight lots for sale. Before offering them, the subdivider must", "choices": ["record an affidavit of disclosure and nothing else.", "obtain a public report, unless a statutory exemption applies.", "wait until six lots have already been sold.", "get a broker's license in addition to the subdivider's notice."], "correct": 1, "why": "Six or more lots is a subdivision.; A.R.S.; § 32-2183(I) bars a sale or lease, or an offer to sell or lease, before a public report, unless an exemption applies.; The affidavit of disclosure is for five or fewer unsubdivided parcels in an unincorporated area."}, {"id": "1-19", "stem": "A buyer signs a contract to buy a subdivision lot. The subdivider never delivered the public report. The buyer may", "choices": ["do nothing, because recording the deed cures the failure.", "rescind, if the action is brought within three years after the buyer signed.", "rescind only within five days.", "recover from the recovery fund without a judgment."], "correct": 1, "why": "A sale before the public report is issued, or a failure to deliver it, is rescindable.; The action must be brought within three years after the buyer signs.; A.R.S.; § 32-2183(I)."}, {"id": "1-20", "stem": "An affidavit of disclosure is required when a seller transfers", "choices": ["one lot inside a platted subdivision in Phoenix.", "five or fewer parcels, other than subdivided land, in an unincorporated area of a county.", "any house in an active management area.", "six or more lots under a common promotional plan."], "correct": 1, "why": "A.R.S.; § 33-422 applies to five or fewer parcels, other than subdivided land, in an unincorporated county area.; Six or more lots is the subdivision track, which uses a public report."}, {"id": "1-21", "stem": "The seller must furnish that affidavit", "choices": ["at least seven days before the transfer, and the buyer has five days after receiving it to rescind.", "at closing only, with no right to rescind.", "within seven days after recording.", "only if the buyer asks in writing."], "correct": 0, "why": "Furnish it at least seven days before transfer.; The buyer may rescind for five days after it is furnished.; A waiver of the seller's liability for a bad affidavit is not valid."}, {"id": "1-22", "stem": "A licensee advertises a listing and leaves the brokerage name off so the ad looks like a sale by owner. This violates", "choices": ["the homestead statute.", "the rule against advertising that implies no broker or salesperson is involved.", "Article 26.", "the anti-deficiency statute."], "correct": 1, "why": "A.A.C.; R4-28-502(A) bars a blind ad.; The employing broker's name must also appear in a clear and prominent way under R4-28-502(E)."}, {"id": "1-23", "stem": "A licensed salesperson is selling a house the salesperson owns. The ad must include", "choices": ["the words \"owner/agent.\"", "the salesperson's license number only, with no broker name.", "the recovery fund balance.", "nothing extra, because the salesperson is the owner."], "correct": 0, "why": "R4-28-502(B) requires \"owner/agent.\" The employing broker's name is still required under R4-28-502(E).; The license number alone does not replace either disclosure."}, {"id": "1-24", "stem": "A licensee owes the client a fiduciary duty and must", "choices": ["deal fairly with the other parties as well.", "keep material property defects confidential if the seller asks.", "disclose a suicide on the property.", "represent both sides without written consent if the commission is shared."], "correct": 0, "why": "R4-28-1101(A): fiduciary duty to the client, and deal fairly with all other parties.; Known material defects are disclosed in writing under R4-28-1101(B).; A suicide is not a required disclosure under A.R.S.; § 32-2156."}, {"id": "1-25", "stem": "Before the parties sign a binding contract, a licensee who is buying the property for the licensee's own account must", "choices": ["say nothing until after closing.", "disclose in writing that the licensee has a license and is acting as a principal.", "disclose only to the designated broker.", "put \"owner/agent\" on the yard sign and do nothing else."], "correct": 1, "why": "R4-28-1101(E) requires written disclosure, before a binding agreement, that the licensee is licensed and is acting as a principal."}, {"id": "1-26", "stem": "A salesperson receives an earnest-money check on a Saturday offer. The salesperson must", "choices": ["deposit it in the salesperson's personal account until Monday.", "place it promptly in the care of the designated broker.", "hold it until the offer is accepted, then give it to the title company without telling the broker.", "cash it and deliver the cash to the seller."], "correct": 1, "why": "A.R.S.; § 32-2151.01(D): licensees promptly place transaction funds in the care of the designated broker."}, {"id": "1-27", "stem": "The designated broker must review a purchase contract and initial it", "choices": ["within 10 business days after execution.", "within 10 calendar days, counting Sundays.", "only if the transaction fails.", "within 91 days."], "correct": 0, "why": "A.R.S.; § 32-2151.01(G): within 10 business days.; A business day is not a Saturday, Sunday, or Arizona legal holiday."}, {"id": "1-28", "stem": "Arizona real property taxes of more than $100", "choices": ["are due in full on January 1.", "are half due October 1, delinquent after November 1 at 5:00 p.m., and half due the following March 1, delinquent after May 1 at 5:00 p.m.", "are delinquent on October 1 and May 1.", "are due March 1 and September 1."], "correct": 1, "why": "A.R.S.; § 42-18052.; If the total tax is $100 or less, the whole amount is due October 1 and delinquent after December 31 at 5:00 p.m."}, {"id": "1-29", "stem": "A trustee's sale under a deed of trust in Arizona", "choices": ["may be held the day after the notice of sale is recorded.", "may not be held before the 91st day after the notice of sale is recorded.", "is always a judicial foreclosure.", "wipes out property tax liens automatically."], "correct": 1, "why": "A.R.S.; § 33-807(D): not before the 91st day after the notice of sale is recorded, and not on a Saturday or legal holiday.; Judicial foreclosure is an option, not the only path."}, {"id": "1-30", "stem": "A trustee sells a person's home. The lot is 1.2 acres. The home is a single-family house the owner lived in. The deed of trust was a purchase loan made in 2019. The lender", "choices": ["may sue for a deficiency within 90 days.", "may not sue for the difference between the debt and the trustee's sale price.", "may sue only if the home was never finished.", "must foreclose judicially because the lot is under 2.5 acres."], "correct": 1, "why": "A.R.S.; § 33-814(G): 2.5 acres or less, limited to and used as a single one-family or single two-family dwelling, sold by trustee's sale, no deficiency action.; The builder exceptions in subsection H are for a different set of facts."}, {"id": "1-31", "stem": "Property acquired by one spouse during the marriage is community property unless it was", "choices": ["paid for with wages.", "acquired by gift, devise, or descent.", "a house the couple lived in.", "refinanced during the marriage."], "correct": 1, "why": "A.R.S.; § 25-211.; Wages earned during the marriage are community property.; A gift, devise, or descent is not."}, {"id": "1-32", "stem": "The statutory homestead base, before the annual cost-of-living adjustment that started January 1, 2024, is", "choices": ["$150,000.", "$250,000.", "$400,000 of equity.", "the full value of the home with no cap."], "correct": 2, "why": "A.R.S.; § 33-1101 sets $400,000, then adjusts it each January 1 starting in 2024.; Do not memorize an old $150,000 figure.; The statute page does not state the 2026 adjusted amount."}, {"id": "1-33", "stem": "ADWR's overview, as of the page used for this set, lists how many active management areas?", "choices": ["Three", "Five", "Six", "Eight"], "correct": 3, "why": "The ADWR active-management-area overview opened for this set lists eight: Prescott, Phoenix, Pinal, Tucson, Santa Cruz, Douglas, Willcox, and Ranegras Plain."}, {"id": "1-34", "stem": "Inside an active management area, the commissioner denies a subdivision public report unless the subdivider has", "choices": ["a certificate of assured water supply, or a written commitment from a designated provider, or a statutory exemption.", "an irrigation grandfathered right only.", "a well permit and nothing more.", "a CAP subcontract in every case."], "correct": 0, "why": "A.R.S.; § 32-2183(G).; Assured water supply, or a commitment from a designated city, town, or private water company, or an exemption in that statute."}, {"id": "1-35", "stem": "A licensee does not have to disclose that the property", "choices": ["has a known cracked foundation.", "was the site of a suicide.", "is subject to a recorded lien the licensee knows about.", "has an unpermitted addition the licensee knows about."], "correct": 1, "why": "A.R.S.; § 32-2156.; Death, including suicide, is not a required disclosure and is not grounds to rescind.; Known material defects and known liens must be disclosed in writing under R4-28-1101(B)."}, {"id": "1-36", "stem": "Annual property taxes are $3,650 and have not been paid. Closing is on day 166 of a 365-day year. The seller owns the day of closing. The proration charges the seller for 166 days. What is the seller's tax debit?", "choices": ["$1,460", "$1,660", "$1,825", "$3,650"], "correct": 1, "why": "$3,650 ÷ 365 = $10 a day.; 166 × $10 = $1,660.; Debit the seller and credit the buyer when the buyer will be responsible for the unpaid annual bill."}, {"id": "1-37", "stem": "The price is $360,000. The appraisal is $350,000. The lender will loan 90% of the lower of price or appraisal. The buyer must bring the rest of the price in cash. What is the loan amount, and what cash does the buyer need for the price?", "choices": ["Loan $324,000; cash $36,000", "Loan $315,000; cash $45,000", "Loan $315,000; cash $35,000", "Loan $350,000; cash $10,000"], "correct": 1, "why": "The lender uses $350,000, the lower figure.; 90% × $350,000 = $315,000 loan.; Cash to make up the $360,000 price is $360,000 − $315,000 = $45,000."}, {"id": "1-38", "stem": "A buyer borrows $240,000, interest only, at 6.5% a year, and pays two discount points at closing. The monthly interest and the points are", "choices": ["$1,300 a month and $4,800 in points.", "$1,560 a month and $4,800 in points.", "$1,300 a month and $2,400 in points.", "$15,600 a month and $4,800 in points."], "correct": 0, "why": "Annual interest = $240,000 × 0.065 = $15,600.; Monthly interest = $15,600 ÷ 12 = $1,300.; Two points = 2% of the loan = $4,800.; Points are based on the loan, not the price."}, {"id": "1-39", "stem": "A house is 40 feet by 30 feet. An attached garage is 20 feet by 22 feet. What is the total area?", "choices": ["1,200 square feet", "1,440 square feet", "1,640 square feet", "2,200 square feet"], "correct": 2, "why": "40 × 30 = 1,200.; 20 × 22 = 440.; Total 1,640 square feet."}, {"id": "1-40", "stem": "An ad offers \"only $999 a month\" on a financed purchase and gives no other credit terms. Under Regulation Z this is", "choices": ["fine, because the APR is optional.", "a trigger term, so the ad must also include the other required disclosures, including the APR.", "illegal only if the property is in an AMA.", "a RESPA kickback. ---"], "correct": 1, "why": "A payment amount is a Regulation Z trigger term.; The ad must then state the other required terms, including the APR.; This is federal lending law, not an Arizona water rule."}, {"id": "2-1", "stem": "A shop tenant bolts display shelves to the wall. The lease says the tenant may remove them. At the end of the lease the shelves are", "choices": ["trade fixtures. The tenant may remove them before the lease ends and must repair damage from the removal.", "real property that belongs to the landlord.", "emblements.", "real property because the method of attachment is the only test that matters."], "correct": 0, "why": "Trade fixtures are personal property the tenant installed for business.; The tenant may remove them before the lease ends.; Intention and the parties' agreement outweigh a bolt in the wall.; Emblements are annual crops."}, {"id": "2-2", "stem": "A metes-and-bounds description starts at a monument, follows courses and distances, and never returns to the point of beginning. The description is", "choices": ["valid if the street address is added.", "the same thing as a lot-and-block description.", "defective. The description must close.", "cured by recording a deed of trust."], "correct": 2, "why": "A metes-and-bounds description starts at a point of beginning and must return to it.; A street address is not a legal description.; Lot-and-block uses a recorded plat.; A deed of trust is a security instrument, not a way to fix a bad description."}, {"id": "2-3", "stem": "The city changes the zoning on a parcel and does not pay the owner. That action is", "choices": ["eminent domain, and the owner must be paid just compensation.", "escheat.", "a special warranty deed.", "police power. Zoning does not require compensation."], "correct": 3, "why": "PETE: police power (zoning, building codes) does not pay the owner.; Eminent domain takes property for public use and requires just compensation.; The court process is condemnation.; Escheat is a different government power.; It is question 4."}, {"id": "2-4", "stem": "A person dies with no will and no heirs. The real estate passes to the state by", "choices": ["eminent domain.", "escheat.", "a quitclaim from the heirs.", "accretion."], "correct": 1, "why": "Escheat sends the property to the state when someone dies with no will and no heirs.; It is not a taking for a highway, and it is not accretion (slow deposit of soil)."}, {"id": "2-5", "stem": "A rental ad says \"no children.\" Under the federal Fair Housing Act this is", "choices": ["discrimination based on familial status.", "legal, because age and marital status are the Act's protected classes.", "blockbusting.", "legal if the building was built before 1978."], "correct": 0, "why": "Federal fair housing protected classes include familial status.; \"No children\" states a preference against families with children.; Age and marital status are Equal Credit Opportunity Act categories, not the seven Fair Housing Act classes.; Housing for older persons can be exempt from familial status (62 and over, or 55 and over if at least 80% of occupied units have a resident 55 or older).; A lead-paint year has nothing to do with this ad.; Steering, which Sunday's set tested, is directing buyers.; This ad is a different violation."}, {"id": "2-6", "stem": "The N 1/2 of the SW 1/4 of the SE 1/4 of a standard section contains", "choices": ["10 acres.", "40 acres.", "80 acres.", "20 acres."], "correct": 3, "why": "Read a rectangular description from the end.; A section is 640 acres.; The SE 1/4 is 640 ÷ 4 = 160.; The SW 1/4 of that is 160 ÷ 4 = 40.; The N 1/2 of that is 40 ÷ 2 = 20 acres.; Stopping at 40, or at 80, is the usual miss."}, {"id": "2-7", "stem": "A rectangular parcel is 330 feet by 660 feet. How many acres is it?", "choices": ["2", "7.56", "5", "10"], "correct": 2, "why": "330 × 660 = 217,800 square feet.; 217,800 ÷ 43,560 = 5 acres exactly.; 43,560 is not printed on the exam.; 5,280 is feet in a mile, not square feet in an acre."}, {"id": "2-8", "stem": "Two sisters take title as joint tenants with right of survivorship. One dies. Her will leaves \"my half\" to her son. Who owns that share?", "choices": ["The son, because a will always beats survivorship.", "The surviving sister. A will does not defeat a joint tenancy that was still in place at death.", "The son and the sister, as tenants in common, half each.", "The state, by escheat."], "correct": 1, "why": "Joint tenancy carries the right of survivorship if the four unities (time, title, interest, possession) are still intact.; At death the share passes to the surviving joint tenant.; It is not in the estate for the will to give away.; A transfer during life can break the survivorship as to that share.; This fact pattern has no transfer before death."}, {"id": "2-9", "stem": "A grantor warrants title only against defects that arose while that grantor owned the property. The deed is", "choices": ["a special warranty deed.", "a general warranty deed.", "a quitclaim deed.", "a deed of trust."], "correct": 0, "why": "A special warranty deed warrants only against defects from the grantor's own period of ownership.; A general warranty deed covers the chain.; A quitclaim deed, tested Sunday, gives no warranties.; A deed of trust is not a deed of conveyance between seller and buyer."}, {"id": "2-10", "stem": "Between the grantor and the grantee, a signed deed transfers title when it is", "choices": ["recorded at the county.", "acknowledged, even if the grantor keeps it in a desk and never delivers it.", "delivered and accepted.", "approved by the assessor."], "correct": 2, "why": "Delivery and acceptance make the deed effective between the parties.; Recording is not required for that.; Recording gives constructive notice and protects priority against later buyers.; Acknowledgment is what lets the deed be recorded.; It does not replace delivery."}, {"id": "2-11", "stem": "Which lien is generally first in priority?", "choices": ["A mortgage recorded yesterday.", "A judgment recorded three years ago.", "An unpaid contractor invoice that was never recorded.", "The property tax lien."], "correct": 3, "why": "Property tax liens generally jump ahead of mortgages and judgments.; After that, priority is usually first in time, first in right, by recording.; A mechanic's lien can relate back to when the work started, which is why an unrecorded invoice alone is not the answer."}, {"id": "2-12", "stem": "A factory opens next door. Buyers will pay less for the house because of the noise. In the cost approach, that loss is", "choices": ["physical deterioration.", "external obsolescence. Land is not depreciated.", "functional obsolescence.", "depreciation of the land."], "correct": 1, "why": "External (economic) obsolescence comes from outside the property lines.; A bad floor plan inside the house is functional obsolescence, which Sunday's set tested.; Wear and tear is physical deterioration.; You depreciate the building.; You do not depreciate land."}, {"id": "2-13", "stem": "A comparable sold for $310,000. It has a garage the subject property does not have. The garage is worth $12,000. You are adjusting the comparable to the subject. The adjusted price is", "choices": ["$322,000.", "$310,000.", "$298,000.", "$12,000."], "correct": 2, "why": "Adjust the comparable, not the subject.; The comparable is better, so subtract.; $310,000 − $12,000 = $298,000.; If the subject were the one with the garage, you would add to the comparable."}, {"id": "2-14", "stem": "Replacement cost of the building is $240,000. Economic life is 60 years. Effective age is 15 years. Land is worth $70,000. Straight-line age-life depreciation gives an indicated value of", "choices": ["$250,000.", "$180,000.", "$310,000.", "$370,000."], "correct": 0, "why": "Depreciation fraction = effective age ÷ economic life = 15 ÷ 60 = 0.25.; Depreciation = 0.25 × $240,000 = $60,000.; Depreciated building = $240,000 − $60,000 = $180,000.; Add land, which is not depreciated: $180,000 + $70,000 = $250,000.; $180,000 forgot the land.; $310,000 added the land and forgot to subtract depreciation ($240,000 + $70,000).; $370,000 added the depreciation instead of subtracting it."}, {"id": "2-15", "stem": "Net operating income is $27,000. The property sold for $337,500. The capitalization rate is", "choices": ["6%.", "10%.", "12.5%.", "8%."], "correct": 3, "why": "Cap rate = NOI ÷ value = $27,000 ÷ $337,500 = 0.08, which is 8%.; Value = NOI ÷ cap rate is the other direction.; Sunday's set gave you the rate and asked for value.; 12.5% is value ÷ NOI ($337,500 ÷ $27,000), which is backwards.; Do not subtract the mortgage payment before you call the income NOI."}, {"id": "2-16", "stem": "On a deed of trust, the borrower is the", "choices": ["beneficiary.", "trustor.", "trustee.", "mortgagee."], "correct": 1, "why": "Deed of trust: trustor is the borrower, beneficiary is the lender, trustee holds the power of sale.; Mortgagee is the lender on a mortgage, a two-party instrument.; Arizona's usual security instrument is the deed of trust."}, {"id": "2-17", "stem": "A typical VA loan for an eligible veteran differs from a conventional loan above 80% loan-to-value because the VA loan", "choices": ["is insured by FHA and uses monthly private mortgage insurance.", "is a contract for deed, so the seller keeps legal title.", "cannot be sold on the secondary market.", "is a government guarantee and uses a funding fee, not conventional PMI."], "correct": 3, "why": "Conventional loans are not government-insured or government-guaranteed.; PMI is common above 80% loan-to-value.; FHA insures the loan and charges a mortgage insurance premium.; VA guarantees part of the loan for an eligible veteran and charges a funding fee, not conventional PMI.; A VA loan can often be made with no down payment.; It can be sold to the secondary market.; A contract for deed is seller financing, and the seller keeps legal title until paid."}, {"id": "2-18", "stem": "For most closed-end consumer mortgages covered by TRID, the creditor must", "choices": ["deliver or place the Loan Estimate in the mail no later than the third business day after receiving the application, and make sure the consumer receives the Closing Disclosure at least three business days before consummation.", "mail the Closing Disclosure within three business days after application, and the Loan Estimate after consummation.", "use the HUD-1 and the old early TIL disclosure on every loan, including reverse mortgages, because TRID replaced nothing.", "skip both forms if the advertisement states a monthly payment."], "correct": 0, "why": "TRID uses the Loan Estimate and the Closing Disclosure for most closed-end consumer mortgages.; The creditor delivers or mails the Loan Estimate no later than the third business day after receiving the application.; The consumer must receive the Closing Disclosure at least three business days before consummation.; Source opened: CFPB TILA-RESPA disclosure guide and Regulation Z § 1026.19.; Reverse mortgages and HELOCs stay on the older disclosures.; A monthly payment in an ad is a Regulation Z trigger term.; It does not replace the Loan Estimate."}, {"id": "2-19", "stem": "A title company pays a salesperson $200 cash for each buyer the salesperson sends to that company on a federally related mortgage. The salesperson does no title work. This is", "choices": ["legal if the check says \"marketing.\"", "required by the Equal Credit Opportunity Act.", "a RESPA violation. A fee for referring settlement-service business is a kickback.", "legal because the salesperson attends the closing."], "correct": 2, "why": "RESPA Section 8, 12 U.S.C.; § 2607 and 12 C.F.R.; § 1024.14, bars a fee, kickback, or other thing of value for referring settlement-service business on a federally related mortgage.; Relabeling it does not fix it.; Payment for services actually performed is different from pay for the referral itself.; ECOA is a fair-lending law, not a referral-fee law."}, {"id": "2-20", "stem": "A lender denies a home loan because the applicant's income is Social Security. This violates", "choices": ["RESPA's ban on kickbacks.", "the Equal Credit Opportunity Act, which bars discrimination because income comes from public assistance.", "Article 26 of the Arizona Constitution.", "the lead-paint disclosure rule."], "correct": 1, "why": "ECOA prohibits a creditor from discriminating because some or all of the income comes from public assistance.; It also covers race, color, religion, national origin, sex, marital status, and age (if the person can legally contract).; Those last two are not Fair Housing Act classes.; RESPA is settlement costs and kickbacks.; Article 26 is the Arizona document-drafting rule."}, {"id": "2-21", "stem": "The three-business-day right to cancel under Regulation Z", "choices": ["applies to the loan a buyer uses to purchase a home.", "runs for 91 days after a trustee's sale.", "generally applies to a refinance secured by the borrower's principal dwelling, not to the purchase of that dwelling.", "is the same five-day right as an Arizona affidavit of disclosure."], "correct": 2, "why": "Regulation Z's right to rescind generally covers a consumer loan that puts a security interest on the borrower's existing principal dwelling, such as a refinance.; It does not apply to the loan that purchases that dwelling.; It is not the Arizona five-day affidavit period and it is not the 91-day trustee-sale wait."}, {"id": "2-22", "stem": "The house was built in 1968. The seller has disclosed known lead-based paint and given the EPA pamphlet. The buyer's time to conduct a lead inspection is", "choices": ["whatever the seller picks, with no writing required.", "waived automatically because the house is in Arizona.", "three years, the same period as a public-report lawsuit.", "10 days, unless the parties agree in writing to a different period."], "correct": 3, "why": "Target housing is most housing built before 1978.; The seller discloses known lead-based paint, gives available records, gives the pamphlet, and gives the buyer 10 days to have an inspection or risk assessment unless the parties agree in writing to a different period.; Source opened: 40 C.F.R.; Part 745 Subpart F.; There is no automatic duty to remove the paint.; Sunday's question tested the disclosure.; This one tests the 10 days and the written change."}, {"id": "2-23", "stem": "A federally regulated lender makes a loan secured by a house in a FEMA special flood hazard area. Flood insurance is available. The lender", "choices": ["may rely on the homeowners policy, because that policy covers rising water.", "must require flood insurance on the building for the term of the loan. A standard homeowners policy does not cover flood.", "must require the seller to move the house before closing.", "insures the land only. The building is excluded."], "correct": 1, "why": "If the building securing a designated loan is in a special flood hazard area and flood insurance is available, the lender does not make the loan unless the building is covered for the term of the loan.; Source opened: 12 C.F.R.; § 22.3 and 42 U.S.C.; § 4012a.; Coverage is on the building (and secured contents if included), not on the land value.; A standard homeowners policy excludes flood."}, {"id": "2-24", "stem": "Under CERCLA, the current owner of a contaminated site", "choices": ["is not liable if someone else dumped the waste.", "is liable only for the value of the land, never the cleanup.", "is fully protected by a standard owner's title policy in every case.", "can be strictly liable for cleanup. An innocent-landowner defense can apply if the owner made the appropriate inquiry before buying."], "correct": 3, "why": "CERCLA is strict liability.; Current owners and operators can be liable for cleanup even when they did not cause the release.; SARA's innocent-landowner defense depends on appropriate inquiry before the purchase (a Phase I, and more if that inquiry calls for it).; Do not assume a standard title policy pays for hazardous-waste cleanup."}, {"id": "2-25", "stem": "The sale price is $375,000. The commission is 6%, split 60% to the listing brokerage and 40% to the selling brokerage. The selling salesperson receives half of the selling brokerage's share. What does that salesperson earn?", "choices": ["$4,500", "$6,750", "$9,000", "$11,250"], "correct": 0, "why": "$375,000 × 0.06 = $22,500 total commission.; The selling brokerage's 40% is $9,000.; Half of that is $4,500.; $9,000 is the selling brokerage's whole share.; $11,250 is half of the total commission.; The listing brokerage's 60% is $13,500, and half of that is $6,750, which is the wrong side of the split."}, {"id": "2-26", "stem": "The seller wants $226,000 in cash after a 5% commission and $6,000 of other selling costs. What sale price is required, rounded to the nearest dollar?", "choices": ["$232,000", "$244,211", "$240,000", "$243,158"], "correct": 1, "why": "Add the costs that also have to come out of the price, then divide by what the seller keeps after commission.; ($226,000 + $6,000) ÷ (1 − 0.05) = $232,000 ÷ 0.95 = $244,210.53, which rounds to $244,211.; Subtracting the commission from the desired net, or dividing $226,000 by 0.95 and forgetting the $6,000, produces the wrong answers."}, {"id": "2-27", "stem": "The price is $410,000. The appraisal is $400,000. The lender will loan 80% of the lower of price or appraisal. Ignore other closing costs. What is the loan, and how much cash does the buyer need to cover the price?", "choices": ["Loan $328,000; cash $82,000", "Loan $320,000; cash $80,000", "Loan $320,000; cash $90,000", "Loan $400,000; cash $10,000"], "correct": 2, "why": "The lender uses $400,000, the lower of price and appraisal.; 80% × $400,000 = $320,000 loan.; Cash to make the $410,000 price is $410,000 − $320,000 = $90,000.; Using the price instead of the appraisal produces A.; Subtracting the loan from the appraisal instead of the price produces B."}, {"id": "2-28", "stem": "The loan is $320,000. The borrower pays 2.5 discount points. The points cost", "choices": ["$3,200.", "$8,000.", "$6,400.", "$8,200."], "correct": 1, "why": "One discount point is 1% of the loan, not 1% of the price.; 2.5% × $320,000 = $8,000.; $3,200 is one point.; $6,400 is two points.; $8,200 is 2% of the $410,000 price from the previous fact pattern.; Do not mix those bases."}, {"id": "2-29", "stem": "Annual taxes are $4,380 and have not been paid. Use a 365-day year. The question charges the seller for 200 days. The seller's tax debit is", "choices": ["$2,400.", "$1,200.", "$2,200.", "$4,380."], "correct": 0, "why": "$4,380 ÷ 365 = $12 a day.; 200 × $12 = $2,400.; The problem states the day count, so you do not invent who owns the day of closing.; Debit the seller for the days the seller is charged.; $4,380 is the whole year.; Sunday's proration used a different tax bill and a different day count."}, {"id": "2-30", "stem": "A licensee advertises a 21,780-square-foot lot as a \"half-acre homesite.\"", "choices": ["This is fine, because 21,780 is half of 43,560.", "This violates the advertising rule. \"Acre,\" alone or modified, may be used only for land of at least 43,560 square feet.", "This is fine if the ad also says \"owner/agent.\"", "This is governed by the homestead statute, not the advertising rule."], "correct": 1, "why": "A.A.C.; R4-28-502(H): a licensee shall not use \"acre,\" either alone or modified, unless referring to an area of land representing at least 43,560 square feet.; \"Half-acre\" is the word modified, and 21,780 square feet is not at least 43,560.; \"Owner/agent\" is a different required disclosure.; It does not repair a bad acre claim."}, {"id": "2-31", "stem": "A licensee's website offers Arizona property to people in Arizona. The employing broker's name is below the fold. The reader has to scroll to see it.", "choices": ["Scrolling is allowed if the name is somewhere on the site.", "Only the salesperson's first name is required online.", "The designated broker is not responsible for online ads.", "The employing broker's legal name or licensed d.b.a. must be clear and prominent, and an online ad must meet the advertising rules without scrolling."], "correct": 3, "why": "A.A.C.; R4-28-502(E) requires the employing broker's legal name, or the d.b.a.; on the license certificate, in a clear and prominent manner.; R4-28-502(J), as amended effective December 13, 2025, says an online ad aimed at Arizona residents must satisfy the advertising rules on the advertisement without scrolling.; R4-28-502(G): the designated broker is responsible for the advertising of all real estate activity.; Sunday's set tested blind ads and \"owner/agent.\" This one tests the name and the scroll rule."}, {"id": "2-32", "stem": "Which statement about the Arizona homestead is correct?", "choices": ["Memorize a guessed 2026 CPI-adjusted dollar amount and use it as the exemption.", "Each spouse has a separate homestead exemption.", "The statute's base is $400,000. It is adjusted each January 1 starting in 2024, but the statute page does not state the 2026 dollar amount, so do not invent one. A person holds one homestead. Identifiable cash proceeds are protected for 18 months or until a new homestead, whichever is shorter.", "Cash from a refinance is protected for 18 months."], "correct": 2, "why": "A.R.S.; § 33-1101.; Base exemption $400,000 of equity, then a CPI adjustment each January 1 beginning in 2024, rounded as the statute provides.; The statute page opened for this prep does not state the 2026 adjusted dollar amount.; Do not memorize a guess.; One homestead.; A married couple shares one exemption, so C is wrong.; Identifiable cash proceeds are protected for 18 months or until a new homestead, whichever is shorter.; Proceeds of a refinance are not protected, so D is wrong."}, {"id": "2-33", "stem": "A deed of trust originated in 2018. It secures a builder's construction loan on a house being built for sale. The house was never substantially completed. The lot is 1 acre. After the trustee's sale,", "choices": ["the home protection does not apply to this loan. A deficiency action that the statute allows must be brought within 90 days after the sale.", "no deficiency is allowed, because every lot under 2.5 acres is protected.", "the lender has three years to sue, the same period as a public-report claim.", "anti-deficiency applies only when the lot is larger than 2.5 acres."], "correct": 0, "why": "A.R.S.; § 33-814(G) bars a deficiency after a trustee's sale of 2.5 acres or less limited to and used as a single one-family or single two-family dwelling.; Subsection (H) says that protection does not apply, for a deed of trust originated after December 31, 2014, to a builder's construction loan on a dwelling being built for sale, to a dwelling never substantially completed, or to a dwelling never actually used as a dwelling.; This 2018 loan is in that exception.; When a deficiency action is allowed, § 33-814(A) requires it within 90 days after the sale.; The judgment credits the higher of the sale price or the fair market value on the sale date.; Sunday's question was the protected owner-occupied house.; This one is the exception."}, {"id": "2-34", "stem": "The notice of trustee's sale is recorded on a Wednesday. The trustee wants the sale on the first Saturday after the 90th day.", "choices": ["Saturday is allowed if it is after the 90th day.", "The sale may be held the day after recording if the borrower agrees in the ad.", "The sale may not be held before the 91st day after the notice is recorded, and it is not held on a Saturday or a legal holiday.", "A trustee's sale is always a judicial foreclosure, so this timing rule does not apply."], "correct": 2, "why": "A.R.S.; § 33-807.; The power of sale is not exercised before the 91st day after the notice of sale is recorded, and the sale is not set on a Saturday or a legal holiday.; The beneficiary may instead foreclose in court like a mortgage.; A trustee's sale is the nonjudicial path.; Sunday's question tested the 91st day.; This one adds the Saturday bar."}, {"id": "2-35", "stem": "The total property tax on a parcel is $80.", "choices": ["Half is due October 1 and half is due the following March 1.", "It becomes delinquent at 5:00 p.m. on October 1.", "It is due May 1.", "The whole amount is due October 1 and is delinquent after December 31 at 5:00 p.m."], "correct": 3, "why": "A.R.S.; § 42-18052.; If the total tax is $100 or less, all of it is due October 1 and is delinquent after December 31 at 5:00 p.m.; The half-due-October-1 and half-due-March-1 schedule, which Sunday's set tested, is for a bill over $100.; Delinquency on that larger bill is after November 1 at 5:00 p.m.; and after May 1 at 5:00 p.m., not on the due date itself.; If the delinquency date falls on a weekend or legal holiday, it moves to 5:00 p.m.; the next business day."}, {"id": "2-36", "stem": "The real estate recovery fund pays a judgment caused by a licensee. The licensee's licenses under Title 32, Chapter 20", "choices": ["stay active if the licensee finishes 24 hours of continuing education.", "terminate on the date of payment. Reinstatement waits until the judgment is satisfied and the fund is repaid with interest at the legal rate.", "are suspended for 91 days and then return on their own.", "are not affected, because the payment is the same thing as a title policy."], "correct": 1, "why": "The notice required by A.R.S.; § 32-2188, set out in § 32-2188.04: payment from the fund terminates the judgment debtor's licenses under Title 32, Chapter 20, on the date of payment.; The person cannot get them back until the underlying judgment is satisfied and the fund is reimbursed, including interest at the legal rate.; The caps are still $30,000 for one transaction and $90,000 for one licensee, under § 32-2186(B).; The fund does not pay punitive damages, lost profits, or property outside Arizona."}, {"id": "2-37", "stem": "A subdivider has a public report on an eight-lot subdivision. Before the initial buyer signs the purchase contract, the subdivider must", "choices": ["give that buyer a copy of the public report and take a receipt.", "hand the report over within three years after closing.", "use an affidavit of disclosure instead of the public report.", "deliver the report only if the buyer sends a written request."], "correct": 0, "why": "A.R.S.; § 32-2183.; The subdivider gives each initial buyer or lessee a copy of the public report before that person signs, and takes a receipt.; A sale or lease before the report is issued, or a failure to deliver the report, is voidable.; The buyer or lessee must bring the action within three years after signing.; Six or more lots is the subdivision.; The affidavit of disclosure is the other track: five or fewer parcels, unincorporated, not subdivided land.; Sunday's set tested \"get the report\" and the three-year lawsuit.; This one tests delivery and the receipt before the signature."}, {"id": "2-38", "stem": "The buyer of land that needs an affidavit of disclosure signs a clause waiving any claim if the affidavit is false or incomplete.", "choices": ["The waiver is valid if it is notarized.", "The waiver is valid because there are fewer than six parcels, so no affidavit is required at all.", "The waiver extends the buyer's rescission right to three years.", "The waiver is not valid. The seller still records the affidavit when the deed is recorded."], "correct": 3, "why": "A.R.S.; § 33-422.; A waiver of the seller's liability for an omission or misrepresentation in the affidavit is not valid.; The seller records the affidavit at the time the deed is recorded.; The seller also furnishes it at least seven days before the transfer, and the buyer has five days after receiving it to rescind.; The affidavit is required for five or fewer parcels, other than subdivided land, in an unincorporated area.; Fewer than six lots does not cancel it.; The three-year period belongs to a bad subdivision public-report sale, not to this waiver."}, {"id": "2-39", "stem": "The ADWR overview opened for this set states a safe-yield goal for which active management areas?", "choices": ["All eight AMAs.", "Joseph City, Harquahala, and Flagstaff.", "Phoenix, Prescott, and Tucson.", "Only Pinal and Willcox."], "correct": 2, "why": "The ADWR active-management-area overview opened October 4, 2026, lists eight AMAs: Prescott, Phoenix, Pinal, Tucson, Santa Cruz, Douglas, Willcox, and Ranegras Plain.; It states the safe-yield goal for Phoenix, Prescott, and Tucson.; Joseph City and Harquahala are irrigation non-expansion areas on that page, not the safe-yield AMAs.; Flagstaff is not on the list.; The same page discusses Douglas as an original INA and also lists Douglas as an AMA.; Do not \"fix\" that.; Sunday's question asked how many AMAs.; This one asks which three have the safe-yield goal."}, {"id": "2-40", "stem": "Pay earned by one spouse during the marriage is", "choices": ["that spouse's separate property if the other spouse's name is not on the check.", "community property.", "always a homestead, even if the couple rents.", "outside the statute of frauds for that reason alone. ---"], "correct": 1, "why": "A.R.S.; § 25-211.; Property acquired by either spouse during the marriage is community property.; The exceptions include property acquired by gift, devise, or descent.; Wages earned during the marriage are community property even if only one spouse earned them.; Sunday's question tested the gift exception.; The homestead is a separate exemption and does not turn rent into a homestead.; The statute of frauds is about whether an agreement has to be in writing."}];
let i = 0, right = 0, locked = false;
const letters = ["A","B","C","D"];
function render() {
  const q = Q[i];
  locked = false;
  document.getElementById("count").textContent = (i+1) + " / " + Q.length;
  document.getElementById("stem").textContent = q.stem;
  document.getElementById("why").hidden = true;
  document.getElementById("next").disabled = true;
  document.getElementById("score").textContent = right + " right so far";
  const box = document.getElementById("choices");
  box.innerHTML = "";
  q.choices.forEach((text, idx) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = letters[idx] + ". " + text;
    b.addEventListener("click", () => pick(b, idx));
    box.appendChild(b);
  });
}
function pick(btn, idx) {
  if (locked) return;
  const q = Q[i];
  if (idx !== q.correct) {
    btn.classList.add("bad");
    btn.textContent = "Incorrect";
    btn.disabled = true;
    return;
  }
  locked = true;
  right += 1;
  const buttons = document.querySelectorAll(".choice");
  buttons.forEach((b, n) => { b.disabled = true; if (n === q.correct) b.classList.add("good"); });
  const why = document.getElementById("why");
  why.hidden = false;
  why.textContent = q.why;
  document.getElementById("score").textContent = right + " right so far";
  document.getElementById("next").disabled = i === Q.length - 1;
}
document.getElementById("next").addEventListener("click", () => { if (i < Q.length-1) { i++; render(); } });
render();
</script>
</body>
